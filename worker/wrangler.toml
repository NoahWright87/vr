# Cloudflare Worker config for the hosted signaling relay — the
# internet-reachable counterpart to server/signal-server.js. See
# worker/src/signal-hub.js for the room logic and README.md for how
# to deploy this.

name = "vr-signal-relay"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[migrations]]
tag = "v1"
new_classes = ["SignalHub"]
