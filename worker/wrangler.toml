# Cloudflare Worker config for the hosted signaling relay. See
# worker/src/signal-hub.js for the room logic and README.md for how
# to deploy this.

name = "vr-signal-relay"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[durable_objects.bindings]]
name = "SIGNAL_HUB"
class_name = "SignalHub"

[[migrations]]
tag = "v1"
# The Workers Free plan only supports SQLite-backed Durable Object
# storage — new_classes (the older, KV-backed storage) requires
# Workers Paid. SignalHub doesn't use this.state.storage at all, so
# this is purely an account-tier requirement, not a behavior change.
new_sqlite_classes = ["SignalHub"]
