<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menus &amp; HUD | Noah's VR projects</title>
    <link rel="icon" href="../../assets/noah-vr.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Same vendored setup as the prototypes: no build step, just a
         checked-in copy. See /vendor/README.md for why. -->
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;
        font-size: 0.9rem;
      }
      #overlay a {
        color: #9ad;
      }
    </style>
  </head>
  <body>
    <!-- ==============================================================
         MENUS & HUD — a guided tour of the menu system and the visor HUD.

         One menu in front of you picks a demo (tour.js). Each demo puts
         its HUD on the visor and a small scene behind you — turn round,
         or set Facing to Back — with props that use menus the way a game
         would: a gun case, a toolbox, a chest, a wanted board, a lamp. You
         grab them to open their menus. Nothing needs walking to, and the
         thumbsticks do not move you.

           ahead       the tour menu
           behind      the active demo's scene (demo-*.js, #set-<id>)
           your wrist  the watch: hand, hints
           your head   the visor: Facing, Menu font, and the visor's own
                       settings (Adjust, HUD, Targeting)
    ============================================================== -->
    <div id="overlay">
      <span>Menus &amp; HUD — pick a demo from the menu ahead (click it, or press E). Its scene is behind you: drag to look round, or set Facing to Back. F grabs, click fires or drinks, T throws, hold click to drive. Tab: watch. `: visor. <a href="../../index.html">All prototypes</a></span>
    </div>

    <a-scene
      keyboard-shortcuts="enterVR: false"
      visor-menu="page: visor"
      menu-tour
    >
      <a-light id="ambient-light" type="ambient" color="#fff" intensity="0.7"></a-light>
      <a-light id="sun-light" type="directional" position="2 3 2" intensity="0.7"></a-light>
      <a-sky id="showcase-sky" color="#0d1526"></a-sky>
      <a-plane id="floor" rotation="-90 0 0" width="30" height="30" color="#445" position="0 0 0"></a-plane>
      <a-entity id="basics-stars" star-field></a-entity>

      <a-entity
        id="rig"
        position="0 0 0"
        semantic-look-controls="camera: #showcase-camera"
        gamepad-input="leftHand: #left-hand; rightHand: #right-hand; primaryAction: activate; secondaryAction: activate"
        touch-controls="leftHand: #left-hand; rightHand: #right-hand; primaryAction: activate; primaryLabel: USE; secondaryAction: none; interactAction: interact; interactLabel: INTERACT; grabAction: grab; grabLabel: GRAB; watchAction: watch; watchLabel: WATCH; crouchAction: crouch; crouchLabel: CROUCH"
      >
        <a-camera id="showcase-camera" look-controls="pointerLockEnabled: true" wasd-controls="enabled: false">
          <a-entity
            id="gaze-cursor"
            control-mode-visibility="modes: desktop"
            cursor="fuse: false"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
            material="color: #FFFFFF; shader: flat; opacity: 0.8"
            raycaster="objects: .menu-target; far: 10"
          ></a-entity>
        </a-camera>

        <!-- Pointing lives on hand-with-watch's fingertip; the visible,
             animated hand is a separate hand-controls entity. -->
        <a-entity id="left-hand" position="-0.2 1.35 -0.4"
          hand-with-watch="hand: left"
          semantic-hand="hand: left; maxReach: 1.0"
        ></a-entity>
        <a-entity id="tracked-hand-visual-left" control-mode-visibility="modes: xr" hand-controls="hand: left; handModelStyle: lowPoly"></a-entity>
        <a-entity id="right-hand" position="0.2 1.35 -0.4"
          hand-with-watch="hand: right"
          semantic-hand="hand: right; maxReach: 1.0"
        ></a-entity>
        <a-entity id="tracked-hand-visual-right" control-mode-visibility="modes: xr" hand-controls="hand: right; handModelStyle: lowPoly"></a-entity>
      </a-entity>

      <!-- The watch: hand-with-watch finds this template by id. -->
      <template id="watch-crossbar-template">
        <a-entity class="watch-crossbar-panel" visible="false">
          <a-entity class="watch-crossbar"
            position="0 0.17 0"
            crossbar-menu="page: watch; width: 1.2; rowHeight: 0.2; maxChars: 20; open: false; closeBehavior: hide; memory: none; hint: false; stickRange: 0.35; crumbs: title; breadcrumbDepth: 1; plateOpacity: 0.94; exitKey: Tab; exitButton: WATCH; sidecarWidth: 1; sidecarChars: 22"
            crossbar-menu-registration
          ></a-entity>
        </a-entity>
      </template>

      <!-- ============================================================
           AHEAD — THE TOUR MENU. Titles in Wright Sans, rows in B612.
           In reach of a hand (its stick drives it), pointable, and E
           off a headset.
      ============================================================ -->
      <a-entity id="tour-panel"
        position="0 1.32 -0.85"
        crossbar-menu="page: tour; windowSize: 7; width: 1.0; rowHeight: 0.13; rowSpacing: 0.13; maxChars: 22; stickRange: 0.6; closable: false; font: b612; titleFont: wright; hintLabel: Tour menu; sidecarChars: 24"
        crossbar-menu-registration
      ></a-entity>

      <!-- The prop menus: each opens above the prop that owns it. -->
      <template id="tpl-gun-case">
        <a-entity visible="false"><a-entity crossbar-menu="page: gun-case; width: 0.9; rowHeight: 0.13; maxChars: 18; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.6; plateOpacity: 0.9; font: b612; titleFont: wright" crossbar-menu-registration></a-entity></a-entity>
      </template>
      <template id="tpl-toolbox">
        <a-entity visible="false"><a-entity crossbar-menu="page: toolbox; width: 0.9; rowHeight: 0.13; maxChars: 18; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.6; plateOpacity: 0.9; font: b612; titleFont: wright" crossbar-menu-registration></a-entity></a-entity>
      </template>
      <template id="tpl-chest">
        <a-entity visible="false"><a-entity crossbar-menu="page: chest; width: 0.9; rowHeight: 0.13; maxChars: 18; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.6; plateOpacity: 0.9; font: b612; titleFont: wright" crossbar-menu-registration></a-entity></a-entity>
      </template>
      <template id="tpl-wanted">
        <a-entity visible="false"><a-entity crossbar-menu="page: wanted; width: 0.9; rowHeight: 0.13; maxChars: 20; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.6; plateOpacity: 0.9; font: b612; titleFont: wright" crossbar-menu-registration></a-entity></a-entity>
      </template>
      <!-- A grid menu (common/menu-grid.js): tiles, a details pane and a
           wallet, for the general store. -->
      <template id="tpl-store">
        <a-entity visible="false"><a-entity grid-menu="page: general-store; columns: 3; rows: 3; tileWidth: 0.25; gap: 0.025; labelChars: 11; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.8; plateOpacity: 0.92; font: b612; titleFont: wright; detailsWidth: 0.72; detailsChars: 30; detailsContentHeight: 0.26; accent: #ffc56b"></a-entity></a-entity>
      </template>
      <template id="tpl-lamp">
        <a-entity visible="false"><a-entity crossbar-menu="page: lamp; width: 0.9; rowHeight: 0.13; maxChars: 18; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: 0.6; plateOpacity: 0.9; font: b612; titleFont: wright" crossbar-menu-registration></a-entity></a-entity>
      </template>

      <!-- ============================================================
           BEHIND — ONE SCENE PER DEMO, shown only while it is the one
           picked. Each is within reach of where you stand: a table just
           behind you, and a prop with a menu on your right as you face
           it. Kenney models (CC0).
      ============================================================ -->

      <!-- BASICS: a lamp on a side table. -->
      <a-entity id="set-basics">
        <a-box width="0.5" height="0.7" depth="0.4" color="#4a3a2c" position="0 0.35 0.62"></a-box>
        <a-entity id="basics-lamp" position="0 0.71 0.62"
          geometry="primitive: cylinder; radius: 0.09; height: 0.04" material="color: #2b2b30"
          hint-zone="action: grab; radius: 0.32; maxReach: 1.0; gazeThreshold: 0.88; priority: 20; desktopKey: F; desktopLabel: Open lamp menu; xrKey: GRIP; xrLabel: Open; hintOffset: 0 0.6 0"
          projected-menu="template: #tpl-lamp; mode: laser; laserScale: 0.6; offset: 0 0.75 0; closeDistance: 3"
          projected-crossbar
          grab-to-open
        >
          <a-cylinder radius="0.012" height="0.36" position="0 0.2 0" color="#2b2b30"></a-cylinder>
          <a-cone radius-bottom="0.14" radius-top="0.07" height="0.14" position="0 0.42 0" color="#e8d9b8" material="side: double"></a-cone>
          <a-sphere id="basics-bulb" radius="0.04" position="0 0.38 0" material="color: #ffd59a; emissive: #ffd59a"></a-sphere>
          <a-entity id="basics-lamp-light" position="0 0.36 0" light="type: point; color: #ffd59a; intensity: 1.2; distance: 3; decay: 1.5"></a-entity>
        </a-entity>
      </a-entity>

      <!-- SHOOTER: a range, a table, a gun case. -->
      <a-entity id="set-shooter">
        <a-box width="1.0" height="0.76" depth="0.45" color="#3c3f47" position="0 0.38 0.62"></a-box>
        <a-entity id="shooter-gun" data-tour-item="gun" position="0.18 0.84 0.58" rotation="0 180 0"
          simple-grabbable="heldPosition: 0 0 0; floorY: 0; throwEnabled: true; halfExtents: 0.04 0.06 0.17"
          hint-zone="action: grab; radius: 0.28; maxReach: 1.0; gazeThreshold: 0.9; priority: 12; desktopKey: F; desktopLabel: Grab gun; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.22 0"
          tour-gun
        >
          <a-entity class="tour-gun-model" scale="0.4 0.4 0.4"></a-entity>
          <a-entity class="shooter-scope" position="0 0.11 -0.04" rotation="0 180 0" scale="0.4 0.4 0.4"></a-entity>
          <a-entity class="shooter-silencer" gltf-model="../../assets/models/kenney/blaster-kit/silencer-small.glb" position="0 0.075 -0.22" rotation="0 180 0" scale="0.4 0.4 0.4"></a-entity>
          <a-entity class="tour-muzzle" position="0 0.075 -0.2"></a-entity>
        </a-entity>
        <a-entity class="shooter-grenade" data-tour-item="grenade" position="-0.12 0.82 0.55"
          simple-grabbable="heldPosition: 0 0 -0.04; floorY: 0; throwEnabled: true; halfExtents: 0.035 0.06 0.035"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab grenade; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-throwable
        ><a-entity gltf-model="../../assets/models/kenney/blaster-kit/grenade-a.glb" scale="0.5 0.5 0.5" position="0 -0.06 0"></a-entity></a-entity>
        <a-entity class="shooter-grenade" data-tour-item="grenade" position="-0.24 0.82 0.6"
          simple-grabbable="heldPosition: 0 0 -0.04; floorY: 0; throwEnabled: true; halfExtents: 0.035 0.06 0.035"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab grenade; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-throwable
        ><a-entity gltf-model="../../assets/models/kenney/blaster-kit/grenade-a.glb" scale="0.5 0.5 0.5" position="0 -0.06 0"></a-entity></a-entity>
        <a-entity class="shooter-grenade" data-tour-item="grenade" position="-0.36 0.82 0.55"
          simple-grabbable="heldPosition: 0 0 -0.04; floorY: 0; throwEnabled: true; halfExtents: 0.035 0.06 0.035"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab grenade; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-throwable
        ><a-entity gltf-model="../../assets/models/kenney/blaster-kit/grenade-a.glb" scale="0.5 0.5 0.5" position="0 -0.06 0"></a-entity></a-entity>
        <!-- The gun case, on a stand to your right as you face the range. -->
        <a-box width="0.3" height="0.7" depth="0.3" color="#2c2f36" position="-0.62 0.35 0.42"></a-box>
        <a-entity id="shooter-case" position="-0.62 0.78 0.42"
          geometry="primitive: box; width: 0.42; height: 0.16; depth: 0.26" material="visible: false"
          hint-zone="action: grab; radius: 0.34; maxReach: 1.0; gazeThreshold: 0.88; priority: 20; desktopKey: F; desktopLabel: Open gun case; xrKey: GRIP; xrLabel: Open; hintOffset: 0 0.3 0"
          projected-menu="template: #tpl-gun-case; mode: laser; laserScale: 0.6; offset: 0 0.55 0; closeDistance: 3"
          projected-crossbar
          grab-to-open
        ><a-entity gltf-model="../../assets/models/kenney/blaster-kit/crate-wide.glb" scale="0.5 0.5 0.5" position="0 -0.08 0"></a-entity></a-entity>
        <!-- The range. -->
        <a-entity tour-target aim-target="offset: 0 1.4 0; radius: 0.5" position="-1.6 0 4.5" rotation="0 160 0">
          <a-cylinder radius="0.04" height="1.4" position="0 0.7 0" color="#5b4a3a"></a-cylinder>
          <a-entity class="tour-face" gltf-model="../../assets/models/kenney/blaster-kit/target-large.glb" position="0 1.4 0" rotation="0 90 0" scale="3 3 3"></a-entity>
        </a-entity>
        <a-entity tour-target aim-target="offset: 0 1.7 0; radius: 0.5" position="0.4 0 6" rotation="0 180 0">
          <a-cylinder radius="0.04" height="1.7" position="0 0.85 0" color="#5b4a3a"></a-cylinder>
          <a-entity class="tour-face" gltf-model="../../assets/models/kenney/blaster-kit/target-large.glb" position="0 1.7 0" rotation="0 90 0" scale="3 3 3"></a-entity>
        </a-entity>
        <a-entity tour-target aim-target="offset: 0 1.2 0; radius: 0.32" position="2 0 5" rotation="0 200 0">
          <a-cylinder radius="0.04" height="1.2" position="0 0.6 0" color="#5b4a3a"></a-cylinder>
          <a-entity class="tour-face" gltf-model="../../assets/models/kenney/blaster-kit/target-small.glb" position="0 1.2 0" rotation="0 90 0" scale="3 3 3"></a-entity>
        </a-entity>
        <a-entity tour-target aim-target="offset: 0 2.2 0; radius: 0.5" position="-0.8 0 9" rotation="0 175 0">
          <a-cylinder radius="0.04" height="2.2" position="0 1.1 0" color="#5b4a3a"></a-cylinder>
          <a-entity class="tour-face" gltf-model="../../assets/models/kenney/blaster-kit/target-large.glb" position="0 2.2 0" rotation="0 90 0" scale="3 3 3"></a-entity>
        </a-entity>
        <a-entity tour-target aim-target="offset: 0 1.5 0; radius: 0.32" position="1.6 0 8" rotation="0 190 0">
          <a-cylinder radius="0.04" height="1.5" position="0 0.75 0" color="#5b4a3a"></a-cylinder>
          <a-entity class="tour-face" gltf-model="../../assets/models/kenney/blaster-kit/target-small.glb" position="0 1.5 0" rotation="0 90 0" scale="3 3 3"></a-entity>
        </a-entity>
      </a-entity>

      <!-- RACING: a track on a table, a remote, a toolbox. -->
      <a-entity id="set-racing">
        <a-box width="1.5" height="0.7" depth="1.05" color="#2f4a3a" position="0 0.35 1.05"></a-box>
        <a-entity id="racing-track" position="0 0.701 1.05" rotation="0 90 0">
          <a-entity id="racing-car">
            <a-box class="racing-paint" width="0.05" height="0.022" depth="0.1" position="0 0.018 0" color="#e8443a"></a-box>
            <a-box class="racing-paint" width="0.036" height="0.018" depth="0.04" position="0 0.036 0.008" color="#e8443a"></a-box>
            <a-box width="0.034" height="0.012" depth="0.002" position="0 0.034 -0.012" color="#8fb8d8"></a-box>
            <a-cylinder radius="0.011" height="0.008" rotation="0 0 90" position="0.027 0.011 0.03" color="#151515"></a-cylinder>
            <a-cylinder radius="0.011" height="0.008" rotation="0 0 90" position="-0.027 0.011 0.03" color="#151515"></a-cylinder>
            <a-cylinder radius="0.011" height="0.008" rotation="0 0 90" position="0.027 0.011 -0.03" color="#151515"></a-cylinder>
            <a-cylinder radius="0.011" height="0.008" rotation="0 0 90" position="-0.027 0.011 -0.03" color="#151515"></a-cylinder>
          </a-entity>
        </a-entity>
        <a-entity id="racing-remote" data-tour-item="remote" position="0.32 0.74 0.58"
          simple-grabbable="heldPosition: 0 0 -0.04; floorY: 0; throwEnabled: true; halfExtents: 0.04 0.02 0.06"
          hint-zone="action: grab; radius: 0.24; maxReach: 1.0; gazeThreshold: 0.9; priority: 12; desktopKey: F; desktopLabel: Grab remote; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.16 0"
        >
          <a-box width="0.08" height="0.03" depth="0.12" color="#d8d8de"></a-box>
          <a-cylinder radius="0.004" height="0.12" position="0.025 0.07 -0.04" color="#222"></a-cylinder>
          <a-cylinder radius="0.012" height="0.012" position="0 0.02 0.02" color="#e8443a"></a-cylinder>
        </a-entity>
        <a-box width="0.3" height="0.7" depth="0.3" color="#2c2f36" position="-0.62 0.35 0.42"></a-box>
        <a-entity id="racing-toolbox" position="-0.62 0.78 0.42"
          geometry="primitive: box; width: 0.36; height: 0.16; depth: 0.2" material="color: #c4362c"
          hint-zone="action: grab; radius: 0.34; maxReach: 1.0; gazeThreshold: 0.88; priority: 20; desktopKey: F; desktopLabel: Open toolbox; xrKey: GRIP; xrLabel: Open; hintOffset: 0 0.3 0"
          projected-menu="template: #tpl-toolbox; mode: laser; laserScale: 0.6; offset: 0 0.55 0; closeDistance: 3"
          projected-crossbar
          grab-to-open
        >
          <a-box width="0.2" height="0.02" depth="0.03" position="0 0.11 0" color="#333"></a-box>
          <a-box width="0.02" height="0.05" depth="0.03" position="0.09 0.09 0" color="#333"></a-box>
          <a-box width="0.02" height="0.05" depth="0.03" position="-0.09 0.09 0" color="#333"></a-box>
        </a-entity>
      </a-entity>

      <!-- FANTASY: a stone table, a wand, potions, a chest, an orc. -->
      <a-entity id="set-fantasy">
        <a-box width="1.0" height="0.76" depth="0.45" color="#5d5a55" position="0 0.38 0.62"></a-box>
        <a-entity id="fantasy-wand" data-tour-item="wand" position="0.2 0.8 0.58" rotation="90 0 0"
          simple-grabbable="heldPosition: 0 0 -0.02; heldRotation: 0 0 0; floorY: 0; throwEnabled: true; halfExtents: 0.02 0.02 0.16"
          hint-zone="action: grab; radius: 0.24; maxReach: 1.0; gazeThreshold: 0.9; priority: 12; desktopKey: F; desktopLabel: Grab wand; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-gun="color: #b98cff; tracer: #b98cff"
        >
          <a-cylinder radius="0.008" height="0.3" rotation="90 0 0" position="0 0 -0.12" color="#6b4a2e"></a-cylinder>
          <a-sphere class="fantasy-wand-tip" radius="0.018" position="0 0 -0.28" material="color: #b98cff; emissive: #b98cff"></a-sphere>
          <a-entity class="tour-muzzle" position="0 0 -0.3"></a-entity>
        </a-entity>
        <a-entity class="fantasy-potion" data-tour-item="potion" position="-0.1 0.79 0.56"
          simple-grabbable="heldPosition: 0 0 -0.05; floorY: 0; throwEnabled: true; halfExtents: 0.05 0.06 0.05"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab potion; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-drink
        ><a-entity gltf-model="../../assets/models/kenney/mini-dungeon/potion.glb" scale="0.3 0.3 0.3" position="0 -0.03 0"></a-entity></a-entity>
        <a-entity class="fantasy-potion" data-tour-item="potion" position="-0.22 0.79 0.62"
          simple-grabbable="heldPosition: 0 0 -0.05; floorY: 0; throwEnabled: true; halfExtents: 0.05 0.06 0.05"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab potion; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-drink
        ><a-entity gltf-model="../../assets/models/kenney/mini-dungeon/potion.glb" scale="0.3 0.3 0.3" position="0 -0.03 0"></a-entity></a-entity>
        <a-entity class="fantasy-potion" data-tour-item="potion" position="-0.34 0.79 0.56"
          simple-grabbable="heldPosition: 0 0 -0.05; floorY: 0; throwEnabled: true; halfExtents: 0.05 0.06 0.05"
          hint-zone="action: grab; radius: 0.22; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab potion; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.18 0"
          tour-drink
        ><a-entity gltf-model="../../assets/models/kenney/mini-dungeon/potion.glb" scale="0.3 0.3 0.3" position="0 -0.03 0"></a-entity></a-entity>
        <a-entity id="fantasy-shield" data-tour-item="shield" position="0.4 0.86 0.66" rotation="-70 180 0"
          simple-grabbable="heldPosition: 0 0 -0.02; floorY: 0; throwEnabled: true; halfExtents: 0.15 0.15 0.03"
          hint-zone="action: grab; radius: 0.26; maxReach: 1.0; gazeThreshold: 0.9; priority: 11; desktopKey: F; desktopLabel: Grab shield; xrKey: GRIP; xrLabel: Grab; hintScale: 0.5; hintOffset: 0 0.2 0"
        ><a-entity class="fantasy-shield-model" scale="0.4 0.4 0.4"></a-entity></a-entity>
        <!-- The chest: the armoury, on your right. -->
        <a-entity id="fantasy-chest" position="-0.62 0.5 0.42"
          geometry="primitive: box; width: 0.42; height: 0.3; depth: 0.3" material="visible: false"
          hint-zone="action: grab; radius: 0.36; maxReach: 1.0; gazeThreshold: 0.88; priority: 20; desktopKey: F; desktopLabel: Open chest; xrKey: GRIP; xrLabel: Open; hintOffset: 0 0.35 0"
          projected-menu="template: #tpl-chest; mode: laser; laserScale: 0.6; offset: 0 0.8 0; closeDistance: 3"
          projected-crossbar

    <script type="module">
      var sceneEl = document.querySelector('a-scene');
      var rigEl = document.querySelector('#rig');

      // A small checkerboard floor, generated on a throwaway canvas.
      var canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = '#3a4358';
      ctx.fillRect(0, 0, 64, 64);
      ctx.fillStyle = '#2a3040';
      ctx.fillRect(0, 0, 32, 32);
      ctx.fillRect(32, 32, 32, 32);
      document.querySelector('#floor').setAttribute('material', { src: canvas.toDataURL(), repeat: '30 30', color: '#ffffff' });

      // Stars: one cheap Points object, toggled by the Basics demo.
      AFRAME.registerComponent('star-field', {
        init: function () {
          var THREE = AFRAME.THREE;
          var positions = [];
          for (var i = 0; i < 500; i++) {
            var u = Math.random() * Math.PI * 2;
            var v = (Math.random() * 0.45 + 0.05) * Math.PI;
            positions.push(Math.cos(u) * Math.cos(v) * 60, Math.sin(v) * 60, Math.sin(u) * Math.cos(v) * 60);
          }
          var geometry = new THREE.BufferGeometry();
          geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
          this.el.setObject3D('mesh', new THREE.Points(geometry, new THREE.PointsMaterial({ color: '#dfe8ff', size: 0.25, sizeAttenuation: true })));
        },
      });

      if (rigEl && !rigEl.components['locomotion-demo']) rigEl.setAttribute('locomotion-demo', 'moveMode: disabled; turnMode: disabled');

      function setupDesktopPlayer () {
        if (!rigEl || rigEl.components['desktop-controls']) return;
        rigEl.setAttribute('desktop-controls', {
          camera: document.querySelector('a-camera'),
          leftHand: document.querySelector('#left-hand'),
          rightHand: document.querySelector('#right-hand'),
        });
      }
      if (sceneEl.hasLoaded) setupDesktopPlayer();
      else sceneEl.addEventListener('loaded', setupDesktopPlayer);

      function updateAllDisplays () {
        document.querySelectorAll('[hand-with-watch]').forEach(function (el) {
          var comp = el.components['hand-with-watch'];
          if (comp) comp.updateDisplay();
        });
      }
      updateAllDisplays();
      setInterval(updateAllDisplays, 1000);
    </script>
