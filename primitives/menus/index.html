<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menus — WebXR Primitives</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Same vendored setup as the prototypes: no build step, just a
         checked-in copy. See /vendor/README.md for why. -->
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;
        font-size: 0.9rem;
      }
      #overlay a {
        color: #9ad;
      }
    </style>
  </head>
  <body>
    <!-- ==============================================================
         Every menu STYLE this project has built lives in this one
         experience, same idea as a Storybook page listing every variant
         of a "Menu" component — walk up to the panel ahead of you for
         the fixed in-world style, or look at your own wrists for the
         watch style.
    ============================================================== -->
    <div id="overlay">
      <span>Menus — panel ahead: point and pull the trigger. Watches on your wrists: point with one hand (squeeze grip), poke the other wrist's face. <a href="../../index.html">All prototypes</a></span>
    </div>

    <a-scene>
      <a-light type="ambient" color="#fff" intensity="0.7"></a-light>
      <a-light type="directional" position="2 3 2" intensity="0.7"></a-light>
      <a-sky color="#0d1526"></a-sky>
      <a-plane rotation="-90 0 0" width="20" height="20" color="#445" position="0 0 0"></a-plane>

      <!-- Gaze reticle so the panel menu is testable from desktop/phone
           with no headset, same pattern as Cube Pop. The watch style
           needs two real tracked hands (to point with one and poke the
           other) so it's headset-only — see the overlay text and the
           write-up in the repo history. -->
      <a-camera>
        <a-entity
          cursor="fuse: false"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
          material="color: #FFFFFF; shader: flat; opacity: 0.8"
          raycaster="objects: .menu-target; far: 10"
        ></a-entity>
      </a-camera>

      <!-- ============================================================
           STYLE 1: fixed in-world panel.
           Every clickable row is just an entity with its own
           geometry/material plus the "menu-item" component below —
           that component is the reusable part; the background plane
           and title here are just this demo's dressing.
      ============================================================ -->
      <a-entity id="menu-panel" menu-feedback position="0 1.8 -2.5">
        <a-plane
          width="1.9"
          height="2"
          color="#101827"
          position="0 -0.15 -0.02"
        ></a-plane>

        <a-text
          value="MAIN MENU"
          align="center"
          color="#9ad"
          width="3"
          position="0 0.65 0"
        ></a-text>

        <a-entity
          class="menu-target"
          geometry="primitive: plane; width: 1.6; height: 0.3"
          material="color: #182238"
          menu-item="value: start; label: Start"
          position="0 0.25 0"
        >
          <a-text value="Start" align="center" color="#eee" width="3" position="0 0 0.01"></a-text>
        </a-entity>

        <a-entity
          class="menu-target"
          geometry="primitive: plane; width: 1.6; height: 0.3"
          material="color: #182238"
          menu-item="value: options; label: Options"
          position="0 -0.15 0"
        >
          <a-text value="Options" align="center" color="#eee" width="3" position="0 0 0.01"></a-text>
        </a-entity>

        <a-entity
          class="menu-target"
          geometry="primitive: plane; width: 1.6; height: 0.3"
          material="color: #182238"
          menu-item="value: quit; label: Quit"
          position="0 -0.55 0"
        >
          <a-text value="Quit" align="center" color="#eee" width="3" position="0 0 0.01"></a-text>
        </a-entity>

        <a-text
          id="menu-feedback-text"
          value="Selected: (none)"
          align="center"
          color="#aaa"
          width="2.2"
          position="0 -0.95 0"
        ></a-text>
      </a-entity>

      <!-- ============================================================
           STYLE 2: wrist-worn watch menu.
           The logic entities (below, id left-hand/right-hand) carry the
           watch (band + face + poke hitbox — see hand-with-watch) AND
           point a laser at the panel above, since cursor/raycaster and
           obb-collider are independent, non-conflicting components on
           the same entity. The actual visible/animated hand is a
           separate, decoupled hand-controls entity — see the big
           comment above the HTML for both, further down.
      ============================================================ -->
      <template id="watch-template">
        <a-entity>
          <a-entity class="watch-band"
            geometry="primitive: torus; radius: 0.030; radiusTubular: 0.005; segmentsRadial: 24; segmentsTubular: 12"
            material="color: #ccc; metalness: 0.6; roughness: 0.4"
          ></a-entity>
          <a-entity class="watch-face"
            geometry="primitive: box; width: 0.032; height: 0.007; depth: 0.032"
            material="color: #111"
          >
            <a-entity class="watch-proximity-ring"
              geometry="primitive: ring; radiusInner: 0.013; radiusOuter: 0.0155; segmentsTheta: 32"
              material="color: #0f0; shader: flat; side: double"
              position="0 0.004 0"
              rotation="-90 0 0"
              visible="false"
            ></a-entity>
            <a-text class="watch-text"
              value="00:00:00"
              font="sourcecodepro"
              align="center"
              color="#0F0"
              width="0.09"
              position="0 0.0045 0"
              rotation="-90 0 0"
            ></a-text>
          </a-entity>
        </a-entity>
      </template>

      <!-- Two entities per hand, deliberately decoupled — same pattern
           Pistols at Dawn uses, for the same reason: hand-controls'
           rendered mesh applies its own "looks natural" corrective
           rotation (±90° yaw plus a WebXR-only pitch) that does NOT match
           "-Z is where you're pointing," so raycasting/aiming needs the
           RAW uncorrected entity while the visible hand needs the real
           hand-controls component (which is also the only thing that
           actually animates — fist on grip, point on trigger, etc.).
           hand-with-watch reproduces that same corrective rotation on its
           own watch+fingertip wrapper so they visually track the real
           rendered mesh instead of the raw entity underneath it. -->
      <a-entity id="left-hand" position="-0.2 1.35 -0.4"
        hand-with-watch="hand: left"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        raycaster="objects: .menu-target; far: 10; showLine: true"
      ></a-entity>
      <a-entity hand-controls="hand: left; handModelStyle: lowPoly"></a-entity>

      <a-entity id="right-hand" position="0.2 1.35 -0.4"
        hand-with-watch="hand: right"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        raycaster="objects: .menu-target; far: 10; showLine: true"
      ></a-entity>
      <a-entity hand-controls="hand: right; handModelStyle: lowPoly"></a-entity>
    </a-scene>

    <script>
      // ==============================================================
      // COMPONENT: menu-item
      // The reusable primitive. Drop this on any entity that already has
      // its own geometry + material, and it becomes a clickable menu row:
      // highlights on hover (mouseenter/mouseleave, fired by the cursor/
      // raycaster on whatever's aiming at it), and on click emits
      // "menu-item-select" with {value, label} bubbling up to whatever
      // manager is listening.
      // ==============================================================
      AFRAME.registerComponent('menu-item', {
        schema: {
          value: { type: 'string' },
          label: { type: 'string' },
          hoverColor: { type: 'color', default: '#2a3a5c' },
        },

        init: function () {
          // Remember the color set on the entity's own material so
          // mouseleave can restore it, without this component having to
          // know or care what that base color is.
          this.baseColor = this.el.getAttribute('material').color;

          this.onMouseEnter = this.onMouseEnter.bind(this);
          this.onMouseLeave = this.onMouseLeave.bind(this);
          this.onClick = this.onClick.bind(this);

          this.el.addEventListener('mouseenter', this.onMouseEnter);
          this.el.addEventListener('mouseleave', this.onMouseLeave);
          this.el.addEventListener('click', this.onClick);
        },

        onMouseEnter: function () {
          this.el.setAttribute('material', 'color', this.data.hoverColor);
          this.el.setAttribute('scale', '1.05 1.05 1.05');
        },

        onMouseLeave: function () {
          this.el.setAttribute('material', 'color', this.baseColor);
          this.el.setAttribute('scale', '1 1 1');
        },

        onClick: function () {
          this.el.emit(
            'menu-item-select',
            { value: this.data.value, label: this.data.label },
            true
          );
        },

        remove: function () {
          this.el.removeEventListener('mouseenter', this.onMouseEnter);
          this.el.removeEventListener('mouseleave', this.onMouseLeave);
          this.el.removeEventListener('click', this.onClick);
        },
      });

      // ==============================================================
      // COMPONENT: menu-feedback
      // Demo-only: listens for the bubbled selection event from any
      // menu-item under this panel and reflects it back in text, so you
      // can see the primitive actually fired without checking devtools.
      // ==============================================================
      AFRAME.registerComponent('menu-feedback', {
        init: function () {
          this.feedbackText = this.el.querySelector('#menu-feedback-text');
          this.el.addEventListener('menu-item-select', (evt) => {
            this.feedbackText.setAttribute(
              'text',
              'value',
              'Selected: ' + evt.detail.label
            );
          });
        },
      });

      // Position/size numbers below came from actually loading the raw
      // GLB and measuring it (bone positions + eyeballing render
      // screenshots) rather than guessing — see the repo history for how.
      // x is the calibrated offset for the LEFT hand specifically;
      // hand-with-watch flips its sign for the right hand below.
      var WATCH_OFFSET = { x: -0.009, y: -0.006, z: 0.100 };
      var FACE_Y_OFFSET = 0.0345;

      // Where the index fingertip actually ends up, sampled by loading the
      // same hand GLB, playing its built-in "Point" animation clip to
      // completion, and reading the index-fingertip bone's (F1c) resulting
      // world position — not guessed. It barely differs from the resting
      // pose (this model's rest pose already keeps the index finger mostly
      // extended), nudged ~1.5cm further along the finger's own direction
      // to land at the fingertip surface rather than the tip bone's own
      // (more proximal) joint origin.
      var FINGERTIP_OFFSET = { x: 0.038, y: 0.026, z: -0.089 };
      var FINGERTIP_SIZE = 0.03;

      // Proximity ring: fully open at PROXIMITY_MAX_DIST away, closed down
      // to a small dot right at contact. Purely visual — has no effect on
      // whether a poke actually registers (that's obb-collider's job).
      var PROXIMITY_MAX_DIST = 0.1;
      var PROXIMITY_MAX_INNER_RADIUS = 0.013;
      var PROXIMITY_MIN_INNER_RADIUS = 0.001;

      // Same vendor controller components hand-controls itself attaches,
      // with model:false so nothing renders from them — they're here only
      // for real button events (gripdown/gripup/triggerdown/triggerup) on
      // real hardware, on the RAW entity used for aiming/menu-clicking.
      // The actual visible, animated hand is a separate hand-controls
      // entity declared in HTML (see the comment above it).
      var CONTROL_COMPONENTS = [
        'magicleap-controls', 'vive-controls', 'oculus-touch-controls',
        'pico-controls', 'windows-motion-controls', 'hp-mixed-reality-controls',
        'oculus-go-controls', 'vive-focus-controls', 'valve-index-controls',
        'generic-tracked-controller-controls',
      ];

      AFRAME.registerComponent('hand-with-watch', {
        schema: {
          hand: { default: 'left', oneOf: ['left', 'right'] },
        },

        init: function () {
          var el = this.el;
          var self = this;
          var side = this.data.hand === 'left' ? 1 : -1;

          this.watch = { mode: 'clock', running: false, elapsedMs: 0, startedAt: 0 };

          // hand-controls' own mesh gets this exact rotation applied on
          // top of the entity's real tracked pose (see its source: a ±90°
          // yaw depending on hand, plus a WebXR-only pitch) so that the
          // rendered hand looks natural rather than "-Z is forward." Our
          // watch/fingertip live on a wrapper carrying that same
          // correction, so their calibrated numbers (measured against the
          // RAW, uncorrected model) land in the right place relative to
          // what's actually rendered — not the raw entity underneath it.
          var correctionZ = side === 1 ? 90 : -90;
          var correctionX = el.sceneEl.hasWebXR ? -90 : 0;
          var wrapper = document.createElement('a-entity');
          wrapper.setAttribute('rotation', correctionX + ' 0 ' + correctionZ);
          el.appendChild(wrapper);

          var template = document.getElementById('watch-template');
          var watch = template.content.cloneNode(true).firstElementChild;
          wrapper.appendChild(watch);

          var bandX = side * WATCH_OFFSET.x;
          watch
            .querySelector('.watch-band')
            .setAttribute('position', bandX + ' ' + WATCH_OFFSET.y + ' ' + WATCH_OFFSET.z);
          var faceEl = watch.querySelector('.watch-face');
          faceEl.setAttribute('position', bandX + ' ' + FACE_Y_OFFSET + ' ' + WATCH_OFFSET.z);

          // Rotate the text a further 90° around the face's own normal so
          // "up" reads toward the side of the hand rather than toward the
          // fingertips — that's how a watch actually gets read: you turn
          // your wrist so the back of the hand faces you with the fingers
          // off to one side, not pointing straight up. Left/right mirror
          // each other (same relative rotation, opposite sign) since the
          // two hand models are themselves exact mirror images.
          var textEl = watch.querySelector('.watch-text');
          textEl.setAttribute('rotation', '-90 0 ' + side * 90);
          this.textEl = textEl;
          this.ringEl = watch.querySelector('.watch-proximity-ring');

          // ----- Poke detection -----
          // Real button state, not simulated: attach the same vendor
          // control components hand-controls uses (muted — model:false —
          // so they contribute no visuals of their own) purely to get
          // real button events on actual hardware.
          this.isPointing = false;
          CONTROL_COMPONENTS.forEach(function (name) {
            el.setAttribute(name, { hand: self.data.hand, model: false });
          });
          el.addEventListener('gripdown', function () { self.isPointing = true; });
          el.addEventListener('gripup', function () { self.isPointing = false; });

          // Invisible hitbox at the fingertip. obb-collider does the
          // actual overlap test (oriented-bounding-box, no physics engine
          // involved) against anything else carrying obb-collider — here,
          // just the watch face.
          var fingertip = document.createElement('a-entity');
          fingertip.setAttribute(
            'position',
            side * FINGERTIP_OFFSET.x + ' ' + FINGERTIP_OFFSET.y + ' ' + FINGERTIP_OFFSET.z
          );
          fingertip.setAttribute('obb-collider', 'size: ' + FINGERTIP_SIZE);
          fingertip.handComponent = this;
          wrapper.appendChild(fingertip);
          this.fingertipEl = fingertip;

          faceEl.setAttribute('obb-collider', '');
          this.faceEl = faceEl;
          // A poke is any OTHER hand's fingertip touching this face while
          // that hand is pointing — not this hand's own fingertip, which
          // sits on the opposite side of the wrist and geometrically can
          // never reach its own watch face anyway.
          faceEl.addEventListener('obbcollisionstarted', function (evt) {
            var poker = evt.detail.withEl;
            if (poker.handComponent && poker.handComponent.isPointing) {
              self.poke(faceEl);
            }
          });
        },

        tick: function () {
          // Lazily find the other hand once both have initialized.
          if (!this.otherHand) {
            var otherId = this.data.hand === 'left' ? '#right-hand' : '#left-hand';
            var otherEl = document.querySelector(otherId);
            if (otherEl && otherEl.components['hand-with-watch']) {
              this.otherHand = otherEl.components['hand-with-watch'];
            }
          }
          if (!this.otherHand) return;

          if (!this.otherHand.isPointing) {
            this.ringEl.setAttribute('visible', false);
            return;
          }

          var facePos = new AFRAME.THREE.Vector3();
          var tipPos = new AFRAME.THREE.Vector3();
          this.faceEl.object3D.getWorldPosition(facePos);
          this.otherHand.fingertipEl.object3D.getWorldPosition(tipPos);
          var dist = facePos.distanceTo(tipPos);

          var t = Math.min(1, Math.max(0, dist / PROXIMITY_MAX_DIST));
          var innerRadius = PROXIMITY_MIN_INNER_RADIUS + t * (PROXIMITY_MAX_INNER_RADIUS - PROXIMITY_MIN_INNER_RADIUS);

          this.ringEl.setAttribute('visible', true);
          this.ringEl.setAttribute('geometry', 'radiusInner', innerRadius);
        },

        poke: function (faceEl) {
          var w = this.watch;
          if (!w.running) {
            w.mode = 'stopwatch';
            w.startedAt = performance.now();
            w.running = true;
          } else {
            w.elapsedMs += performance.now() - w.startedAt;
            w.running = false;
          }

          // Flash feedback so a poke is visibly obvious, same idea as the
          // hover/click feedback of the panel menu above.
          faceEl.setAttribute('material', 'color', '#0f0');
          setTimeout(function () { faceEl.setAttribute('material', 'color', '#111'); }, 120);
        },

        updateDisplay: function () {
          var pad = function (n) { return String(n).padStart(2, '0'); };
          var value;
          if (this.watch.mode === 'clock') {
            var d = new Date();
            value = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
          } else {
            var ms = this.watch.elapsedMs + (this.watch.running ? performance.now() - this.watch.startedAt : 0);
            var totalSec = Math.floor(ms / 1000);
            value = pad(Math.floor(totalSec / 3600)) + ':' + pad(Math.floor(totalSec / 60) % 60) + ':' + pad(totalSec % 60);
          }
          this.textEl.setAttribute('text', 'value', value);
        },
      });

      function updateAllDisplays () {
        document.querySelectorAll('[hand-with-watch]').forEach(function (el) {
          var comp = el.components['hand-with-watch'];
          if (comp) comp.updateDisplay();
        });
      }
      updateAllDisplays();
      setInterval(updateAllDisplays, 1000);
    </script>
  </body>
</html>
