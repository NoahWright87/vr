<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hand Tracking — WebXR Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      A-Frame, vendored into /vendor instead of loaded from the CDN — see
      /vendor/README.md. The decorative hand-tracking-controls entities
      below fetch a low-poly rigged hand model per hand at runtime from
      AFRAME_CDN_ROOT, the same way hand-controls fetches its controller
      hand models, so those two files are vendored too
      (vendor/aframe-1.6.0/controllers/oculus-hands/v4/{left,right}.glb).
    -->
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;
        font-size: 0.9rem;
      }
      #overlay a {
        color: #9ad;
      }
    </style>
  </head>
  <body>
    <!-- There's no desktop/gaze fallback here (unlike Cube Pop) — hand
         tracking has no meaningful mouse/keyboard equivalent, so this one
         is headset-only. Put the Touch controllers down before entering
         VR; the Quest browser switches to hand tracking automatically
         once it no longer sees them. -->
    <div id="overlay">
      <span>Hand Tracking — put the controllers down and enter VR. Pinch near the box to pick it up, un-pinch to let go. Point a finger gun (cock your thumb up) at the watch on either wrist to open it — drop the thumb to click. <a href="../../index.html">All prototypes</a></span>
    </div>

    <a-scene keyboard-shortcuts="enterVR: false">
      <a-plane rotation="-90 0 0" width="20" height="20" color="#445" position="0 0 0"></a-plane>
      <a-sky color="#0d1526"></a-sky>

      <a-camera position="0 1.6 0"></a-camera>

      <!-- ============================================================
           HANDS
           This is the same hand rig the primitives/menus/ showcase uses
           (see its own big comment block for the full picture):
           hand-with-watch + semantic-hand carry the wrist-worn watch and
           reach/grab logic, hand-gesture-controls (common/hand-tracking.js)
           is what actually drives them from real WebXR hand tracking --
           pinch to grab the box below, or point a finger gun at either
           watch to open and click its menu -- and a separate, purely
           decorative entity renders a real hand mesh so there's something
           to look at. hand-gesture-label shows which canonical gesture is
           currently recognized as a small floating tag above the hand,
           toggled from the watch menu itself (see the template below).
      ============================================================ -->
      <a-entity id="left-hand" position="-0.2 1.35 -0.4"
        hand-with-watch="hand: left"
        semantic-hand="hand: left; maxReach: 1.0"
        hand-gesture-controls="hand: left"
        hand-gesture-label
      ></a-entity>
      <a-entity id="hand-visual-left" control-mode-visibility="modes: xr" hand-tracking-controls="hand: left; modelStyle: mesh"></a-entity>

      <a-entity id="right-hand" position="0.2 1.35 -0.4"
        hand-with-watch="hand: right"
        semantic-hand="hand: right; maxReach: 1.0"
        hand-gesture-controls="hand: right"
        hand-gesture-label
      ></a-entity>
      <a-entity id="hand-visual-right" control-mode-visibility="modes: xr" hand-tracking-controls="hand: right; modelStyle: mesh"></a-entity>

      <!-- Sized and placed to be reachable without leaning: a hand raised
           to roughly chest height in front of you lands right on it.
           simple-grabbable/hint-zone (common/interaction-hints.js) are the
           same shared grab primitive the showcase's own test box uses --
           gripdown (fired by a pinch, see hand-gesture-controls) picks it
           up if it's in reach, gripup drops it, and it falls to floorY on
           its own from there. -->
      <a-box
        id="pickup-box"
        simple-grabbable="heldPosition: 0 0 -0.08; floorY: 0.09"
        hint-zone="action: grab; radius: 0.34; maxReach: 1.0; xrKey: GRIP; xrLabel: Grab"
        geometry="primitive: box; width: 0.18; height: 0.18; depth: 0.18"
        material="color: #FFD166"
        position="0 1 -0.35"
      ></a-box>

      <!-- Minimal watch menu: just enough chrome to be recognizable as
           the same watch style the showcase uses, plus the one thing this
           demo needs a menu for -- toggling the gesture-name labels above
           (wired up in the script below, via hand-gesture-labels'
           setEnabled). -->
      <template id="watch-menu-template">
        <a-entity class="watch-menu-panel" visible="false">
          <a-plane width="1.2" height="0.75" color="#101827" position="0 -0.3 -0.01"></a-plane>
          <!-- Title starts empty -- hand-with-watch points its live clock
               at the chrome's title element instead of a static string
               once the panel is built (same convention the showcase's own
               watch-menu-template uses). -->
          <a-entity class="menu-chrome-slot" data-title="" data-help="false" data-close="true" data-width="1.2" data-bar-y="0.28"></a-entity>

          <a-entity
            menu-option="key: gesture-labels; label: Labels; values: off|on; labels: Off|On; value: on; width: 0.96; height: 0.22"
            position="0 0 0"
          ></a-entity>
        </a-entity>
      </template>
    </a-scene>

    <script type="module" src="../../common/interaction-hints.js"></script>
    <script type="module" src="../../common/watch-menu.js"></script>
    <script type="module" src="../../common/hand-tracking.js"></script>
    <script type="module">
      // The watch menu's one row is generic (menu-option, shared across
      // every showcase menu) -- this is the only page-specific glue,
      // routing its change event to the shared hand-gesture-labels system.
      document.querySelector('a-scene').addEventListener('menu-option-change', function (evt) {
        if (evt.detail.key !== 'gesture-labels') return;
        var sceneEl = document.querySelector('a-scene');
        sceneEl.systems['hand-gesture-labels'].setEnabled(evt.detail.value === 'on');
      });
    </script>
  </body>
</html>
