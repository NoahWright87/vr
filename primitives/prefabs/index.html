<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prefab Workshop | Noah's VR projects</title>
  <link rel="icon" href="../../assets/noah-vr.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./workshop.css">
  <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
  <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>
  <script type="module" src="./workshop.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <a class="back" href="../../">← All experiences</a>
      <h1>Prefab Workshop</h1>
      <span id="status" role="status"></span>
      <span class="spacer"></span>
      <button id="copy-changed" class="primary">Copy changed JSON</button>
    </header>

    <aside id="browser" aria-label="Prefabs and models">
      <input id="search" type="search" placeholder="Search prefabs and models…" aria-label="Search">
      <div id="list"></div>
    </aside>

    <main id="stage">
      <a-scene embedded vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"
        renderer="antialias: true" background="color: #141c27" keyboard-shortcuts="enterVR: false">
        <a-entity light="type: ambient; color: #d8e4f0; intensity: 0.75"></a-entity>
        <a-entity light="type: directional; color: #fff4e0; intensity: 0.9" position="-1 3 2"></a-entity>
        <a-entity light="type: directional; color: #9fc4ff; intensity: 0.4" position="2 1 -3"></a-entity>
        <a-entity camera="fov: 40; near: 0.01; far: 60" position="0 0.3 0.8"></a-entity>
      </a-scene>
      <div id="viewbar" role="toolbar" aria-label="View">
        <button data-view="threeQuarter">3/4</button><button data-view="front">Front</button><button data-view="side">Side</button>
        <button data-view="top">Top</button><button data-view="back">Back</button><button id="frame">Frame</button>
        <span class="sep"></span>
        <button id="space" title="Whether the gizmo's arrows follow the world axes or the selected thing">Gizmo: world</button>
        <button id="all-hands" aria-pressed="false" title="Show the hands of every interaction point, not just the selected one">All hands</button>
        <button id="see-through" aria-pressed="false" title="Draw the model faint, to see hands inside it">See-through</button>
        <button id="focus" title="Zoom to the selected hand, emitter or socket">Focus</button>
      </div>
      <p id="hint">Drag the arrows to move, the rings to turn, the grey ball to slide freely (Shift snaps). Drag empty space to orbit, right-drag or Shift-drag to pan, wheel to zoom. Red X, green Y, blue Z; the grey arrow on the floor is forward (−Z).</p>
    </main>

    <aside id="inspector" aria-label="Inspector">
      <nav id="tabs" role="tablist">
        <button role="tab" data-tab="prefab" aria-selected="true">Prefab</button>
        <button role="tab" data-tab="poses" aria-selected="false">Hand poses</button>
        <button role="tab" data-tab="export" aria-selected="false">Export</button>
      </nav>
      <div id="panel"></div>
    </aside>
  </div>
</body>
</html>
