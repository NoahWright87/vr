name: Build relay exe

# Runs automatically on PRs that touch the relay, so a PR gets a
# downloadable preview build as a check. Also manually triggerable —
# but note workflow_dispatch only appears in the Actions tab's "Run
# workflow" picker once this file exists on the default branch, so
# that option won't show up until this PR (or some other change to
# this file) merges to main.
on:
  pull_request:
    paths:
      - 'server/**'
      - 'common/multiplayer.js'
      - 'common/signal-relay.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-relay-exe.yml'
  workflow_dispatch: {}

jobs:
  build:
    # Native Windows runner rather than cross-compiling, so this both
    # matches what a user's machine actually is and lets the smoke
    # test below actually execute the built binary.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run package:relay:win

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist-exe\vr-signal-relay.exe" -RedirectStandardOutput "relay-output.log" -PassThru
          Start-Sleep -Seconds 5
          Stop-Process -Id $proc.Id -Force
          Get-Content "relay-output.log"
          if (-not (Select-String -Path "relay-output.log" -Pattern "Signaling relay listening" -Quiet)) {
            throw "The built exe never printed its startup banner - packaging may be broken."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: vr-signal-relay-windows
          path: dist-exe/vr-signal-relay.exe
          retention-days: 30
