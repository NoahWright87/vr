     file survives an area change unless the player is carrying it. -->
<a-plane
  rotation="-90 0 0"
  width="160"
  height="160"
  color="#7a6a52"
  position="0 0 0"
></a-plane>

<a-entity
  class="grabbable"
  holsterable="holsterSelector: #head-anchor; itemSize: medium; holsterRotation: 0 0 0; heldRotation: 90 0 0; holsterPosition: 0.11 0 0; heldPosition: -0.1 0 0; grabRadius: 0.35; grabPriority: 30; comOffset: 0.11 -0.065 0"
  boxy-hat
></a-entity>

<a-entity saloon-bar></a-entity>
<a-entity id="bell-pole" boxy-bell-pole></a-entity>
<a-entity id="range-manager" shooting-range></a-entity>
