<!-- Ghost Town is the session's hub: a deliberately simple streetscape that
     can grow into distinctive, useful buildings without changing the area
     boundary or its approach. The player arrives south of the first gate
     (positive Z) and walks north down the road. -->
<a-plane
  class="ghost-town-ground"
  rotation="-90 0 0"
  width="50"
  height="54"
  color="#8b7654"
  material="src: assets/textures/stable-dirt-straw-v1.png; repeat: 24 26; color: #ffffff; shader: standard"
  position="0 0 0"
></a-plane>

<!-- Main road: the long Z-axis strip between the two building rows. -->
<a-plane
  class="ghost-town-road"
  rotation="-90 0 0"
  width="9"
  height="42"
  color="#b7905d"
  material="src: assets/textures/stable-dirt-straw-v1.png; repeat: 5 21; color: #ffffff; shader: standard"
  position="0 0.01 0"
></a-plane>

<!-- Simple boardwalks reserve the walking edges of the future storefronts. -->
<a-box class="ghost-town-boardwalk" width="2" height="0.1" depth="34" color="#69462d" material="src: assets/textures/western-wood-planks-v1.png; repeat: 2 17; color: #ffffff; shader: standard" position="-5.5 0.05 0"></a-box>
<a-box class="ghost-town-boardwalk" width="2" height="0.1" depth="34" color="#69462d" material="src: assets/textures/western-wood-planks-v1.png; repeat: 2 17; color: #ffffff; shader: standard" position="5.5 0.05 0"></a-box>

<!-- The south gate faces outward toward +Z, where the player arrives. -->
<a-entity class="ghost-town-welcome-gateway" position="0 0 20">
  <a-box width="0.35" height="4" depth="0.35" color="#5c3d28" position="-4.5 2 0"></a-box>
  <a-box width="0.35" height="4" depth="0.35" color="#5c3d28" position="4.5 2 0"></a-box>
  <a-box width="9.4" height="1.15" depth="0.22" color="#6b452b" material="src: assets/textures/signboard-walnut-v1.png; repeat: 4 1; color: #ffffff; shader: standard" position="0 4 0"></a-box>
  <a-text value="Welcome to Ghost Town!" align="center" color="#f0dfba" width="8" position="0 3.78 0.13"></a-text>
</a-entity>

<!-- The north gate is identical but turned around to face outward toward -Z. -->
<a-entity class="ghost-town-welcome-gateway" position="0 0 -20" rotation="0 180 0">
  <a-box width="0.35" height="4" depth="0.35" color="#5c3d28" position="-4.5 2 0"></a-box>
  <a-box width="0.35" height="4" depth="0.35" color="#5c3d28" position="4.5 2 0"></a-box>
  <a-box width="9.4" height="1.15" depth="0.22" color="#6b452b" material="src: assets/textures/signboard-walnut-v1.png; repeat: 4 1; color: #ffffff; shader: standard" position="0 4 0"></a-box>
  <a-text value="Welcome to Ghost Town!" align="center" color="#f0dfba" width="8" position="0 3.78 0.13"></a-text>
</a-entity>

<!-- South-to-north building rows. These are solid visual blockouts only;
     the varied silhouette gives future individual destinations a clear home. -->

     street (+X); the door uses the shared semantic hint path rather than
     becoming a one-off desktop click target. -->

<a-text value="SALOON" align="center" color="#f0dfba" width="3.3" position="-6.68 2.8 12" rotation="0 90 0"></a-text>
