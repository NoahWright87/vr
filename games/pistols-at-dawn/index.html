<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pistols at Dawn — WebXR Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      #overlay a {
        color: #9ad;
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <span>Pistols at Dawn — grip near a holstered pistol to draw it, pull the trigger to fire. Let go of the grip while your finger still rests on the trigger to let it dangle and spin. <a href="../../index.html">All prototypes</a></span>
    </div>

    <a-scene>
      <!-- ============================================================
           RANGE
      ============================================================ -->
      <a-plane
        rotation="-90 0 0"
        width="30"
        height="30"
        color="#7a6a52"
        position="0 0 0"
      ></a-plane>
      <a-sky color="#7d6b8f"></a-sky>

      <!-- ============================================================
           PLAYER RIG + DESKTOP/PHONE FALLBACK
           The grab/holster/dangle mechanic below is inherently a VR
           interaction (it needs grip + trigger buttons and real hand
           motion), so there's no meaningful desktop equivalent for it.
           The reticle + click-to-score fallback from the previous
           version is kept as-is, purely so target scoring stays
           sanity-checkable without a headset.
      ============================================================ -->
      <a-camera id="head-camera">
        <a-text
          id="hud-text"
          value="Score: 0   Shots: 0"
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.35 -1"
        ></a-text>
        <a-entity
          cursor="fuse: false"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
          material="color: #FFFFFF; shader: flat; opacity: 0.8"
          raycaster="objects: .target-ring; far: 20"
        ></a-entity>
      </a-camera>

      <!-- ============================================================
           HANDS
           Two entities per hand, deliberately decoupled:

           - oculus-touch-controls (model:false) is the one the gun
             actually attaches to and the one hand-rig listens to for
             grip/trigger events. Its forward axis is the same one
             laser-controls uses for aiming in Cube Pop, so a gun
             welded to it points where you'd expect.
           - hand-controls is purely cosmetic: it renders the animated
             hand mesh (fist on grip, point on trigger) at the same
             tracked position, but its own orientation convention is
             tuned for a believable-looking hand pose, not for "-Z is
             where you're pointing" — which is why the first version of
             this file, with the gun parented directly to a
             hand-controls entity, aimed inconsistently.

           proximity-haptics is generic and unrelated to pistols
           specifically — see its own comment below.
      ============================================================ -->
      <a-entity oculus-touch-controls="hand: left; model: false" hand-rig proximity-haptics></a-entity>
      <a-entity hand-controls="hand: left; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>

      <a-entity oculus-touch-controls="hand: right; model: false" hand-rig proximity-haptics></a-entity>
      <a-entity hand-controls="hand: right; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>

      <!-- ============================================================
           HOLSTERS
           Two invisible anchor points that track the player's hips.
           There's no real hip tracking on a Quest, so hip-anchor
           approximates it from the headset: it follows the camera's
           position and its yaw (turning left/right), but deliberately
           ignores pitch/roll so looking up or tilting your head doesn't
           drag the holsters around with it.
      ============================================================ -->
      <a-entity id="hip-left" class="holster-anchor" hip-anchor="side: left"></a-entity>
      <a-entity id="hip-right" class="holster-anchor" hip-anchor="side: right"></a-entity>

      <!-- ============================================================
           PISTOLS
           Each is a free-standing entity (not nested under a hand) so
           it can be reparented at runtime between a holster, a hand,
           or loose in the world while dangling/falling. See the
           "pistol" component for the state machine. The "grabbable"
           class is what makes proximity-haptics notice them — any
           future interactive prop just needs that same class to get
           the same buzz-when-in-reach behavior.
      ============================================================ -->
      <a-entity class="pistol grabbable" pistol="holster: #hip-left"></a-entity>
      <a-entity class="pistol grabbable" pistol="holster: #hip-right"></a-entity>

      <!-- ============================================================
           TARGETS
      ============================================================ -->
      <a-entity id="range-manager" shooting-range></a-entity>
    </a-scene>

    <script>
      // ==============================================================
      // TUNING CONSTANTS
      // Everything about "does the twirl feel fun" lives in these few
      // numbers. Expect to adjust them after actually trying it on a
      // headset.
      // ==============================================================
      var GRAB_RADIUS = 0.15; // meters — how close a hand must be to pick something up
      var HOLSTER_RADIUS = 0.3; // meters — deliberately generous, see the design discussion
      var HIP_HEIGHT = 0.9; // meters off the ground
      var HIP_SIDE_OFFSET = 0.18; // meters, left/right from body centerline
      var GRAVITY = 9.8; // real-world value, used for the drop/tumble simulation
      var DANGLE_GRAVITY_TORQUE = 2.5; // how insistently a dangling gun swings back to hanging straight down
      var DANGLE_INERTIA_SCALE = 6; // how strongly flicking your hand imparts spin — crank this up further if it still feels weak
      var DANGLE_DAMPING = 0.999; // per-frame angular velocity decay while swinging — close to 1 = low friction, keeps spinning
      var MAX_ANGULAR_VELOCITY = 40; // rad/s safety clamp so one noisy tracking spike can't fling it into nonsense
      var FALL_DAMPING = 0.99; // per-frame angular velocity decay while tumbling to the ground
      var GROUND_REST_Y = 0.05; // meters — half the gun's resting thickness off the floor

      var PROXIMITY_HAPTIC_RADIUS = 0.2; // meters — a bit past GRAB_RADIUS, so the buzz gives you a heads-up just before you're in range
      var PROXIMITY_HAPTIC_INTENSITY = 0.15; // 0-1, deliberately light ("slight buzz", not a jolt)
      var PROXIMITY_HAPTIC_PULSE_MS = 60; // re-issued every tick while in range, so this just needs to outlast one frame

      // The gun's local -Z (barrel forward) is defined relative to the
      // hand's raw tracked ("grip") orientation, which on Quest Touch
      // controllers does NOT point where your index finger does — this
      // is a well-known WebXR quirk (laser-controls gets away with the
      // same raw orientation because you visually self-correct your
      // aim by watching the laser line; a rigid gun model has no such
      // feedback, so the mismatch just looks wrong). This offset
      // rotates the held gun to compensate. -90° on X is a reasoned
      // starting estimate (pitching the barrel down out of "grip up"
      // into "pointing forward"), not a verified value — if the barrel
      // still doesn't track your finger after this, nudge x in ~15°
      // steps (or adjust y/z if the mismatch looks like a left/right
      // twist rather than up/down) and reload.
      var GRIP_TO_BARREL_OFFSET = { x: -90, y: 0, z: 0 };

      var RECOIL_KICK_DEG = -8; // extra pitch added on top of the offset above when firing
      var RECOIL_RECOVER_MS = 120; // how long the kick takes to settle back

      var TRACER_COLOR = '#ffe066';
      var TRACER_RADIUS = 0.004; // meters
      var TRACER_LIFETIME_MS = 80;
      var IMPACT_RADIUS = 0.04; // meters
      var IMPACT_LIFETIME_MS = 150;
      var MAX_SHOT_RANGE = 20; // meters — both the raycaster's far distance and the tracer's length on a miss

      // ==============================================================
      // spawnTracer
      // A quick yellow line from the muzzle to wherever the shot ended
      // up (a hit point, or MAX_SHOT_RANGE out into the distance on a
      // miss), plus a small burst at that endpoint. Both are one-shot,
      // throwaway entities — created, shown briefly, removed — so it's
      // a plain function rather than a component.
      // ==============================================================
      function spawnTracer(origin, endPoint) {
        var sceneEl = document.querySelector('a-scene');

        var direction = new THREE.Vector3().subVectors(endPoint, origin);
        var length = direction.length();
        if (length > 0.001) {
          var midpoint = new THREE.Vector3().addVectors(origin, endPoint).multiplyScalar(0.5);
          var quaternion = new THREE.Quaternion().setFromUnitVectors(
            new THREE.Vector3(0, 1, 0),
            direction.clone().normalize()
          );

          var tracer = document.createElement('a-entity');
          tracer.setAttribute('geometry', { primitive: 'cylinder', radius: TRACER_RADIUS, height: length });
          tracer.setAttribute('material', 'color: ' + TRACER_COLOR + '; shader: flat; opacity: 0.9; transparent: true');
          tracer.object3D.position.copy(midpoint);
          tracer.object3D.quaternion.copy(quaternion);
          sceneEl.appendChild(tracer);
          setTimeout(function () {
            if (tracer.parentNode) tracer.parentNode.removeChild(tracer);
          }, TRACER_LIFETIME_MS);
        }

        var impact = document.createElement('a-sphere');
        impact.setAttribute('radius', IMPACT_RADIUS);
        impact.setAttribute('material', 'color: ' + TRACER_COLOR + '; shader: flat; opacity: 0.9; transparent: true');
        impact.object3D.position.copy(endPoint);
        impact.setAttribute('animation__shrink', {
          property: 'scale',
          to: '0.001 0.001 0.001',
          dur: IMPACT_LIFETIME_MS,
          easing: 'easeInQuad',
        });
        sceneEl.appendChild(impact);
        setTimeout(function () {
          if (impact.parentNode) impact.parentNode.removeChild(impact);
        }, IMPACT_LIFETIME_MS + 20);
      }

      // ==============================================================
      // COMPONENT: boxy-gun
      // Builds a very simple, low-poly pistol out of boxes, sized for a
      // hand-held scale (roughly 20cm long). Local space is defined so
      // the entity's own origin sits at the grip/trigger-guard area —
      // that's what lets the dangle physics below treat "pivot around
      // the entity origin" as "pivot around the trigger guard" without
      // needing a separate offset.
      // ==============================================================
      AFRAME.registerComponent('boxy-gun', {
        init: function () {
          var el = this.el;
          var metal = '#2b2b2f';
          var wood = '#4a2f1c';
          var brass = '#c9962c';

          function addBox(w, h, d, pos, color, rot) {
            var box = document.createElement('a-box');
            box.setAttribute('width', w);
            box.setAttribute('height', h);
            box.setAttribute('depth', d);
            box.setAttribute('position', pos);
            box.setAttribute('color', color);
            if (rot) box.setAttribute('rotation', rot);
            el.appendChild(box);
            return box;
          }

          addBox(0.045, 0.13, 0.05, '0 -0.05 0.02', wood, '12 0 0'); // grip
          addBox(0.045, 0.05, 0.14, '0 0.02 -0.04', metal); // frame
          addBox(0.042, 0.045, 0.22, '0 0.058 -0.12', metal); // slide
          addBox(0.045, 0.006, 0.06, '0 -0.028 -0.02', metal); // trigger guard (bottom)
          addBox(0.045, 0.05, 0.006, '0 -0.005 -0.05', metal); // trigger guard (front)
          addBox(0.008, 0.03, 0.008, '0 -0.01 -0.035', brass); // trigger
          addBox(0.03, 0.025, 0.012, '0 0.075 0.025', metal, '20 0 0'); // hammer
          addBox(0.008, 0.012, 0.008, '0 0.085 -0.22', metal); // front sight
          addBox(0.03, 0.01, 0.012, '0 0.083 -0.03', metal); // rear sight

          var flash = document.createElement('a-circle');
          flash.setAttribute('radius', 0.03);
          flash.setAttribute('material', 'color: #ffe066; shader: flat; opacity: 0.9');
          flash.setAttribute('position', '0 0.058 -0.24');
          flash.setAttribute('visible', false);
          flash.classList.add('muzzle-flash');
          el.appendChild(flash);

          var muzzle = document.createElement('a-entity');
          muzzle.setAttribute('position', '0 0.058 -0.235');
          muzzle.classList.add('muzzle');
          el.appendChild(muzzle);
        },
      });

      // ==============================================================
      // COMPONENT: hip-anchor
      // Drives an invisible entity to sit at roughly hip height,
      // offset to one side of the player, following the headset's
      // horizontal position and yaw only (see the comment above the
      // markup for why pitch/roll are excluded).
      // ==============================================================
      AFRAME.registerComponent('hip-anchor', {
        schema: {
          side: { type: 'string', default: 'right' },
        },

        init: function () {
          this.camera = document.querySelector('#head-camera');
          this.offset = this.data.side === 'left' ? -HIP_SIDE_OFFSET : HIP_SIDE_OFFSET;
          this.camPos = new THREE.Vector3();
          this.camQuat = new THREE.Quaternion();
          this.camEuler = new THREE.Euler();
          this.sideVec = new THREE.Vector3();
        },

        tick: function () {
          if (!this.camera || !this.camera.object3D) return;

          this.camera.object3D.getWorldPosition(this.camPos);
          this.camera.object3D.getWorldQuaternion(this.camQuat);
          this.camEuler.setFromQuaternion(this.camQuat, 'YXZ');
          var yaw = this.camEuler.y;

          this.sideVec.set(this.offset, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

          this.el.object3D.position.set(
            this.camPos.x + this.sideVec.x,
            HIP_HEIGHT,
            this.camPos.z + this.sideVec.z
          );
          this.el.object3D.rotation.set(0, yaw, 0);
        },
      });

      // ==============================================================
      // COMPONENT: pistol
      // Owns one gun's state machine and physics:
      //   holstered -> held (grabbed) -> dangling (grip released while
      //   a finger is still resting on the trigger) -> held again
      //   (caught) or falling (finger comes off the trigger too, or
      //   grip released with nothing to catch it) -> resting (on the
      //   ground, grabbable again). Releasing near either hip while
      //   holding it always holsters it instead, regardless of trigger
      //   state — see release() below.
      //
      // Reparenting is done directly on the three.js object3D graph
      // via Object3D.attach(), which reparents while preserving the
      // object's current world transform — the DOM tree is left alone,
      // since nothing here depends on DOM nesting.
      // ==============================================================
      AFRAME.registerComponent('pistol', {
        schema: {
          holster: { type: 'selector' },
        },

        init: function () {
          this.state = 'holstered';
          this.hand = null; // the hand entity currently holding/dangling this gun
          this.recoilTimer = 0; // ms remaining on the current fire-recoil kick, while held

          this.angularVelocity = new THREE.Vector3();
          this.fallVelocity = new THREE.Vector3();
          this.prevPivotPos = new THREE.Vector3();
          this.prevPivotVelocity = new THREE.Vector3();

          this._pivot = new THREE.Vector3();
          this._pivotVelocity = new THREE.Vector3();
          this._pivotAccel = new THREE.Vector3();
          this._comLocal = new THREE.Vector3(0, 0.03, -0.08); // rough center of mass: up/forward of the grip
          this._comWorld = new THREE.Vector3();
          this._down = new THREE.Vector3(0, -1, 0);
          this._torque = new THREE.Vector3();
          this._deltaQuat = new THREE.Quaternion();
          this._worldPos = new THREE.Vector3();
          this._holsterPos = new THREE.Vector3();

          this.el.setAttribute('boxy-gun', '');

          if (this.data.holster) {
            this.attachTo(this.data.holster.object3D, { x: 0, y: 0, z: 0 }, { x: -90, y: 0, z: 0 });
          }
        },

        tick: function (time, dt) {
          var dtSeconds = Math.min((dt || 16) / 1000, 0.05);
          if (this.state === 'dangling') this.updateDangle(dtSeconds);
          else if (this.state === 'falling') this.updateFall(dtSeconds);
          else if (this.state === 'held') this.updateRecoil(dtSeconds);
        },

        attachTo: function (parentObject3D, localPos, localRotDeg) {
          parentObject3D.attach(this.el.object3D);
          if (localPos) this.el.object3D.position.set(localPos.x, localPos.y, localPos.z);
          if (localRotDeg) {
            this.el.object3D.rotation.set(
              (localRotDeg.x * Math.PI) / 180,
              (localRotDeg.y * Math.PI) / 180,
              (localRotDeg.z * Math.PI) / 180
            );
          }
        },

        // Called by hand-rig: either a fresh pickup (from a holster or
        // the ground) or catching this same gun mid-dangle — both are
        // "snap rigidly into this hand" and need no other distinction.
        grab: function (handEl) {
          this.state = 'held';
          this.hand = handEl;
          this.recoilTimer = 0;
          this.attachTo(handEl.object3D, { x: 0, y: 0, z: 0 }, GRIP_TO_BARREL_OFFSET);
          this.angularVelocity.set(0, 0, 0);
        },

        // Runs every frame while held, but only actually does anything
        // for the ~120ms right after a shot: eases the recoil kick back
        // down to the normal held pose. Written as a direct object3D
        // write (like the rest of this component) rather than through
        // A-Frame's animation component, since that animates the core
        // "rotation" component's own cached state — which everything
        // else here bypasses by writing object3D.rotation/quaternion
        // directly — and the two caches falling out of sync is exactly
        // the kind of thing that produces a gun that's rotated wrong
        // for no visible reason.
        updateRecoil: function (dtSeconds) {
          if (this.recoilTimer <= 0) return;

          this.recoilTimer = Math.max(this.recoilTimer - dtSeconds * 1000, 0);
          var kick = RECOIL_KICK_DEG * (this.recoilTimer / RECOIL_RECOVER_MS);

          this.el.object3D.rotation.set(
            ((GRIP_TO_BARREL_OFFSET.x + kick) * Math.PI) / 180,
            (GRIP_TO_BARREL_OFFSET.y * Math.PI) / 180,
            (GRIP_TO_BARREL_OFFSET.z * Math.PI) / 180
          );
        },

        // Called by hand-rig when the hand currently holding this gun
        // releases its grip. fingerOnTrigger reflects whether that
        // hand's finger is resting on (not necessarily pulling) the
        // trigger at that moment.
        release: function (fingerOnTrigger) {
          this.el.object3D.getWorldPosition(this._worldPos);
          var nearestHolster = this.findNearestHolster(this._worldPos);

          if (nearestHolster) {
            this.state = 'holstered';
            this.hand = null;
            this.attachTo(nearestHolster.object3D, { x: 0, y: 0, z: 0 }, { x: -90, y: 0, z: 0 });
            return;
          }

          if (fingerOnTrigger) {
            this.state = 'dangling';
            this.el.sceneEl.object3D.attach(this.el.object3D);
            this.el.object3D.getWorldPosition(this.prevPivotPos);
            this.prevPivotVelocity.set(0, 0, 0);
            return; // this.hand stays set — we're still dangling from it
          }

          this.startFalling();
        },

        // Called directly by hand-rig when the trigger lets go while
        // this gun is dangling from that hand's finger — nothing left
        // to hold it up.
        startFalling: function () {
          this.state = 'falling';
          this.hand = null;
          this.el.sceneEl.object3D.attach(this.el.object3D); // no-op if already world-parented
          this.fallVelocity.set(0, 0, 0);
        },

        findNearestHolster: function (worldPos) {
          var holsters = Array.prototype.slice.call(document.querySelectorAll('.holster-anchor'));
          var nearest = null;
          var nearestDist = HOLSTER_RADIUS;
          for (var i = 0; i < holsters.length; i++) {
            holsters[i].object3D.getWorldPosition(this._holsterPos);
            var d = this._holsterPos.distanceTo(worldPos);
            if (d < nearestDist) {
              nearest = holsters[i];
              nearestDist = d;
            }
          }
          return nearest;
        },

        // Spherical-pendulum-ish swing around a moving pivot (the
        // hand). Because the gun's own origin IS the pivot point (see
        // the boxy-gun comment above), position just tracks the hand
        // exactly each frame — only the orientation swings. Gravity
        // pulls the gun's center of mass toward hanging straight down;
        // the pivot's own acceleration (how fast you're flicking your
        // hand around) injects extra spin, which is what makes a sharp
        // wrist flick throw the gun into a twirl. This is a tuned-for-
        // feel approximation, not a rigorous rigid-body simulation.
        updateDangle: function (dt) {
          if (!this.hand) {
            this.startFalling();
            return;
          }

          this.hand.object3D.getWorldPosition(this._pivot);

          this._pivotVelocity.copy(this._pivot).sub(this.prevPivotPos).divideScalar(dt);
          this._pivotAccel.copy(this._pivotVelocity).sub(this.prevPivotVelocity).divideScalar(dt);
          this.prevPivotVelocity.copy(this._pivotVelocity);
          this.prevPivotPos.copy(this._pivot);

          this._comWorld.copy(this._comLocal).applyQuaternion(this.el.object3D.quaternion).normalize();

          this._torque.crossVectors(this._comWorld, this._down).multiplyScalar(DANGLE_GRAVITY_TORQUE);
          this.angularVelocity.addScaledVector(this._torque, dt);

          this._torque.crossVectors(this._comWorld, this._pivotAccel).multiplyScalar(-DANGLE_INERTIA_SCALE);
          this.angularVelocity.addScaledVector(this._torque, dt);

          this.angularVelocity.multiplyScalar(DANGLE_DAMPING);
          if (this.angularVelocity.length() > MAX_ANGULAR_VELOCITY) {
            this.angularVelocity.setLength(MAX_ANGULAR_VELOCITY);
          }

          this.integrateRotation(dt);
          this.el.object3D.position.copy(this._pivot);
        },

        // Free-fall under gravity, keeping whatever spin it had at the
        // moment it was dropped so it tumbles rather than just sinking
        // straight down. Settles once it reaches the ground.
        updateFall: function (dt) {
          this.fallVelocity.y -= GRAVITY * dt;
          this.el.object3D.position.addScaledVector(this.fallVelocity, dt);
          this.angularVelocity.multiplyScalar(FALL_DAMPING);
          this.integrateRotation(dt);

          if (this.el.object3D.position.y <= GROUND_REST_Y) {
            this.el.object3D.position.y = GROUND_REST_Y;
            this.fallVelocity.set(0, 0, 0);
            this.angularVelocity.set(0, 0, 0);
            this.state = 'resting';
          }
        },

        // Standard dq/dt = 0.5 * omega-as-pure-quaternion * q integration.
        integrateRotation: function (dt) {
          var q = this.el.object3D.quaternion;
          this._deltaQuat.set(
            this.angularVelocity.x * dt,
            this.angularVelocity.y * dt,
            this.angularVelocity.z * dt,
            0
          );
          this._deltaQuat.multiply(q);
          q.set(
            q.x + 0.5 * this._deltaQuat.x,
            q.y + 0.5 * this._deltaQuat.y,
            q.z + 0.5 * this._deltaQuat.z,
            q.w + 0.5 * this._deltaQuat.w
          ).normalize();
        },

        // Raycasts from the muzzle against the targets. Only fires
        // while properly held — not while dangling or mid-air, so a
        // twirl in progress can't accidentally go off.
        fire: function () {
          if (this.state !== 'held') return;

          var muzzleEl = this.el.querySelector('.muzzle');
          if (!muzzleEl || !muzzleEl.object3D) return;

          var origin = new THREE.Vector3();
          var quat = new THREE.Quaternion();
          muzzleEl.object3D.getWorldPosition(origin);
          muzzleEl.object3D.getWorldQuaternion(quat);
          var direction = new THREE.Vector3(0, 0, -1).applyQuaternion(quat).normalize();

          var raycaster = new THREE.Raycaster(origin, direction, 0, MAX_SHOT_RANGE);
          var meshes = Array.prototype
            .slice.call(document.querySelectorAll('.target-ring'))
            .map(function (targetEl) { return targetEl.getObject3D('mesh'); })
            .filter(Boolean);
          var hits = raycaster.intersectObjects(meshes, false);

          this.playMuzzleEffects();

          var endPoint;
          if (hits.length > 0) {
            endPoint = hits[0].point;
            hits[0].object.el.emit('click', null, true);
          } else {
            endPoint = origin.clone().addScaledVector(direction, MAX_SHOT_RANGE);
            var manager = document.querySelector('#range-manager');
            if (manager) manager.emit('gun-miss', null, false);
          }

          spawnTracer(origin, endPoint);
        },

        playMuzzleEffects: function () {
          this.recoilTimer = RECOIL_RECOVER_MS;

          var flash = this.el.querySelector('.muzzle-flash');
          if (flash) {
            flash.setAttribute('visible', true);
            clearTimeout(this.flashTimeout);
            var flashEl = flash;
            this.flashTimeout = setTimeout(function () {
              flashEl.setAttribute('visible', false);
            }, 80);
          }
        },
      });

      // ==============================================================
      // COMPONENT: hand-rig
      // Listens to one hand's grip/trigger buttons. Owns the "what am
      // I currently holding" bookkeeping and delegates all the actual
      // state/physics work to the pistol component on whatever gun is
      // involved.
      // ==============================================================
      AFRAME.registerComponent('hand-rig', {
        init: function () {
          this.heldGun = null; // gun currently rigidly held by this hand, if any
          this.danglingGun = null; // gun currently dangling from this hand's trigger finger, if any
          this.fingerOnTrigger = false; // capacitive touch, not a pull — see triggertouchstart/end below

          this.onGripDown = this.onGripDown.bind(this);
          this.onGripUp = this.onGripUp.bind(this);
          this.onTriggerDown = this.onTriggerDown.bind(this);
          this.onTriggerTouchStart = this.onTriggerTouchStart.bind(this);
          this.onTriggerTouchEnd = this.onTriggerTouchEnd.bind(this);

          this.el.addEventListener('gripdown', this.onGripDown);
          this.el.addEventListener('gripup', this.onGripUp);
          this.el.addEventListener('triggerdown', this.onTriggerDown);
          this.el.addEventListener('triggertouchstart', this.onTriggerTouchStart);
          this.el.addEventListener('triggertouchend', this.onTriggerTouchEnd);
        },

        remove: function () {
          this.el.removeEventListener('gripdown', this.onGripDown);
          this.el.removeEventListener('gripup', this.onGripUp);
          this.el.removeEventListener('triggerdown', this.onTriggerDown);
          this.el.removeEventListener('triggertouchstart', this.onTriggerTouchStart);
          this.el.removeEventListener('triggertouchend', this.onTriggerTouchEnd);
        },

        onGripDown: function () {
          if (this.heldGun) return;

          var gun = this.findGrabbableGun();
          if (!gun) return;

          gun.components.pistol.grab(this.el);
          this.heldGun = gun;
          if (gun === this.danglingGun) this.danglingGun = null;
        },

        onGripUp: function () {
          if (!this.heldGun) return;

          var gun = this.heldGun;
          this.heldGun = null;
          gun.components.pistol.release(this.fingerOnTrigger);

          this.danglingGun = gun.components.pistol.state === 'dangling' ? gun : null;
        },

        // An actual pull (past the digital press threshold), not just
        // a touch — this is what fires the gun.
        onTriggerDown: function () {
          if (this.heldGun) this.heldGun.components.pistol.fire();
        },

        onTriggerTouchStart: function () {
          this.fingerOnTrigger = true;
        },

        // Finger fully lifts off the trigger surface. If a gun is
        // dangling from this hand, that's the last thing holding it up.
        onTriggerTouchEnd: function () {
          this.fingerOnTrigger = false;
          if (this.danglingGun) {
            this.danglingGun.components.pistol.startFalling();
            this.danglingGun = null;
          }
        },

        // Nearest gun this hand is currently allowed to grab: anything
        // holstered or resting on the ground, or the gun already
        // dangling from this specific hand's finger (a "catch").
        findGrabbableGun: function () {
          var handPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(handPos);

          var guns = Array.prototype.slice.call(document.querySelectorAll('.pistol'));
          var self = this;
          var nearest = null;
          var nearestDist = GRAB_RADIUS;
          var gunPos = new THREE.Vector3();

          guns.forEach(function (gunEl) {
            var pistol = gunEl.components.pistol;
            if (!pistol) return;

            var eligible =
              pistol.state === 'holstered' ||
              pistol.state === 'resting' ||
              (pistol.state === 'dangling' && pistol.hand === self.el);
            if (!eligible) return;

            gunEl.object3D.getWorldPosition(gunPos);
            var d = gunPos.distanceTo(handPos);
            if (d < nearestDist) {
              nearest = gunEl;
              nearestDist = d;
            }
          });

          return nearest;
        },
      });

      // ==============================================================
      // COMPONENT: proximity-haptics
      // Generic and reusable — has no idea what a pistol is. Buzzes
      // this hand's controller whenever the nearest ".grabbable"
      // entity in the scene is within PROXIMITY_HAPTIC_RADIUS. Future
      // interactive props just need class="grabbable" to opt into the
      // same behavior; nothing here needs to change for them.
      //
      // Two things it skips, so it doesn't buzz misleadingly:
      //   - whatever this hand is already holding (its object3D is
      //     currently parented under this hand's object3D — true for
      //     anything that follows the same "attach to the hand's
      //     object3D when held" convention pistol.grab() uses)
      //   - everything, if hand-rig (when present) reports this hand
      //     as already full, since you can't grab a second thing
      //     right now anyway
      // ==============================================================
      AFRAME.registerComponent('proximity-haptics', {
        init: function () {
          this.handPos = new THREE.Vector3();
          this.targetPos = new THREE.Vector3();
        },

        tick: function () {
          var handRig = this.el.components['hand-rig'];
          if (handRig && handRig.heldGun) return;

          var trackedControls = this.el.components['tracked-controls'];
          var gamepad = trackedControls && trackedControls.controller;
          var actuator = gamepad && gamepad.hapticActuators && gamepad.hapticActuators[0];
          if (!actuator) return;

          this.el.object3D.getWorldPosition(this.handPos);

          var targets = document.querySelectorAll('.grabbable');
          var inRange = false;

          for (var i = 0; i < targets.length; i++) {
            var targetEl = targets[i];
            if (targetEl.object3D.parent === this.el.object3D) continue; // already holding this one

            targetEl.object3D.getWorldPosition(this.targetPos);
            if (this.handPos.distanceTo(this.targetPos) < PROXIMITY_HAPTIC_RADIUS) {
              inRange = true;
              break;
            }
          }

          if (inRange) {
            actuator.pulse(PROXIMITY_HAPTIC_INTENSITY, PROXIMITY_HAPTIC_PULSE_MS);
          }
        },
      });

      // ==============================================================
      // COMPONENT: scoring-ring
      // Attached to each colored disc of a bullseye. Scores a hit,
      // flashes white for feedback, and emits "ring-hit" which bubbles
      // up to the range manager. Fires on the standard "click" event so
      // it doesn't care whether that click came from a fired shot
      // (pistol.fire, above) or a desktop/phone reticle tap.
      // ==============================================================
      AFRAME.registerComponent('scoring-ring', {
        schema: {
          score: { type: 'number' },
          label: { type: 'string' },
        },

        init: function () {
          this.baseColor = this.el.getAttribute('color');
          this.onClick = this.onClick.bind(this);
          this.el.addEventListener('click', this.onClick);
        },

        remove: function () {
          this.el.removeEventListener('click', this.onClick);
        },

        onClick: function () {
          this.el.setAttribute('material', 'color', '#FFFFFF');
          this.el.setAttribute('animation__flash', {
            property: 'material.color',
            type: 'color',
            to: this.baseColor,
            dur: 200,
            easing: 'easeOutQuad',
          });
          this.el.emit(
            'ring-hit',
            { score: this.data.score, label: this.data.label },
            true
          );
        },
      });

      // ==============================================================
      // COMPONENT: shooting-range
      // The range manager. Spawns a few target stands, listens for
      // "ring-hit" bubbling up from any ring plus "gun-miss" from a
      // fired shot that hit nothing, and keeps score on the HUD.
      // ==============================================================
      AFRAME.registerComponent('shooting-range', {
        init: function () {
          this.score = 0;
          this.shots = 0;
          this.hud = document.querySelector('#hud-text');

          this.onRingHit = this.onRingHit.bind(this);
          this.onMiss = this.onMiss.bind(this);
          this.el.addEventListener('ring-hit', this.onRingHit);
          this.el.addEventListener('gun-miss', this.onMiss);

          this.spawnTarget(-1.6, 1.3, -4, 12);
          this.spawnTarget(0, 1.5, -5, 0);
          this.spawnTarget(1.6, 1.2, -4.2, -12);

          this.updateHud('Draw a pistol and take aim');
        },

        onRingHit: function (evt) {
          this.shots++;
          this.score += evt.detail.score;
          this.updateHud(evt.detail.label + '  +' + evt.detail.score);
        },

        onMiss: function () {
          this.shots++;
          this.updateHud('MISS');
        },

        updateHud: function (message) {
          this.hud.setAttribute(
            'text',
            'value',
            'Score: ' + this.score + '   Shots: ' + this.shots + '\n' + message
          );
        },

        spawnTarget: function (x, standHeight, z, rotY) {
          var stand = document.createElement('a-entity');
          stand.setAttribute('position', { x: x, y: 0, z: z });
          stand.setAttribute('rotation', { x: 0, y: rotY, z: 0 });

          var post = document.createElement('a-box');
          post.setAttribute('width', 0.08);
          post.setAttribute('depth', 0.08);
          post.setAttribute('height', standHeight);
          post.setAttribute('position', { x: 0, y: standHeight / 2, z: 0 });
          post.setAttribute('color', '#5b4633');
          stand.appendChild(post);

          var board = document.createElement('a-box');
          board.setAttribute('width', 1.1);
          board.setAttribute('height', 1.1);
          board.setAttribute('depth', 0.04);
          board.setAttribute('position', { x: 0, y: standHeight, z: 0 });
          board.setAttribute('color', '#8a6d4b');
          stand.appendChild(board);

          var rings = [
            { radius: 0.5, color: '#f4f1de', score: 10, label: 'Outer ring' },
            { radius: 0.4, color: '#1b1b1b', score: 25, label: 'Black ring' },
            { radius: 0.3, color: '#2274a5', score: 50, label: 'Blue ring' },
            { radius: 0.2, color: '#c1121f', score: 75, label: 'Red ring' },
            { radius: 0.1, color: '#ffd60a', score: 100, label: 'BULLSEYE' },
          ];

          rings.forEach(function (ring, i) {
            var circle = document.createElement('a-circle');
            circle.setAttribute('radius', ring.radius);
            circle.setAttribute('color', ring.color);
            circle.setAttribute('position', { x: 0, y: standHeight, z: 0.021 + i * 0.002 });
            circle.classList.add('target-ring');
            circle.setAttribute('scoring-ring', { score: ring.score, label: ring.label });
            stand.appendChild(circle);
          });

          this.el.appendChild(stand);
        },
      });
    </script>
  </body>
</html>
