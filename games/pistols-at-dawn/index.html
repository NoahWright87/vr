        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;

        display: flex;
        justify-content: space-between;
        align-items: center;

      }
      /* Flat HTML teleport panel — outside the canvas, so it's a
         desktop/phone-browser convenience the same way the reticle
         fallback is, and not reachable by hand in a headset. The real
         in-headset equivalent is the watch's own TELEPORT page (see
         the #watch-menu-template markup and teleport-hub's
         menu-item-select listener in world-town.js) — this panel stays
         alongside it purely so teleporting is still sanity-checkable
         without a headset. */
      #teleport-buttons {
        position: absolute;
        bottom: 1rem;
        right: 1rem;
        z-index: 1;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;
        background: rgba(0, 0, 0, 0.55);
        padding: 0.6rem;
        border-radius: 6px;
      }
      #teleport-buttons .teleport-label {
        color: #ccc;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.1rem;
      }
      #teleport-buttons button {
        font-size: 0.9rem;
        padding: 0.35rem 0.9rem;
        cursor: pointer;
      }
    </style>

    <a-scene pistols-watch-menu area-manager scene-index hotbar-equip>
      <a-sky color="#7d6b8f" data-area-persistent></a-sky>
      <!-- Area fragments may add their own lamps, but these outdoor lights
           live for the whole session. Without a persistent baseline the
           Saloon's lamps can replace A-Frame's implicit default lights and
           leave Ghost Town black after the Saloon fragment is removed. -->
      <a-entity data-area-persistent light="type: ambient; color: #d8d0c0; intensity: 0.48"></a-entity>
      <a-entity data-area-persistent light="type: directional; color: #fff3d6; intensity: 0.75" position="-3 7 4"></a-entity>

      <!-- ============================================================
           PLAYER RIG + DESKTOP/PHONE FALLBACK
           The grab/holster/dangle mechanic below reads hand-rig's own
           entity transform and raw gripdown/gripup/triggerdown/
           triggerup events — the same events a real Touch controller's
           squeeze fires. Confirmed empirically (headless Playwright
           against the real dev build, not just read from source): while
           not presenting to WebXR, oculus-touch-controls/tracked-
           controls never attaches/activates at all (no controller to
           track), so nothing fights semantic-hand's own non-XR pose
           writes to this same entity — meaning a desktop/mobile input
           layer that (a) poses a hand's transform via semantic-hand's
           existing setWorldTransform/setPointPose and (b) emits those
           same four raw events on that hand element drives hand-rig,
           holsterable, and firearm completely unchanged, with no new
           code needed in any of those files. Drawing a holstered pistol
           this way (snap the hand to the pistol's world transform, then
           emit gripdown) round-trips correctly today.
           The one nuance worth knowing before wiring a "put it back"
           gesture: holsterable.release() checks the ITEM's own current
           world position against nearby slots, and a held item sits at
           the hand's grip child plus a heldPosition offset — not
           exactly wherever the hand was placed — so re-holstering needs
           to aim the hand so the ITEM (not the hand) lands back within
           an anchor-slot's catch radius, or release() falls through to
           startFalling() instead. See TODO.md's "Desktop semantic
           hands" section for the write-up.
           The reticle + click-to-score fallback from the previous
           version is kept as-is for now, alongside this, purely so
           target scoring stays sanity-checkable without a headset even
           before every weapon is reachable this way.

           Camera and hands used to be top-level scene entities with no
           shared parent — fine when the only way to get around was the
           island's own flip-in-place trick (see world-saloon-bar.js),
           dead wrong the moment "teleport somewhere else" needs to mean
           anything. Wrapping both under one entity and moving THAT
           entity is the standard WebXR room-scale rig pattern: the
           headset/controllers' own tracked pose becomes local to
           whatever parent they sit under, so nothing about head or
           hand tracking changes — see world-town.js's teleport-hub,
           attached here, for the part that actually moves it.

           Everything that reads camera/hand position elsewhere in the
           codebase does so via object3D.getWorldPosition/
           getWorldQuaternion rather than the raw local .position/
           .rotation, which is what makes this wrap safe without
           touching any of that code — world-space reads already
           resolve through whatever parent chain exists.

           body-anchor (waist/back, below) deliberately stays OUTSIDE
           this rig: it already recomputes its own world position from
           the camera's world position every tick, so it tracks the
           rig's movement for free regardless of where it sits in the
           hierarchy.
      ============================================================ -->
      <a-entity
        id="player-rig"
        teleport-hub
        locomotion-demo="speed: 3; sprintMultiplier: 1.5"
        semantic-look-controls="camera: #head-camera"
        gamepad-input="leftHand: #left-hand; rightHand: #right-hand; sprintAction: sprint; aimAction: aim"
        touch-controls="leftHand: #left-hand; rightHand: #right-hand; primaryAction: activate; primaryLabel: FIRE; interactAction: interact; interactLabel: INTERACT; grabAction: grab; grabLabel: PICKUP; watchAction: watch; watchLabel: WATCH; crouchAction: crouch; hotbar1Action: hotbar1; hotbar2Action: hotbar2; hotbar3Action: hotbar3; aimAction: aim; aimLabel: AIM"
        desktop-controls="camera: #head-camera; leftHand: #left-hand; rightHand: #right-hand; sprintEnabled: true"
        data-area-persistent
      >
        <a-camera id="head-camera">
          <a-entity id="player-hud">
            <a-text
              id="hud-text"
              value="Score: 0   Shots: 0"
              align="center"
              color="#FFFFFF"
              width="2"
              position="0 -0.35 -1"
            ></a-text>
            <a-text
              id="vice-text"
              value=""
              align="center"
              color="#ffd9a0"
              width="1.6"
              position="0 -0.46 -1"
            ></a-text>
          </a-entity>
          <a-text
            id="performance-text"
            performance-monitor
            visible="false"
            value=""
            align="center"
            color="#9dffb0"
            width="1.45"
            position="0 0.37 -1"
          ></a-text>
          <a-entity
            id="reticle-cursor"
            cursor="fuse: false"
            reticle-fallback
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
            material="color: #FFFFFF; shader: flat; opacity: 0.8"
            raycaster="objects: .shootable; far: 75"
          ></a-entity>

          <!-- Teleport fade: a plain black quad parented to the camera so
               it always covers the view regardless of head orientation.
               teleport-hub (world-town.js) animates its opacity up, jumps
               the rig's position, then fades it back down — a blink
               instead of a snap, which is the whole comfort case for
               teleport over sliding. Not .shootable/.grabbable, so it's
               otherwise invisible to every other system. -->
          <a-plane
            id="teleport-fade"
            width="6"
            height="6"
            position="0 0 -0.2"
            material="color: #000000; shader: flat; opacity: 1; transparent: true; depthTest: false"
          ></a-plane>
          <a-text
            id="area-loading-text"
            value="Loading..."
            align="center"
            color="#FFFFFF"
            width="0.65"
            position="0 0 -0.18"
            material="shader: flat; depthTest: false"
          ></a-text>

          <!-- Nested directly under the camera (rather than a body-anchor-style
               tick() component) so it inherits full head rotation for free,
               pitch/roll included — unlike the hips, a worn hat SHOULD tilt
               with your head. The 0.1m vertical offset is an estimate for
               "brim just clips the top of view"; real headset FOV isn't
               something testable from here, so this (and/or boxy-hat's own
               geometry) will likely need eyes-on tuning. A medium anchor-slot
               — yes, you can wear a gun on your head like a hat. `swap` (see
               anchor-slot's own comment) means trying on a wardrobe hat while
               already wearing one just replaces it instead of bouncing off a
               full slot — the old hat falls, exactly like an evicted belt. -->
          <a-entity id="head-anchor" class="anchor-slot" anchor-slot="size: medium; swap: true" position="0 0.1 0"></a-entity>

          <!-- Drunk vision. Parented to the camera on purpose: rigidly
               head-locked means there is no relative motion for your
               inner ear to argue with, which is the whole reason the
               alcohol effects are allowed to be visual at all. -->
          <a-entity booze-overlay></a-entity>

          <!-- Your mouth: an ordinary small anchor-slot that happens to
               sit under the camera, with capacity for five. Nothing about
               it is cigar-specific — it's the same socket as a hip
               holster, so a pistol clenched in your teeth is a perfectly
               legal thing to do.

               A slot this close to your eyes needs its indicator kept on
               a very short leash: idleHidden plus a tenth-scale sphere
               plus revealDistance means it's a small dot that only shows
               up in the last few centimeters, rather than a bright ball
               parked in the middle of your vision the whole time you're
               carrying anything small. fanSpread/fanYaw are wide enough
               that five cigars read as a hand of cards. -->
          <a-entity
            id="mouth-anchor"
            class="anchor-slot"
            anchor-slot="size: small; capacity: 5; fanSpread: 0.032; fanYaw: 21; idleHidden: true; indicatorScale: 0.35; revealDistance: 0.16"
            position="0 -0.07 -0.08"
          ></a-entity>

          <!-- The player's own body: a simple ghost (see boxy-ghost and
               the GHOST BODY constants). Nested here, like the hat, so it
               inherits full head rotation. Unlike the hat, this one is
               built so its front surface sits just behind the camera
               rather than fully enclosing it (GHOST_FRONT_Z) — nothing
               of it is ever in front of you looking forward, so there's
               nothing to see yourself, which is the entire reason
               #mirror exists. -->
          <a-entity id="player-ghost" boxy-ghost></a-entity>
        </a-camera>

        <!-- ============================================================
             HANDS
             Two entities per hand, deliberately decoupled:

             - oculus-touch-controls (model:false) is the one the gun
               actually attaches to and the one hand-rig listens to for
               grip/trigger events. Its forward axis is the same one
               laser-controls uses for aiming in Cube Pop, so a gun
               welded to it points where you'd expect.
             - hand-controls is purely cosmetic: it renders the animated
               hand mesh (fist on grip, point on trigger) at the same
               tracked position, but its own orientation convention is
               tuned for a believable-looking hand pose, not for "-Z is
               where you're pointing" — which is why the first version of
               this file, with the gun parented directly to a
               hand-controls entity, aimed inconsistently.

             Because the two are separate entities, anything that
             perturbs "your hand" (drink and cigar shakes — see
             hand-rig.updateGrip) has to be applied to both, or the gun
             would visibly detach from the fist holding it. hand-rig
             takes a selector to its own cosmetic twin for exactly that.

             proximity-haptics is generic and unrelated to pistols
             specifically — see its own comment below. The "hand" class
             is what lets generic helpers like findOtherHand and
             findCatchingHand (used for tossing/catching) enumerate both
             hands without hardcoding left/right.

             hand-with-watch (common/watch-menu.js) is what puts a
             pokeable/pointable wrist watch on each hand — see the
             TELEPORT template page below and teleport-hub's own
             menu-item-select listener (world-town.js) for how it feeds
             into teleport. Nested inside #player-rig (rather than
             top-level, which is how the shared component itself
             assumes hands sit) so a menu-item-select the watch emits
             bubbles up through the rig on its way to <a-scene>,
             exactly like it would from a top-level hand — the wrap
             doesn't change that path, just adds a stop along it.

             hand-with-watch must be declared before semantic-hand:
             A-Frame inits attribute components in source order, and
             semantic-hand's own init() looks up hand-with-watch's
             wrapperEl synchronously to parent its desktop-only cosmetic
             hand inside the watch's corrective rotation. Declared the
             other way around, semantic-hand finds no wrapperEl yet and
             falls back to parenting directly on the hand entity instead
             — same mesh, wrong orientation.
        ============================================================ -->
        <a-entity id="left-hand" class="hand" oculus-touch-controls="hand: left; model: false" hand-rig="visual: #hand-visual-left" hand-with-watch="hand: left" semantic-hand="hand: left; maxReach: 1" proximity-haptics></a-entity>
        <a-entity id="hand-visual-left" hand-controls="hand: left; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>

        <a-entity id="right-hand" class="hand" oculus-touch-controls="hand: right; model: false" hand-rig="visual: #hand-visual-right" hand-with-watch="hand: right" semantic-hand="hand: right; maxReach: 1" proximity-haptics></a-entity>
        <a-entity id="hand-visual-right" hand-controls="hand: right; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>
      </a-entity>
      <!-- end #player-rig -->

      <!-- ============================================================
           BODY ANCHORS
           Three invisible anchor points track the player's body: the
           waist (medium — belt-sized), chest (medium — vest-sized),
           and a back-center bandolier point (large — shotgun-sized).
           There's no real body tracking on a Quest, so body-anchor
           approximates all three from the headset:
           position and yaw (turning left/right) only, deliberately
           ignoring pitch/roll so looking up or tilting your head
           doesn't drag them around.

           anchor-slot is the generic snap-target component (see its
           own comment): any ".grabbable" item whose itemSize fits a
           given slot's size can be released, thrown, or caught into
           it — this is NOT restricted to "guns go in holsters." A
           slot's translucent sphere brightens as a compatible carried
           item approaches, with a quick "click" bounce right as it
           enters snap range.

           The waist and chest anchors have anchor-slot's `swap` flag set:
           bringing new equipment to either replaces whatever is already
           worn there rather than requiring the old piece to be pulled off.
           The waist starts stocked with belt-classic,
           which is what actually carries the two hip holsters pistols
           start in now — see STOCK AND PERISHING and `belt`'s own
           comment for where the old standalone hip-left/hip-right
           anchors went. The chest starts with the two-pocket vest and
           its refilling blade packs. The back anchor works exactly as it always
           has: stocked once at scene load, never refilled, a shotgun
           on your back when you start and a pocket after that.
      ============================================================ -->
      <a-entity id="waist-anchor" data-area-persistent class="anchor-slot" body-anchor="side: waist" anchor-slot="size: medium; swap: true" stocked="item: belt-classic"></a-entity>
      <a-entity id="chest-anchor" data-area-persistent class="anchor-slot" body-anchor="side: chest" anchor-slot="size: medium; swap: true; idleHidden: true; indicatorScale: 0.5; revealDistance: 0.2" stocked="item: vest-classic"></a-entity>
      <a-entity id="back-anchor" data-area-persistent class="anchor-slot" body-anchor="side: back" anchor-slot="size: large" stocked="item: shotgun"></a-entity>
      <!-- DOM home for props carried out of a disposable area. Their three.js
           parent remains the hand/body/item slot that actually poses them. -->
      <a-entity id="carried-items" data-area-persistent></a-entity>

      <!-- ============================================================
           THE HAT
           The guns used to be declared here alongside it, as
           free-standing entities. They aren't any more: a rack that
           refills itself has to be able to build a pistol, so the
           declaration of what a pistol IS moved into an item maker (see
           ITEM MAKERS) and the holsters above just name it. What used
           to be four props in markup is now one prop and three sockets.

           Everything the guns relied on still applies to the hat, and
           reads the same way in either place: it's a free-standing
           entity rather than something nested under a hand, so it can
           be reparented at runtime between a slot, a hand, or loose in
           the world; the whole holster/hold/dangle/fall/throw/catch
           state machine is the generic "holsterable" component; and
           the "grabbable" class is what makes proximity-haptics notice
           it and hand-rig willing to pick it up.

           itemSize is the only thing that decides which slots an object
           can snap into (see holsterable.findNearestSlot) — there's no
           per-object list of "which anchors." Pistols are small (fit
           any slot), the hat is medium (head or the back bandolier —
           NOT a hip holster, it's too big), the shotgun is large (only
           the bandolier and the armoury's cradles fit it).

           The hat's holsterPosition/comOffset look unusual compared to
           the guns' — see boxy-hat's comment for why: its origin is
           deliberately offset to one edge of the inner brim (like a
           finger hooked under the rim) rather than centered, so the
           exact same dangle physics that makes a gun swing from the
           trigger guard makes the hat swing from that point instead.
           It also carries its own small anchor-slot tucked inside the
           crown (see boxy-hat) — hide a gun in your hat.
      ============================================================ -->
      <!-- ============================================================
           THE ISLAND
           Everything saloon-bar builds — bar, armoury, and now a
           wardrobe the same size — lives on one shared floor that
           flips upside-down, normally sitting directly underground.
           See saloon-bar's own comment for the full mechanism (it's a
           generalization of THE REVOLVING BAR one level up, not a new
           trick) and the THE ISLAND / BELL POLE constants comment for
           why: no locomotion yet, so this ridiculous flipping rig is
           how a single test zone gets to hold more than one thing
           worth trying, everything reachable from the same spot.

           Both bells that drive it live on boxy-bell-pole instead,
           deliberately unparented from any of this — see its own
           comment for why a bell can't be part of what it controls.

           The counter is also a drum with a second face: ring the
           horizontal-spin bell and it turns over to show an armoury,
           beers and all (or the wardrobe's other side, whichever's
           currently up) — see THE REVOLVING BAR. The mirror lives on
           the wardrobe's own front face, same idea: a plain `scope`
           pointed at the player instead of down a barrel.

           anchor-slots along the counter top are where the bottles and
           cigars start "holstered." That's the whole trick: the bar is
           just furniture with sockets, so a bottle can go back on the
           bar, into your hip holster, into your hat, or into your
           mouth, and a pistol can be set down on the bar, with no code
           anywhere that knows bottles belong on bars.

           vice-meter and world-systems are the two scene-level
           bookkeepers: how drunk/shaky you currently are, and the
           per-frame particle/wind/ignition simulation shared by gun
           smoke, cigar smoke, and shattering glass.
      ============================================================ -->
      <a-entity id="vices" vice-meter data-area-persistent></a-entity>
      <a-entity world-systems data-area-persistent></a-entity>

      <!-- ============================================================
           TARGET GALLERY
           range-manager owns score/shots/HUD only. Everything else
           Exactly one configurable gallery is active. Watch > Targets
           swaps its target component while retaining the selected settings.
      ============================================================ -->
      <!-- area-manager keeps exactly one fragment from areas/ mounted here. -->
      <a-entity id="area-host" data-area-persistent></a-entity>

      <!-- ============================================================
           TOWN
           Everywhere teleport-hub (world-town.js) knows how to send the
           player. The range above is the first stop, at the origin,
           unchanged. The saloon (world-saloon-darts.js), the farm
           (world-farm.js), and the stable (world-stable.js) are
           physically separate locations, each far enough from the
           others that nothing in any of them has to know the rest of
           the town exists — and each its own file, so none of them can
           disturb each other. Future stops in a bigger town are just
           more entries in TOWN_LOCATIONS plus whatever builds that
           spot, following the same "world-<place>.js" naming this
           file's own comment block describes.
      ============================================================ -->
    </a-scene>
