            this.calibPhase = 1;
            this.calibPhaseEndTime = Date.now() + CALIBRATION_PHASE_MS;
            this.showLabel('Now reach OVERHEAD with both arms!', CALIBRATION_PHASE_MS);
          } else {
            reachForward = clamp(this.calibMaxForward, REACH_MIN, REACH_MAX);
            reachOverhead = clamp(this.calibMaxOverhead, REACH_MIN, REACH_MAX);
            this.calibrating = false;
            this.showLabel('Calibrated! ' + reachForward.toFixed(2) + 'm / ' + reachOverhead.toFixed(2) + 'm', 2000);
          }
        },

        updateStatsHud: function () {
          if (!this.statsText || !this.lastStats) return;
          var s = this.lastStats;
          this.statsText.setAttribute(
            'value',
            (s.axis === 'overhead' ? 'UPPERCUT' : 'PUNCH') + (s.fullyExtended ? ' full-ext' : ' stopped') +
              '\nMaxSpd ' + s.maxSpeed.toFixed(1) + '  HandDist ' + s.handDist.toFixed(2) + '  HeadDist ' + s.headDist.toFixed(2) +
              '\nMag ' + s.magnitude.toFixed(1) + (s.capped ? ' -> ' + s.appliedMagnitude.toFixed(1) + ' (capped)' : '') +
              '\n' + s.outcome + (s.locked ? '  dist ' + s.distToTarget.toFixed(2) + 'm' : '') + (s.hitAssisted ? '  [assist]' : '')
          );
        },

        // Continuously-updating (not post-punch-snapshot) view of the
        // handful of raw numbers punch-tracker's extension state machine
        // actually reads every frame — both hands' raw vs. head-relative
        // speed and current forward/overhead axis state, the live stop-
        // speed/turn-filter thresholds, and the calibrated reach values.
        // This is deliberately everything the detection logic uses to
        // decide "is this a punch" in one place, so a confusing moment
        // in-headset can be read directly off this HUD — or
        // screenshotted — instead of guessed at from outside the headset.
        updateLiveDebugHud: function () {
          if (!this.liveDebugText) return;
          var lt = this.leftHand && this.leftHand.components['punch-tracker'];
          var rt = this.rightHand && this.rightHand.components['punch-tracker'];

          function stateChar(s) { return s === 'armed' ? 'A' : s === 'extending' ? 'E' : 'H'; }
          function handLine(label, t) {
            if (!t || !t.fwd) return label + ' --';
            return (
              label +
              ' raw ' + t.rawSpeed.toFixed(2) +
              ' rel ' + t.speed.toFixed(2) +
              ' F:' + stateChar(t.fwd.state) + ' U:' + stateChar(t.up.state)
            );
          }

          function haptic(v) { return v === null ? '?' : v ? 'yes' : 'no'; }

          var lines = [
            handLine('L', lt),
            handLine('R', rt),
            'stop ' + (lt ? lt.data.stopSpeed.toFixed(2) : '-') +
              ' turn ' + (lt ? Math.round(lt.data.headBlend * 100) : '-') + '%' +
              ' reach ' + reachForward.toFixed(2) + '/' + reachOverhead.toFixed(2) + 'm',
            'assist ' + hitAssistMode + '  rig vel ' + this.velocity.length().toFixed(2),
            'haptics L:' + haptic(hapticActuatorSeen.left) + ' R:' + haptic(hapticActuatorSeen.right) +
              '  vignette ' + this.vignetteOpacity.toFixed(2),
          ];
          this.liveDebugText.setAttribute('value', lines.join('\n'));
        },

        showLabel: function (label, durationMs) {
          if (!this.labelText) return;
          this.labelText.setAttribute('value', label);
          this.labelText.setAttribute('visible', true);
          clearTimeout(this.labelTimeout);
          var el = this.labelText;
          this.labelTimeout = setTimeout(function () {
            el.setAttribute('visible', false);
          }, durationMs || 500);
        },

        resetPosition: function () {
          this.el.object3D.position.set(0, 0, 0);
          this.el.object3D.rotation.y = 0; // undo any accumulated 'turn' hit-assist yaw
          this.velocity.set(0, 0, 0);
          this.grounded = true;
        },
      });

      // ==============================================================
      // COMPONENT: cube-behavior
      // Drives a cube's own horizontal movement (independent of the
      // player) plus a constant vertical bob. Modes:
      //   bob     - stationary, just the float (the original Cube Pop
      //             feel).
      //   chase   - slowly drifts toward the player rig's position,
      //             stopping just short so it doesn't clip into you.
      //   patrol  - walks back and forth between two fixed points.
      //   wander  - picks a new nearby random point every couple of
      //             seconds and ambles toward it.
      // "chase" reads the rig's own position as a stand-in for "where
      // the player is" (not the headset's exact room-scale offset) —
      // close enough for a slow approach AI in a POC.
      // ==============================================================
      AFRAME.registerComponent('cube-behavior', {
        schema: {
          mode: { type: 'string', default: 'idle' },
          speed: { type: 'number', default: 0.5 },
        },

        init: function () {
          // Enemies are grounded humanoids now (see punch-game.spawnCube)
          // — this entity's own position is always the character's feet/
          // ground contact point, y=0 at rest. There is deliberately no
          // vertical idle animation any more (the old "bob" float): a
          // training dummy standing still just... stands still.
          this.basePos = this.el.object3D.position.clone();
          this.rig = document.querySelector('#rig');

          this.patrolA = this.basePos.clone();
          this.patrolB = this.basePos
            .clone()
            .add(new THREE.Vector3((Math.random() - 0.5) * 3, 0, (Math.random() - 0.5) * 3));
          this.patrolTarget = this.patrolB;

          this.wanderTarget = this.basePos.clone();
          this.nextWanderTime = 0;

          this.scratch = new THREE.Vector3();

          // Real physical knockback, separate from the mode-driven
          // movement above: a decaying velocity applied on top of (and,
          // while significant, in place of) the normal chase/patrol/
          // wander/idle position updates. See applyKnockback, called
          // from punch-target.hit() on a non-lethal hit and from
          // punch-game's cube-on-cube collision check.
          this.knockbackVel = new THREE.Vector3();
          this.trailAccum = 0;
          this.wasSliding = false;
        },

        // dir: normalized THREE.Vector3, speed: m/s. Additive (not a
        // straight overwrite) so a cube already sliding from one hit and
        // then clipped by another — or slammed into a neighbor — gets a
        // combined push rather than the second hit just resetting the
        // first's momentum.
        applyKnockback: function (dir, speed) {
          this.knockbackVel.addScaledVector(dir, speed);
          if (this.knockbackVel.length() > CUBE_KNOCKBACK_MAX_SPEED) {
            this.knockbackVel.setLength(CUBE_KNOCKBACK_MAX_SPEED);
          }
        },

        tick: function (time, deltaMs) {
          if (!deltaMs) return;
          // Same guard as punch-locomotion's tick — without it, a single
          // slow/coalesced frame (a real headset hitch, a GC pause, a
          // backgrounded tab) integrates gravity over an oversized dt in
          // one step, and since only applyKnockback's addScaledVector
          // path checks the speed cap, that one-frame spike goes in
          // uncapped: confirmed via testing, an unclamped dt let a cube's
          // downward knockback velocity run away to 100+ m/s instead of
          // settling back to ~0.
          var dt = Math.min(deltaMs / 1000, 0.05);
          var pos = this.el.object3D.position;
          var knockSpeed = this.knockbackVel.length();

          if (knockSpeed > CUBE_KNOCKBACK_MIN_SPEED) {
            // Sliding from a hit: integrate knockback velocity directly
            // into position (in place of the mode-driven movement below,
            // which would otherwise fight it every frame), with friction
            // decaying horizontal speed and a light "gravity" pulling any
            // vertical launch back down. Hitting the room bounds (a wall)
            // or the floor while still moving fast enough is a genuinely
            // sudden stop — "move fast and break things": that lost
            // speed becomes impact damage below, separate from and on
            // top of whatever punch caused the slide in the first place.
            var impactLostSpeed = 0;

            var nextX = pos.x + this.knockbackVel.x * dt;
            if (nextX > CUBE_ROOM_BOUND) {
              impactLostSpeed += Math.abs(this.knockbackVel.x);
              nextX = CUBE_ROOM_BOUND;
              this.knockbackVel.x = 0;
            } else if (nextX < -CUBE_ROOM_BOUND) {
              impactLostSpeed += Math.abs(this.knockbackVel.x);
              nextX = -CUBE_ROOM_BOUND;
              this.knockbackVel.x = 0;
            }
            pos.x = nextX;

            var nextZ = pos.z + this.knockbackVel.z * dt;
            if (nextZ > CUBE_ROOM_BOUND) {
              impactLostSpeed += Math.abs(this.knockbackVel.z);
              nextZ = CUBE_ROOM_BOUND;
              this.knockbackVel.z = 0;
            } else if (nextZ < -CUBE_ROOM_BOUND) {
              impactLostSpeed += Math.abs(this.knockbackVel.z);
              nextZ = -CUBE_ROOM_BOUND;
              this.knockbackVel.z = 0;
            }
            pos.z = nextZ;

            var nextY = pos.y + this.knockbackVel.y * dt;
            if (nextY <= 0) {
              // Landed: zero the vertical component so gravity stops
              // accumulating on it. Without this, a cube resting on the
              // floor clamp keeps falling in velocity space forever (its
              // position just can't follow), so knockbackVel.length()
              // never drops back below CUBE_KNOCKBACK_MIN_SPEED and the
              // cube is stuck "sliding" (skipping its normal behavior)
              // indefinitely even though it looks stationary. Only a
              // downward landing counts as an impact — this branch can
              // also be reached at exactly y=0 with no vertical velocity
              // at all (a purely horizontal slide), which isn't a hit.
              if (this.knockbackVel.y < 0) impactLostSpeed += -this.knockbackVel.y;
              pos.y = 0;
              this.knockbackVel.y = 0;
            } else {
              pos.y = nextY;
              this.knockbackVel.y -= CUBE_KNOCKBACK_GRAVITY * dt;
            }

            var damping = Math.exp(-dt * CUBE_KNOCKBACK_FRICTION);
            this.knockbackVel.x *= damping;
            this.knockbackVel.z *= damping;

            var target = this.el.components['punch-target'];

            if (impactLostSpeed > CUBE_IMPACT_MIN_LOST_SPEED && target) {
              target.takeImpactDamage((impactLostSpeed - CUBE_IMPACT_MIN_LOST_SPEED) * CUBE_IMPACT_DAMAGE_PER_SPEED);
            }

            if (cubeTrailEnabled && knockSpeed > CUBE_TRAIL_MIN_SPEED && target) {
              this.trailAccum += dt;
              if (this.trailAccum >= CUBE_TRAIL_INTERVAL) {
                this.trailAccum = 0;
                var sizeFactor = clamp(knockSpeed / CUBE_KNOCKBACK_MAX_SPEED, 0.2, 1);
                paintSplat(
                  pos.x,
                  pos.z,
                  '#' + target.baseColor.getHexString(),
                  SPLAT_TRAIL_RADIUS * (0.5 + sizeFactor * 0.5),
                  SPLAT_TRAIL_OPACITY
                );
              }
            }
            this.wasSliding = true;
            return;
          }

          this.knockbackVel.set(0, 0, 0);
          pos.y = 0; // always grounded once settled

          if (this.wasSliding) {
            // Just settled from a knockback: re-anchor patrol/wander's
            // reference points to wherever the cube actually ended up,
            // rather than leaving them pointing at its original spawn
            // location. Without this, a cube punched well away from
            // where it spawned would slide to a stop and then calmly
            // walk itself back toward its old spot once its behavior
            // resumed — a milder echo of the same "magically resets"
            // complaint the knockback rewrite was meant to fix.
            this.basePos.copy(pos);
            this.patrolA.copy(this.basePos);
            this.patrolB.copy(this.basePos).add(new THREE.Vector3((Math.random() - 0.5) * 3, 0, (Math.random() - 0.5) * 3));
            this.patrolTarget = this.patrolB;
            this.wanderTarget.copy(this.basePos);
            this.nextWanderTime = 0;
            this.wasSliding = false;
          }

          var mode = this.data.mode;
          var speed = this.data.speed;

          if (mode === 'chase' && this.rig) {
            var playerPos = this.rig.object3D.position;
            var toPlayer = this.scratch.set(playerPos.x - pos.x, 0, playerPos.z - pos.z);
            var dist = toPlayer.length();
            if (dist > 0.7) {
              toPlayer.normalize();
              pos.x += toPlayer.x * speed * dt;
              pos.z += toPlayer.z * speed * dt;
            }
          } else if (mode === 'patrol') {
            var toTarget = this.scratch.set(this.patrolTarget.x - pos.x, 0, this.patrolTarget.z - pos.z);
            if (toTarget.length() < 0.15) {
              this.patrolTarget = this.patrolTarget === this.patrolA ? this.patrolB : this.patrolA;
            } else {
              toTarget.normalize();
              pos.x += toTarget.x * speed * dt;
              pos.z += toTarget.z * speed * dt;
            }
          } else if (mode === 'wander') {
            if (time > this.nextWanderTime) {
              this.wanderTarget.set(
                this.basePos.x + (Math.random() - 0.5) * 3,
                0,
                this.basePos.z + (Math.random() - 0.5) * 3
              );
              this.nextWanderTime = time + 1500 + Math.random() * 2000;
            }
            var toWander = this.scratch.set(this.wanderTarget.x - pos.x, 0, this.wanderTarget.z - pos.z);
            if (toWander.length() > 0.1) {
              toWander.normalize();
              pos.x += toWander.x * speed * dt;
              pos.z += toWander.z * speed * dt;
            }
          }
          // 'idle' (or anything unrecognized): stand still.
        },
      });

      // Minimum time (ms) between two hits registering on the same cube.
      // Without this, a single swing that dwells in a cube's hit radius
      // for more than one frame (punch-game's checkHand runs every tick,
      // ~90Hz in VR) would apply damage many times over for what's
      // physically one punch.
      var HIT_COOLDOWN_MS = 220;

      // ==============================================================
      // COMPONENT: punch-target
      // Attached to each cube-person's container entity (see
      // punch-game.spawnCube — the actual head/torso/legs meshes are
      // children listed in `this.el.bodyParts`, since the container
      // itself carries no geometry/material of its own). Cubes have
      // health instead of popping in one hit — hit() applies damage (see
      // punch-game.checkHand, which computes it via punch-locomotion
      // .computeMagnitude, the exact same formula used for how far a
      // punch lunges the player) and desaturates every body part's color
      // toward gray in proportion to remaining health, so the color
      // visibly drains out as it takes damage rather than showing a
      // separate health bar. It dies (pop()) once health reaches zero.
      // ==============================================================
      AFRAME.registerComponent('punch-target', {
        schema: {
          maxHealth: { type: 'number', default: 100 },
          color: { type: 'color', default: '#FFFFFF' },
        },

        init: function () {
          this.health = this.data.maxHealth;
          this.popped = false;
          this.hitCooldownUntil = 0;
          this.flinchTimeout = null;

          // THREE.Color's HSL conversion is what drives desaturation:
          // keep the cube's original hue/lightness, scale saturation
          // down toward 0 (gray) as health drops toward 0. Sourced from
          // the schema (not read off the entity's own material) since
          // this container has no material of its own — see bodyParts.
          this.baseColor = new THREE.Color(this.data.color);
          this.baseHsl = {};
          this.baseColor.getHSL(this.baseHsl);
          this.displayColor = new THREE.Color();

          this.onClick = this.onClick.bind(this);
          this.el.addEventListener('click', this.onClick);
        },

        // The visible meshes to recolor for a damage/flinch/pop flash —
        // punch-game.spawnCube sets `el.bodyParts` to [legs, torso, head].
        // Falls back to the entity itself so this component still works
        // if ever attached to a plain single-mesh entity (e.g. in tests).
        parts: function () {
          return this.el.bodyParts || [this.el];
        },

        onClick: function () {
          // Desktop/phone fallback: an instant kill on click, matching
          // the original one-hit-pops-it convenience for sanity-testing
          // the spawn/pop/respawn loop without a headset.
          this.hit(new THREE.Vector3(0, 0.4, -1), this.data.maxHealth);
        },

        // damage is in the same units as punch-locomotion's lunge
        // magnitude (see computeMagnitude) — a light tap barely dents
        // health, a big committed swing takes a real chunk out. playerPos
        // (world-space) is used to knock the target *away from the
        // player* rather than in whatever direction the hand happened to
        // be instantaneously moving — see applyPhysicalKnockback. Omit
        // it (e.g. from a cube-on-cube collision) to fall back to a
        // plain hitVelocity-direction push.
        hit: function (hitVelocity, damage, playerPos) {
          if (this.popped) return;
          var now = Date.now();
          if (now < this.hitCooldownUntil) return;
          this.hitCooldownUntil = now + HIT_COOLDOWN_MS;

          var lethal = this.applyDamage(damage, hitVelocity);
          if (!lethal) {
            // Real physical knockback only on a non-lethal hit — pop()
            // removes cube-behavior immediately for a dying cube and
            // plays its own separate death-knockback animation, so there
            // would be nothing left to apply this to (and nothing to see
            // if there were).
            this.applyPhysicalKnockback(hitVelocity, damage, playerPos);
          }
        },

        // Impact damage from slamming into a hard surface (floor or
        // wall — see cube-behavior's room-bounds clamp and floor-landing
        // logic), proportional to how much speed the surface just
        // absorbed. Shares hit()'s cooldown (so a bouncy landing can't
        // machine-gun several impact ticks) but deliberately does NOT
        // call applyPhysicalKnockback: the cube's velocity was just
        // forcibly zeroed by the surface, so launching it again from
        // taking that damage would start an unstoppable little bounce.
        takeImpactDamage: function (damage) {
          if (this.popped || damage <= 0) return;
          var now = Date.now();
          if (now < this.hitCooldownUntil) return;
          this.hitCooldownUntil = now + HIT_COOLDOWN_MS;
          this.applyDamage(damage, null);
        },

        // Shared by hit() and takeImpactDamage(): reduces health,
        // updates color, splatters the floor, and either pops (dead) or
        // flinches (still alive). Returns true if this damage was
        // lethal. popDirHint is used only for pop()'s own death-
        // knockback animation direction — takeImpactDamage has no
        // meaningful "hit direction" to offer, so pop() falls back to a
        // generic one when it's null.
        applyDamage: function (damage, popDirHint) {
          this.health = clamp(this.health - damage, 0, this.data.maxHealth);
          this.updateColor();
          this.splatFloor(damage);

          if (this.health <= 0) {
            this.pop(popDirHint);
            return true;
          }
          this.flinch();
          return false;
        },

        // Launches this cube via cube-behavior's knockback physics.
        // Primarily "straight away from the player" rather than a raw
        // reflection of the hand's instantaneous velocity direction
        // (which can be pretty wobbly mid-swing) — angled only a little
        // by the actual swing direction (KNOCKBACK_ANGLE_BLEND) — with
        // the swing's vertical component contributing partial credit
        // (KNOCKBACK_VERTICAL_FACTOR) as a launch/slam: "if there's
        // upwards force, send them a little airborne," and a downward
        // swing adds a little downward velocity too, which — on an
        // already-grounded target — immediately feeds the impact-damage
        // system above (cube-behavior lands it again right away).
        // Overall speed scales with hit force (`damage`, via
        // cubeKnockbackFactor — a menu knob in the SPLAT tab),
        // deliberately much gentler than the player's own lunge speed.
        // playerPos is optional: omit it (e.g. a cube-on-cube collision,
        // where "away from the other cube" is already what hitVelocity's
        // direction represents) to skip the away-blend and use
        // hitVelocity's own horizontal direction directly.
        applyPhysicalKnockback: function (hitVelocity, damage, playerPos) {
          var behavior = this.el.components['cube-behavior'];
          if (!behavior) return;

          var hitDir = hitVelocity.clone();
          var hitLenSq = hitDir.lengthSq();
          var verticalComponent = 0;
          var hitHorizontal = new THREE.Vector3();
          if (hitLenSq > 0.0001) {
            var hitNorm = hitDir.clone().normalize();
            verticalComponent = hitNorm.y;
            hitHorizontal.set(hitNorm.x, 0, hitNorm.z);
            if (hitHorizontal.lengthSq() > 0.0001) hitHorizontal.normalize();
          }

          var horizontalDir;
          if (playerPos) {
            var cubePos = new THREE.Vector3();
            this.el.object3D.getWorldPosition(cubePos);
            var awayDir = new THREE.Vector3(cubePos.x - playerPos.x, 0, cubePos.z - playerPos.z);
            if (awayDir.lengthSq() < 0.0001) awayDir.copy(hitHorizontal.lengthSq() > 0.0001 ? hitHorizontal : new THREE.Vector3(0, 0, -1));
            else awayDir.normalize();

            if (hitHorizontal.lengthSq() > 0.0001) {
              horizontalDir = awayDir
                .clone()
                .multiplyScalar(1 - KNOCKBACK_ANGLE_BLEND)
                .addScaledVector(hitHorizontal, KNOCKBACK_ANGLE_BLEND);
              if (horizontalDir.lengthSq() < 0.0001) horizontalDir.copy(awayDir);
              else horizontalDir.normalize();
            } else {
              horizontalDir = awayDir;
            }
          } else if (hitHorizontal.lengthSq() > 0.0001) {
            horizontalDir = hitHorizontal;
          } else {
            return; // no usable direction at all (shouldn't normally happen)
          }

          var finalDir = new THREE.Vector3(horizontalDir.x, verticalComponent * KNOCKBACK_VERTICAL_FACTOR, horizontalDir.z);
          if (finalDir.lengthSq() < 0.0001) return;
          finalDir.normalize();

          var speed = clamp(damage * cubeKnockbackFactor, 0, CUBE_KNOCKBACK_MAX_SPEED);
          behavior.applyKnockback(finalDir, speed);
        },

        // Splatters this cube's original (undamaged) color onto the
        // floor beneath it — a small blob per ordinary hit, a bigger
        // scattered burst on the killing blow.
        splatFloor: function (damage) {
          var worldPos = new THREE.Vector3();
          this.el.object3D.getWorldPosition(worldPos);
          var colorHex = '#' + this.baseColor.getHexString();

          if (this.health <= 0) {
            paintSplatBurst(worldPos.x, worldPos.z, colorHex);
          } else {
            var sizeFactor = clamp(damage / this.data.maxHealth, 0.15, 1);
            paintSplat(worldPos.x, worldPos.z, colorHex, SPLAT_BASE_RADIUS * (0.5 + sizeFactor), SPLAT_BASE_OPACITY);
          }
        },

        updateColor: function () {
          var healthFrac = this.health / this.data.maxHealth;
          this.displayColor.setHSL(this.baseHsl.h, this.baseHsl.s * healthFrac, this.baseHsl.l);
          var hex = '#' + this.displayColor.getHexString();
          var parts = this.parts();
          for (var i = 0; i < parts.length; i++) parts[i].setAttribute('material', 'color', hex);
        },

        // Non-lethal hit feedback: a quick bright flash + scale pulse,
        // then settle back into the new (more desaturated) color. Scale
        // rather than position for the pulse — cube-behavior sets this
        // entity's position every single frame, so a position-based
        // knockback here would just get overwritten immediately, same
        // reason pop() below has to remove cube-behavior first (there,
        // the cube really is being removed, so that's fine to do).
        flinch: function () {
          var parts = this.parts();
          for (var i = 0; i < parts.length; i++) parts[i].setAttribute('material', 'color', '#FFFFFF');
          this.el.setAttribute('animation__flinch', {
            property: 'scale',
            from: '1.15 1.15 1.15',
            to: '1 1 1',
            dur: 120,
            easing: 'easeOutQuad',
          });

          clearTimeout(this.flinchTimeout);
          var self = this;
          this.flinchTimeout = setTimeout(function () {
            self.updateColor();
          }, 60);
        },

        pop: function (hitVelocity) {
          if (this.popped) return;
          this.popped = true;
          clearTimeout(this.flinchTimeout);

          // Stop cube-behavior from continuing to drive this entity's
          // position — otherwise it fights the knockback/shrink
          // animation below for control of the same transform every
          // frame for the ~150ms it takes to play out.
          this.el.removeAttribute('cube-behavior');

          var parts = this.parts();
          for (var i = 0; i < parts.length; i++) parts[i].setAttribute('material', 'color', '#FFFFFF');

          var dir = hitVelocity ? hitVelocity.clone().normalize() : new THREE.Vector3(0, 0.4, -1).normalize();
          if (!isFinite(dir.x)) dir.set(0, 0.4, -1).normalize();
          var p = this.el.object3D.position;
          this.el.setAttribute('animation__knockback', {
            property: 'position',
            to: p.x + dir.x * 0.6 + ' ' + (p.y + dir.y * 0.6) + ' ' + (p.z + dir.z * 0.6),
            dur: 150,
            easing: 'easeOutQuad',
          });
          this.el.setAttribute('animation__shrink', {
            property: 'scale',
            to: '0.001 0.001 0.001',
            dur: 150,
            easing: 'easeInBack',
          });

          var el = this.el;
          setTimeout(function () {
            el.emit('cube-popped', {}, true);
            if (el.parentNode) el.parentNode.removeChild(el);
          }, 150);
        },

        remove: function () {
          this.el.removeEventListener('click', this.onClick);
          clearTimeout(this.flinchTimeout);
        },
      });

      // ==============================================================
      // COMPONENT: laser-beam
      // Attached to a `.menu-laser` box (a child of a hand entity that
      // also carries the raycaster it's visualizing). Every frame, reads
      // that raycaster's current intersection and stretches/repositions
      // the box so it stops exactly at whatever it's pointing at —
      // scale.z + position.z rather than rebuilding the geometry, since
      // this runs every frame the whole time the menu is open. A
      // fixed-length beam used to pass visibly through the menu panel it
      // had just clicked, which reads as "did that actually register?"
      // even though it did.
      // ==============================================================
      AFRAME.registerComponent('laser-beam', {
        schema: { maxLength: { type: 'number', default: 3 } },

        init: function () {
          this.raycasterEl = this.el.parentEl;
        },

        tick: function () {
          var raycaster = this.raycasterEl.components.raycaster;
          if (!raycaster || !raycaster.data.enabled) return;

          var length = this.data.maxLength;
          if (raycaster.intersections && raycaster.intersections.length) {
            length = Math.min(raycaster.intersections[0].distance, this.data.maxLength);
          }
          length = Math.max(length, 0.01);

          this.el.object3D.scale.z = length;
          this.el.object3D.position.z = -length / 2;
        },
      });

      // ==============================================================
      // COMPONENT: punch-game
      // Game manager. Keeps `count` cubes live at all times, checks both
      // hands against every cube every frame for a force-based hit, and
      // tracks the running popped total. Reset is bound to either
      // controller's physical trigger button (triggerdown) rather than a
      // raycast target, since there are no laser pointers in this scene
      // outside the menu.
      // ==============================================================
      AFRAME.registerComponent('punch-game', {
        schema: {
          count: { type: 'number', default: 6 },
          hitRadius: { type: 'number', default: 0.35 },
          popForceSpeed: { type: 'number', default: 1.0 },
          behaviorMode: { type: 'string', default: 'mixed' },
          // Lowered from an earlier 100: playtesting found that a
          // realistic, *sustainable* punch (not an all-out haymaker —
          // this is controlled physically, and nobody can throw maximum-
          // effort punches indefinitely) was only doing a small fraction
          // of a 100-health bar per hit, so killing one dummy took far
          // more punches than felt good. At 50, a solid moderate hit
          // takes a visible chunk out and a real committed swing (or one
          // solid follow-up impact into a wall/floor) can drop one in a
          // couple of hits — still not a single tap, but reads as "I am
          // actually damaging this thing" rather than a slog.
          cubeHealth: { type: 'number', default: 50 },
        },

        init: function () {
          this.hud = document.querySelector('#hud-text');
          this.leftHand = document.querySelector('#leftHand');
          this.rightHand = document.querySelector('#rightHand');
          this.rig = document.querySelector('#rig');
          this.cubes = [];
          this.colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#7B2CBF'];
          this.scratch = new THREE.Vector3();
          this.collisionPosA = new THREE.Vector3();
          this.collisionPosB = new THREE.Vector3();
          this.collisionDir = new THREE.Vector3();

          // Keyed by "smallerCubeId|largerCubeId" -> timestamp the pair
          // is allowed to hit each other again. Without this, a cube
          // slid into a neighbor would keep re-triggering damage+
          // knockback every frame the two stay in contact, which reads
          // as (and is) an infinite damage loop between them.
          this.pairCooldowns = {};
          this.nextCubeId = 1;

          this.reset = this.reset.bind(this);
          this.onTriggerReset = this.onTriggerReset.bind(this);
          this.onCubePopped = this.onCubePopped.bind(this);
          this.el.addEventListener('cube-popped', this.onCubePopped);

          // Physical trigger pull resets, on either hand — a direct
          // button event, not a raycast hit. Gated on menuOpen (see
          // onTriggerReset) since while the menu is open, the trigger is
          // instead doing menu-click duty via the hand raycaster+cursor
          // — without that gate, clicking a menu button would also
          // reset the arena on the same trigger pull. (The menu also has
          // its own explicit "Reset Arena" button.)
          if (this.leftHand) this.leftHand.addEventListener('triggerdown', this.onTriggerReset);
          if (this.rightHand) this.rightHand.addEventListener('triggerdown', this.onTriggerReset);
          document.querySelector('#reset-button-html').addEventListener('click', this.reset);

          this.reset();
        },

        onTriggerReset: function () {
          if (menuOpen) return;
          this.reset();
        },

        reset: function () {
          for (var i = 0; i < this.cubes.length; i++) {
            if (this.cubes[i].parentNode) this.cubes[i].parentNode.removeChild(this.cubes[i]);
          }
          this.cubes = [];
          this.popped = 0;
          this.pairCooldowns = {};
          this.updateHud();
          clearSplatCanvas();

          var locomotion = this.rig.components['punch-locomotion'];
          if (locomotion) locomotion.resetPosition();

          for (var c = 0; c < this.data.count; c++) this.spawnCube(c);
        },

        // Builds a simple humanoid "cube person" — legs/torso/head boxes
        // stacked on a container entity whose own position is the
        // character's feet/ground-contact point (y=0 at rest). Not
        // meant to be much (a real skeleton/model + ragdoll physics is a
        // future step) — just enough that these read as combatants
        // rather than floating balloons, and enough that a punch at any
        // height (low jab, chest-level cross, high hook) can actually
        // connect with *something* on the body. punch-target has no
        // material of its own to recolor as damage accumulates, since
        // the container carries no geometry — see el.bodyParts below.
        spawnCube: function (colorSeed) {
          // Wide spread of distance so hitting the field naturally calls
          // for a mix of jabs and lunges. No height randomization any
          // more — cube-people always stand on the floor.
          var angle = (Math.random() - 0.5) * 1.8; // radians
          var radius = 0.9 + Math.random() * 2.1; // 0.9m jab .. 3m lunge
          var x = radius * Math.sin(angle);
          var z = -radius * Math.cos(angle);

          var colorHex = this.colors[colorSeed % this.colors.length];

          var cube = document.createElement('a-entity');
          cube.setAttribute('position', { x: x, y: 0, z: z });
          cube.classList.add('cube-target');

          var legs = document.createElement('a-box');
          legs.setAttribute('width', 0.3);
          legs.setAttribute('height', 0.65);
          legs.setAttribute('depth', 0.22);
          legs.setAttribute('position', '0 0.325 0');
          legs.setAttribute('material', { color: colorHex });
          legs.classList.add('cube-target');
          cube.appendChild(legs);

          var torso = document.createElement('a-box');
          torso.setAttribute('width', 0.4);
          torso.setAttribute('height', 0.55);
          torso.setAttribute('depth', 0.26);
          torso.setAttribute('position', '0 0.925 0');
          torso.setAttribute('material', { color: colorHex });
          torso.classList.add('cube-target');
          cube.appendChild(torso);

          var head = document.createElement('a-box');
          head.setAttribute('width', 0.24);
          head.setAttribute('height', 0.26);
          head.setAttribute('depth', 0.24);
          head.setAttribute('position', '0 1.33 0');
          head.setAttribute('material', { color: colorHex });
          head.classList.add('cube-target');
          cube.appendChild(head);

          // Plain JS property (not an AFRAME attribute) — read by
          // punch-target for which meshes to recolor, and by
          // punch-game.checkHand for per-part hit-radius checks. Not
          // reactive/observed by A-Frame, which is fine: it's set once
          // here and never needs to change afterward.
          cube.bodyParts = [legs, torso, head];

          cube.setAttribute('punch-target', { maxHealth: this.data.cubeHealth, color: colorHex });
          cube.cubeId = this.nextCubeId++;

          var mode = this.data.behaviorMode;
          if (mode === 'mixed') {
            mode = CUBE_BEHAVIOR_MODES[Math.floor(Math.random() * CUBE_BEHAVIOR_MODES.length)];
          }
          cube.setAttribute('cube-behavior', {
            mode: mode,
            speed: 0.4 + Math.random() * 0.5,
          });

          this.el.appendChild(cube);
          this.cubes.push(cube);
        },

        tick: function () {
          if (menuOpen) return; // punching (including cube-popping) is disabled while the menu is open
          this.checkHand(this.leftHand);
          this.checkHand(this.rightHand);
          this.checkCubeCollisions();
        },

        // A cube that's currently sliding from its own knockback (fast
        // enough to matter) checked against every other live cube: close
        // enough, and not on cooldown with that specific cube, transfers
        // some damage and velocity to it — punching one cube into
        // another should hurt both. O(n^2) over the live cube list, which
        // tops out at 14 (menu's Cube Count max), so this is cheap.
        checkCubeCollisions: function () {
          var now = Date.now();
          for (var i = 0; i < this.cubes.length; i++) {
            var cubeA = this.cubes[i];
            var targetA = cubeA.components['punch-target'];
            var behaviorA = cubeA.components['cube-behavior'];
            if (!targetA || targetA.popped || !behaviorA) continue;

            var speedA = behaviorA.knockbackVel.length();
            if (speedA < CUBE_COLLISION_MIN_SPEED) continue;

            cubeA.object3D.getWorldPosition(this.collisionPosA);

            for (var j = 0; j < this.cubes.length; j++) {
              if (i === j) continue;
              var cubeB = this.cubes[j];
              var targetB = cubeB.components['punch-target'];
              if (!targetB || targetB.popped) continue;

              cubeB.object3D.getWorldPosition(this.collisionPosB);
              if (this.collisionPosA.distanceTo(this.collisionPosB) > CUBE_COLLISION_RADIUS) continue;

              var key = cubeA.cubeId < cubeB.cubeId ? cubeA.cubeId + '|' + cubeB.cubeId : cubeB.cubeId + '|' + cubeA.cubeId;
              if (this.pairCooldowns[key] && now < this.pairCooldowns[key]) continue;
              this.pairCooldowns[key] = now + CUBE_COLLISION_COOLDOWN_MS;

              this.collisionDir.subVectors(this.collisionPosB, this.collisionPosA);
              if (this.collisionDir.lengthSq() < 0.0001) {
                this.collisionDir.set(Math.random() - 0.5, 0.2, Math.random() - 0.5);
              }
              this.collisionDir.normalize();

              var damage = speedA * CUBE_COLLISION_DAMAGE_PER_SPEED;
              targetB.hit(this.collisionDir, damage);

              var behaviorB = cubeB.components['cube-behavior'];
              if (behaviorB) behaviorB.applyKnockback(this.collisionDir, speedA * CUBE_COLLISION_TRANSFER_FACTOR);
            }
          }
        },

        checkHand: function (handEl) {
          if (!handEl) return;
          var tracker = handEl.components['punch-tracker'];
          // Gate on the head-relative speed (tracker.speed), not raw —
          // otherwise spinning your body with a fist happening to sweep
          // past a nearby cube would register as a real hit.
          if (!tracker || !tracker.hasPrev || tracker.speed < this.data.popForceSpeed) return;

          // Same magnitude formula that decides how far a punch lunges
          // the player (computeMagnitude), but deliberately fed zero
          // hand/head travel distance — per Noah's explicit note, this
          // ambient/incidental contact path (any fist-near-enemy-while-
          // moving-fast-enough touch, whether or not it's part of a
          // deliberate punch/uppercut) should do plain velocity-based
          // damage only, never the "lunging" distance bonus a *deliberate*
          // triggered punch/uppercut gets (that bonus is applied
          // separately, in punch-locomotion.onPunch, using the full
          // completed swing's accumulated stats). Uses rawSpeed (not the
          // head-relative tracker.speed used for the gate above) so
          // damage still reflects true physical force once a hit is
          // confirmed real.
          var handDist = 0;
          var headDist = 0;
          // Looked up fresh here rather than cached in init() — a real
          // bug found via testing: punch-game's init() can run before
          // punch-locomotion's own init() has attached to #rig (a
          // cross-entity component-init race, not guaranteed order by
          // A-Frame), which silently left this.locomotion permanently
          // undefined and fell back to raw hand speed with none of the
          // formula's distance/power scaling for the entire session —
          // a likely large, invisible contributor to "it takes way too
          // many punches to kill one of these."
          var locomotion = this.rig.components['punch-locomotion'];
          var damage = locomotion
            ? locomotion.computeMagnitude(tracker.rawSpeed, handDist, headDist)
            : tracker.rawSpeed;

          var playerPos = this.rig.object3D.position;

          for (var i = this.cubes.length - 1; i >= 0; i--) {
            var cube = this.cubes[i];
            var target = cube.components['punch-target'];
            if (!target || target.popped) continue;

            // Check every body part independently (head/torso/legs) so
            // a punch at any height can connect with *something* on the
            // humanoid, rather than one hit-test against a single point.
            var parts = cube.bodyParts || [cube];
            for (var p = 0; p < parts.length; p++) {
              parts[p].object3D.getWorldPosition(this.scratch);
              if (tracker.worldPos.distanceTo(this.scratch) <= this.data.hitRadius) {
                target.hit(tracker.velocity, damage, playerPos);
                pulseHaptics(handEl, 0.6, 40);
                break; // one hit per cube per frame — hit()'s own cooldown would dedupe anyway, this just skips the redundant checks
              }
            }
          }
        },

        onCubePopped: function (evt) {
          this.popped++;
          this.updateHud();
          var idx = this.cubes.indexOf(evt.target);
          if (idx !== -1) this.cubes.splice(idx, 1);
          this.spawnCube(this.popped);
        },

        updateHud: function () {
          this.hud.setAttribute('text', 'value', 'Popped: ' + this.popped);
        },
      });

      // ==============================================================
      // REUSABLE: makeMenuButton / makeAdjustRow
      // Small VR-menu row builders, used by createTabbedPanel's tab
      // headers and by buildSettingsTabs' tab content alike. Both create
      // `.menu-target` clickable row(s) parented under the given entity,
      // and both re-derive their displayed label from a function (rather
      // than a fixed string) so the current value shows immediately
      // after every click without needing separate manual-refresh
      // bookkeeping in the caller.
      //
      // The optional trailing `refreshList` array, if given, gets this
      // row's refresh function pushed onto it, letting a caller force
      // every row in a panel to re-read its current value on demand (see
      // buildSettingsTabs / world-menu-system.open) — a defensive
      // measure in case a value ever changes by some path other than
      // this same panel's own buttons (e.g. the desktop overlay's Reset
      // button) while the menu is closed.
      //
      // Generic enough to copy-paste alongside createTabbedPanel into a
      // future prototype.
      // ==============================================================
      function makeMenuButton(parentEl, y, labelFn, onClick, refreshList, width) {
        var btn = document.createElement('a-entity');
        btn.setAttribute('geometry', { primitive: 'plane', width: width || 1.3, height: 0.18 });
        btn.setAttribute('material', { color: '#2a3350', shader: 'flat' });
        btn.setAttribute('position', { x: 0, y: y, z: 0.01 });
        btn.classList.add('menu-target');

        var text = document.createElement('a-text');
        text.setAttribute('align', 'center');
        text.setAttribute('color', '#FFFFFF');
        text.setAttribute('width', 2.2);
        text.setAttribute('position', '0 0 0.01');
        text.setAttribute('value', labelFn());
        btn.appendChild(text);

        var refresh = function () { text.setAttribute('value', labelFn()); };
        if (refreshList) refreshList.push(refresh);

        btn.addEventListener('click', function () {
          onClick();
          refresh();
        });
        parentEl.appendChild(btn);
      }

      function makeAdjustRow(parentEl, y, labelFn, onMinus, onPlus, refreshList) {
        var label = document.createElement('a-text');
        label.setAttribute('align', 'center');
        label.setAttribute('color', '#FFFFFF');
        label.setAttribute('width', 2.0);
        label.setAttribute('position', '0 ' + y + ' 0.01');
        label.setAttribute('value', labelFn());
        parentEl.appendChild(label);

        var refresh = function () { label.setAttribute('value', labelFn()); };
        if (refreshList) refreshList.push(refresh);

        function makeSmallButton(x, glyph, onClick) {
          var btn = document.createElement('a-entity');
          // Enlarged from an earlier 0.22x0.18 — playtesting found the
          // small adjust buttons much harder to reliably trigger-click
          // than the big menu buttons, which (once the cursor's click
          // binding was fixed to real triggerdown/up events, see the
          // hand entities' cursor config) points at natural hand tremor
          // during a trigger pull nudging the raycast off a small target
          // between press and release — a bigger target directly
          // compensates for that regardless of the click-binding fix.
          btn.setAttribute('geometry', { primitive: 'plane', width: 0.34, height: 0.26 });
          btn.setAttribute('material', { color: '#3a4468', shader: 'flat' });
          btn.setAttribute('position', { x: x, y: y, z: 0.01 });
          btn.classList.add('menu-target');

          var t = document.createElement('a-text');
          t.setAttribute('value', glyph);
          t.setAttribute('align', 'center');
          t.setAttribute('color', '#FFFFFF');
          t.setAttribute('width', 3);
          t.setAttribute('position', '0 0 0.01');
          btn.appendChild(t);

          btn.addEventListener('click', function () {
            onClick();
            refresh();
          });
          parentEl.appendChild(btn);
        }

        makeSmallButton(-0.78, '-', onMinus);
        makeSmallButton(0.78, '+', onPlus);
      }

      // ==============================================================
      // REUSABLE: createTabbedPanel
      // Builds a tab bar (evenly-spaced clickable headers) plus one
      // content container per tab inside `parentEl`, and shows/hides
      // content containers as tabs are clicked. Nothing about this is
      // specific to Punch Pop's settings — it only assumes `.menu-target`
      // is whatever class the caller's raycaster(s) are already filtering
      // on for clickable UI (see the gaze/hand raycaster `objects`
      // configs above). This project has no build step or shared module
      // system, so "reusable" here means "self-contained enough to
      // copy-paste into the next prototype that needs tabs" rather than
      // an import — grab this function and makeMenuButton/makeAdjustRow
      // above wholesale.
      //
      // tabs: [{ id, label }, ...]
      // Returns { getContent(id) -> <a-entity> to append that tab's rows
      // into, setActive(id) }.
      // ==============================================================
      function createTabbedPanel(parentEl, tabs, width, tabBarY) {
        var contentById = {};
        var headerById = {};

        function setActive(id) {
          for (var tabId in contentById) {
            contentById[tabId].setAttribute('visible', tabId === id);
            headerById[tabId].setAttribute('material', 'color', tabId === id ? '#3a4468' : '#182238');
          }
        }

        var tabWidth = width / tabs.length;
        tabs.forEach(function (tab, index) {
          var x = -width / 2 + tabWidth * (index + 0.5);

          var header = document.createElement('a-entity');
          header.setAttribute('geometry', { primitive: 'plane', width: tabWidth - 0.02, height: 0.16 });
          header.setAttribute('material', { color: '#182238', shader: 'flat' });
          header.setAttribute('position', { x: x, y: tabBarY, z: 0.01 });
          header.classList.add('menu-target');

          var label = document.createElement('a-text');
          label.setAttribute('value', tab.label);
          label.setAttribute('align', 'center');
          label.setAttribute('color', '#FFFFFF');
          label.setAttribute('width', 2.6);
          label.setAttribute('position', '0 0 0.01');
          header.appendChild(label);

          header.addEventListener('click', function () { setActive(tab.id); });
          parentEl.appendChild(header);
          headerById[tab.id] = header;

          var content = document.createElement('a-entity');
          parentEl.appendChild(content);
          contentById[tab.id] = content;
        });

        setActive(tabs[0] && tabs[0].id);

        return {
          getContent: function (id) { return contentById[id]; },
          setActive: setActive,
        };
      }

      // ==============================================================
      // Builds Punch Pop's actual settings content into a tabbed panel
      // (see buildWorldMenu below). `api` is a small object of getters
      // and actions (see world-menu-system.buildApi) so this function
      // doesn't need to know how settings are actually stored.
      // ==============================================================
      function buildSettingsTabs(panelEl, api) {
        var refreshFns = [];

        var panel = createTabbedPanel(
          panelEl,
          [
            { id: 'punch', label: 'PUNCH' },
            { id: 'foes', label: 'FOES' },
            { id: 'aim', label: 'AIM' },
            { id: 'reach', label: 'REACH' },
            { id: 'splat', label: 'SPLAT' },
            { id: 'feel', label: 'FEEL' },
            { id: 'debug', label: 'DEBUG' },
            { id: 'more', label: 'MORE' },
          ],
          2.8,
          0.86
        );

        var punchTab = panel.getContent('punch');
        makeAdjustRow(
          punchTab,
          0.5,
          function () { return 'Move Speed: ' + api.getPower().toFixed(1) + 'x'; },
          function () { api.setPower(api.getPower() - 0.5); },
          function () { api.setPower(api.getPower() + 0.5); },
          refreshFns
        );
        makeAdjustRow(
          punchTab,
          0.22,
          function () { return 'Gravity: ' + api.getGravity().toFixed(1); },
          function () { api.setGravity(api.getGravity() - 0.5); },
          function () { api.setGravity(api.getGravity() + 0.5); },
          refreshFns
        );
        makeAdjustRow(
          punchTab,
          -0.06,
          function () { return 'Max Speed: ' + api.getMaxSpeed().toFixed(0); },
          function () { api.setMaxSpeed(api.getMaxSpeed() - 1); },
          function () { api.setMaxSpeed(api.getMaxSpeed() + 1); },
          refreshFns
        );
        makeMenuButton(punchTab, -0.36, function () { return 'Reset Arena'; }, api.resetArena, refreshFns);

        var foesTab = panel.getContent('foes');
        makeAdjustRow(
          foesTab,
          0.5,
          function () { return 'Cube Count: ' + api.getCount(); },
          function () { api.setCount(api.getCount() - 1); },
          function () { api.setCount(api.getCount() + 1); },
          refreshFns
        );
        makeAdjustRow(
          foesTab,
          0.22,
          function () { return 'Cube Health: ' + api.getCubeHealth(); },
          function () { api.setCubeHealth(api.getCubeHealth() - 10); },
          function () { api.setCubeHealth(api.getCubeHealth() + 10); },
          refreshFns
        );
        makeMenuButton(
          foesTab,
          -0.06,
          function () { return 'Behavior: ' + api.getBehavior(); },
          api.cycleBehavior,
          refreshFns
        );

        // Lock-on targeting tuning: how tight a cone counts as "aimed
        // enough at a specific enemy" to lock onto it, the base search
        // radius for that lock-on (which also scales up a bit with how
        // committed the swing was — see punch-locomotion's onPunch), and
        // the sticky hit-assist mode that decides what happens once a
        // target IS locked (see hitAssistMode's top-of-file comment for
        // what each option actually does).
        var aimTab = panel.getContent('aim');
        makeAdjustRow(
          aimTab,
          0.5,
          function () { return 'Lock-On Cone: ' + api.getLockCone().toFixed(0) + 'deg'; },
          function () { api.setLockCone(api.getLockCone() - 5); },
          function () { api.setLockCone(api.getLockCone() + 5); },
          refreshFns
        );
        makeAdjustRow(
          aimTab,
          0.22,
          function () { return 'Lock Range: ' + api.getLockRange().toFixed(2) + 'm'; },
          function () { api.setLockRange(api.getLockRange() - 0.25); },
          function () { api.setLockRange(api.getLockRange() + 0.25); },
          refreshFns
        );
        // Descriptions alongside the mode name, not just the bare word --
        // "cheat"/"turn" don't explain themselves, and that was a real
        // discoverability problem: Noah found the option but couldn't
        // tell what switching it would actually do without asking.
        var HIT_ASSIST_LABELS = {
          off: 'off (real aim only)',
          cheat: 'cheat (auto-hit)',
          turn: 'turn (auto-hit+view)',
        };
        makeMenuButton(
          aimTab,
          -0.1,
          function () { return 'Hit Assist: ' + HIT_ASSIST_LABELS[api.getHitAssist()]; },
          api.cycleHitAssist,
          refreshFns,
          2.0 // wider than the default 1.3 -- these labels run longer than a bare mode name
        );

        // Reach calibration + the extension-fraction thresholds that
        // replaced the old velocity-threshold swing detector — see the
        // REACH CALIBRATION comment block near the top of this file for
        // the full rationale.
        var reachTab = panel.getContent('reach');
        makeMenuButton(
          reachTab,
          0.5,
          function () { return 'Calibrate Reach'; },
          api.calibrateReach,
          refreshFns
        );
        makeAdjustRow(
          reachTab,
          0.2,
          function () { return 'Reach Fwd: ' + api.getReachForward().toFixed(2) + 'm'; },
          function () { api.setReachForward(api.getReachForward() - 0.05); },
          function () { api.setReachForward(api.getReachForward() + 0.05); },
          refreshFns
        );
        makeAdjustRow(
          reachTab,
          -0.1,
          function () { return 'Reach Up: ' + api.getReachOverhead().toFixed(2) + 'm'; },
          function () { api.setReachOverhead(api.getReachOverhead() - 0.05); },
          function () { api.setReachOverhead(api.getReachOverhead() + 0.05); },
          refreshFns
        );
        makeAdjustRow(
          reachTab,
          -0.4,
          function () { return 'Arm Threshold: ' + Math.round(api.getArmThreshold() * 100) + '%'; },
          function () { api.setArmThreshold(api.getArmThreshold() - 0.05); },
          function () { api.setArmThreshold(api.getArmThreshold() + 0.05); },
          refreshFns
        );

        // Blood-splatter tuning, per playtesting feedback that the
        // default splatter read as sparse and tightly clustered right
        // under the cube. Splat Amount/Scatter scale the whole
        // paintSplat/paintSplatBurst pipeline (size, opacity, blob count,
        // spread); Knockback Force controls how hard a hit launches a
        // cube (see cube-behavior's applyKnockback) — which also
        // indirectly controls how much trail gets painted and how hard
        // cube-on-cube collisions hit, since both derive from a cube's
        // current slide speed.
        var splatTab = panel.getContent('splat');
        makeAdjustRow(
          splatTab,
          0.5,
          function () { return 'Splat Amount: ' + api.getSplatAmount().toFixed(2) + 'x'; },
          function () { api.setSplatAmount(api.getSplatAmount() - 0.5); },
          function () { api.setSplatAmount(api.getSplatAmount() + 0.5); },
          refreshFns
        );
        makeAdjustRow(
          splatTab,
          0.22,
          function () { return 'Splat Scatter: ' + api.getSplatScatter().toFixed(2) + 'x'; },
          function () { api.setSplatScatter(api.getSplatScatter() - 0.25); },
          function () { api.setSplatScatter(api.getSplatScatter() + 0.25); },
          refreshFns
        );
        makeAdjustRow(
          splatTab,
          -0.06,
          function () { return 'Knockback Force: ' + api.getKnockbackForce().toFixed(2); },
          function () { api.setKnockbackForce(api.getKnockbackForce() - 0.05); },
          function () { api.setKnockbackForce(api.getKnockbackForce() + 0.05); },
          refreshFns
        );
        makeMenuButton(
          splatTab,
          -0.36,
          function () { return 'Trail: ' + (api.getTrailEnabled() ? 'ON' : 'OFF'); },
          api.toggleTrail,
          refreshFns
        );

        // Comfort/gamefeel: the vignette (darkened screen edges during
        // fast movement, a standard VR motion-sickness mitigation) and
        // the "zoom" haptic buzz while moving fast. Both default on but
        // fully tunable — neither can really be judged from outside a
        // headset, and comfort tolerance is personal, so this is meant
        // to be dialed in live rather than guessed at from a screenshot.
        var feelTab = panel.getContent('feel');
        makeMenuButton(
          feelTab,
          0.62,
          function () { return 'Vignette: ' + (api.getVignetteEnabled() ? 'ON' : 'OFF'); },
          api.toggleVignetteEnabled,
          refreshFns
        );
        makeAdjustRow(
          feelTab,
          0.32,
          function () { return 'Vignette Strength: ' + Math.round(api.getVignetteStrength() * 100) + '%'; },
          function () { api.setVignetteStrength(api.getVignetteStrength() - 0.1); },
          function () { api.setVignetteStrength(api.getVignetteStrength() + 0.1); },
          refreshFns
        );
        makeAdjustRow(
          feelTab,
          0.02,
          function () { return 'Vignette Size: ' + Math.round(api.getVignetteSize() * 100) + '%'; },
          function () { api.setVignetteSize(api.getVignetteSize() - 0.1); },
          function () { api.setVignetteSize(api.getVignetteSize() + 0.1); },
          refreshFns
        );
        makeMenuButton(
          feelTab,
          -0.3,
          function () { return 'Zoom Buzz: ' + (api.getBuzzEnabled() ? 'ON' : 'OFF'); },
          api.toggleBuzzEnabled,
          refreshFns
        );
        makeAdjustRow(
          feelTab,
          -0.6,
          function () { return 'Buzz Strength: ' + Math.round(api.getBuzzStrength() * 100) + '%'; },
          function () { api.setBuzzStrength(api.getBuzzStrength() - 0.1); },
          function () { api.setBuzzStrength(api.getBuzzStrength() + 0.1); },
          refreshFns
        );

        // Punch-detection transparency + tuning: the stop-speed
        // threshold punch-tracker's extension state machine reads every
        // frame (see stopSpeed's schema comment), the head-relative
        // "Turn Filter" that guards that stop check against body-turn
        // velocity noise, and a toggle for a continuously-live readout
        // of the underlying numbers rather than just a post-punch
        // snapshot.
        var debugTab = panel.getContent('debug');
        makeMenuButton(
          debugTab,
          0.5,
          function () { return 'Live Debug HUD: ' + (api.getLiveDebug() ? 'ON' : 'OFF'); },
          api.toggleLiveDebug,
          refreshFns
        );
        makeAdjustRow(
          debugTab,
          0.2,
          function () { return 'Stop Spd: ' + api.getStopSpeed().toFixed(2); },
          function () { api.setStopSpeed(api.getStopSpeed() - 0.05); },
          function () { api.setStopSpeed(api.getStopSpeed() + 0.05); },
          refreshFns
        );
        makeAdjustRow(
          debugTab,
          -0.1,
          function () { return 'Turn Filter: ' + Math.round(api.getTurnFilter() * 100) + '%'; },
          function () { api.setTurnFilter(api.getTurnFilter() - 0.1); },
          function () { api.setTurnFilter(api.getTurnFilter() + 0.1); },
          refreshFns
        );

        var moreTab = panel.getContent('more');
        makeMenuButton(moreTab, 0.4, function () { return 'Resume'; }, api.resume, refreshFns);
        makeMenuButton(moreTab, 0.1, function () { return 'Exit VR'; }, api.exitVR, refreshFns);
        makeMenuButton(
          moreTab,
          -0.2,
          function () { return 'Show Stats: ' + (api.getShowStats() ? 'ON' : 'OFF'); },
          api.toggleShowStats,
          refreshFns
        );

        // Called by world-menu-system right before showing the panel, so
        // a value that somehow changed while the menu was closed is
        // never stale the moment it's opened again.
        panelEl.refreshLabels = function () {
          refreshFns.forEach(function (fn) { fn(); });
        };
      }

      // Background + the tabbed settings content for the world-fixed
      // menu panel.
      function buildWorldMenu(panelEl, api) {
        var bg = document.createElement('a-plane');
        bg.setAttribute('width', 2.9);
        bg.setAttribute('height', 1.9);
        bg.setAttribute('material', 'color: #0d1526; opacity: 0.95; shader: flat; side: double');
        panelEl.appendChild(bg);
        buildSettingsTabs(panelEl, api);
      }

      // How far in front of the player (meters) the menu spawns when
      // opened, and roughly how large it reads there — see the #world-menu
      // entity's scale attribute for the actual size. Both are first
      // guesses at a "couple feet, but noticeably bigger than before"
      // panel; easy to retune here if it reads too close/far or too
      // big/small once tried in a headset.
      var MENU_SPAWN_DISTANCE = 0.9;

      // ==============================================================
      // COMPONENT: world-menu-system
      // Replaces an earlier per-wrist "watch menu" design: instead of a
      // small panel mounted on the hand (hard to aim at, and ran out of
      // room once there were several tabs of settings), there's one
      // bigger panel fixed in world space. Pressing either controller's
      // grip toggles it open/closed; when it opens, it's freshly
      // repositioned a couple feet in front of wherever the player is
      // currently standing and facing, oriented back toward them — see
      // positionInFrontOfPlayer. The hand that did *not* press grip gets
      // a laser pointer to click it with.
      //
      // Only one hand ever has an active raycaster at a time — a real
      // interaction bug in an earlier design let a trigger pull on the
      // hand you weren't looking at register a click aimed by that hand
      // instead. Toggle-on-grip-press also means neither hand has to
      // stay physically holding a button down for however long you're
      // digging through tabs, unlike the previous hold-to-show design
      // (reasonable for a quick wrist glance, less so for a bigger menu
      // you might spend a while in).
      //
      // While open: punching is disabled and rig physics freeze (both
      // gated on the shared `menuOpen` flag, checked by punch-locomotion
      // and punch-game), and the trigger's normal quick-reset job is
      // suspended so clicking a menu button doesn't also reset the arena.
      // ==============================================================
      AFRAME.registerComponent('world-menu-system', {
        init: function () {
          this.build = this.build.bind(this);
          // Deferred to scene "loaded" for the same reason earlier
          // menu-system revisions had to be: this entity can end up
          // initializing before sibling entities elsewhere in the
          // markup exist yet, and this component needs several of them
          // (#cube-manager in particular) up front.
          var sceneEl = this.el.sceneEl;
          if (sceneEl.hasLoaded) this.build();
          else sceneEl.addEventListener('loaded', this.build, { once: true });
        },

        build: function () {
          this.rig = document.querySelector('#rig');
          this.head = document.querySelector('#head');
          this.gameEl = document.querySelector('#cube-manager');
          this.cursorEl = document.querySelector('#gaze-cursor');
          this.leftHand = document.querySelector('#leftHand');
          this.rightHand = document.querySelector('#rightHand');
          this.panel = document.querySelector('#world-menu');
          this.isOpen = false;
          this.laserHand = null;

          // The always-on debug line, the punch-result label, the
          // opt-in stats/live-debug HUDs, and the comfort vignette all
          // sit fixed in front of the camera — with the world-fixed menu
          // panel spawning nearby, they visually compete with (and can
          // occlude/clutter) menu buttons. Hidden while the menu is
          // open; restored to whatever they were showing (which may
          // itself be "hidden", for the opt-in ones) on close. The
          // vignette specifically would otherwise freeze at whatever
          // opacity it had the instant the menu opened — punch-locomotion
          // .tick() stops updating it while menuOpen, same as it stops
          // moving the rig — so without this it could sit there dimming
          // the panel's edges for as long as the menu stayed open.
          this.overlayEls = [
            document.querySelector('#hud-text'),
            document.querySelector('#debug-text'),
            document.querySelector('#stats-text'),
            document.querySelector('#live-debug-text'),
            document.querySelector('#punch-label'),
            document.querySelector('#vignette'),
          ];

          var api = this.buildApi();
          buildWorldMenu(this.panel, api);

          // Face buttons open/close the menu — grip used to, but got
          // pressed by accident too often during normal punching/
          // clenching. Bound on both hands' A/B (right) and X/Y (left)
          // buttons so either hand can toggle it, same as grip did.
          this.onMenuButton = this.onMenuButton.bind(this);
          this.leftHand.addEventListener('xbuttondown', this.onMenuButton);
          this.leftHand.addEventListener('ybuttondown', this.onMenuButton);
          this.rightHand.addEventListener('abuttondown', this.onMenuButton);
          this.rightHand.addEventListener('bbuttondown', this.onMenuButton);

          // Desktop/phone has no controller buttons, so the overlay's
          // "Menu" button toggles it instead, using the gaze reticle
          // (widened below) as its pointer.
          this.toggleDesktop = this.toggleDesktop.bind(this);
          document.querySelector('#menu-button-html').addEventListener('click', this.toggleDesktop);
          this.onSemanticInput = this.onSemanticInput.bind(this);
          this.el.sceneEl.addEventListener('semantic-action-intent', this.onSemanticInput);
        },

        onSemanticInput: function (evt) {
          if (!evt.detail || evt.detail.phase !== 'perform') return;
          if (evt.detail.action === 'menu') this.toggleDesktop();
          else if (evt.detail.action === 'back' && this.isOpen) this.close();
        },

        onMenuButton: function (evt) {
          if (this.isOpen) {
            this.close();
          } else {
            // Whichever hand's face button was pressed keeps punching;
            // the other hand gets the laser pointer.
            var pressedHand = evt.target;
            this.open(pressedHand === this.leftHand ? this.rightHand : this.leftHand);
          }
        },

        toggleDesktop: function () {
          if (this.isOpen) this.close();
          else this.open(null); // no real hand on desktop; the gaze reticle is what's actually used
        },

        open: function (laserHandEl) {
          this.isOpen = true;
          menuOpen = true;
          this.el.sceneEl.setAttribute('data-world-menu-open', 'true');
          this.laserHand = laserHandEl;

          this.positionInFrontOfPlayer();
          if (this.panel.refreshLabels) this.panel.refreshLabels();
          this.panel.setAttribute('visible', true);
          if (this.laserHand) this.setLaser(this.laserHand, true);
          if (this.cursorEl) this.cursorEl.setAttribute('raycaster', 'objects', '.cube-target, .menu-target');
          for (var i = 0; i < this.overlayEls.length; i++) {
            if (this.overlayEls[i]) this.overlayEls[i].setAttribute('visible', false);
          }
        },

        close: function () {
          this.isOpen = false;
          menuOpen = false;
          this.el.sceneEl.setAttribute('data-world-menu-open', 'false');

          this.panel.setAttribute('visible', false);
          if (this.laserHand) this.setLaser(this.laserHand, false);
          this.laserHand = null;
          if (this.cursorEl) this.cursorEl.setAttribute('raycaster', 'objects', '.cube-target');

          // hud-text and debug-text are always-on; punch-label re-shows
          // itself on the next punch regardless. stats-text/live-debug-
          // text are opt-in (Show Stats / Live Debug HUD) — only restore
          // those if their toggle is actually on, so closing the menu
          // doesn't un-hide a HUD the player had deliberately turned off.
          var statsText = document.querySelector('#stats-text');
          var liveDebugText = document.querySelector('#live-debug-text');
          if (document.querySelector('#hud-text')) document.querySelector('#hud-text').setAttribute('visible', true);
          if (document.querySelector('#debug-text')) document.querySelector('#debug-text').setAttribute('visible', true);
          if (statsText) statsText.setAttribute('visible', showStatsOn);
          if (liveDebugText) liveDebugText.setAttribute('visible', liveDebugOn);
        },

        // Spawns the panel roughly at eye height, MENU_SPAWN_DISTANCE in
        // front of wherever the player is currently standing and
        // facing (flattened to horizontal, so looking up/down when you
        // open it doesn't tilt the panel into the floor or ceiling),
        // then orients it to face back toward the player.
        positionInFrontOfPlayer: function () {
          var camPos = new THREE.Vector3();
          this.head.object3D.getWorldPosition(camPos);
          var camDir = new THREE.Vector3();
          getForwardDirection(this.head, camDir);
          camDir.y = 0;
          if (camDir.lengthSq() < 0.0001) camDir.set(0, 0, -1);
          camDir.normalize();

          var spawnPos = camPos.clone().addScaledVector(camDir, MENU_SPAWN_DISTANCE);
          this.panel.object3D.position.copy(spawnPos);
          // For a plain Object3D (this panel isn't a camera), lookAt
          // orients local +Z — this panel's front, per
          // createTabbedPanel/makeMenuButton's row geometry — toward the
          // given point. Aim it straight at the player's head position
          // so the front faces them directly.
          this.panel.object3D.lookAt(camPos);
        },

        setLaser: function (handEl, on) {
          handEl.setAttribute('raycaster', 'enabled', on);
          var laser = handEl.querySelector('.menu-laser');
          if (laser) laser.setAttribute('visible', on);
        },

        buildApi: function () {
          var self = this;
          return {
            getPower: function () { return self.rig.getAttribute('punch-locomotion').powerMultiplier; },
            setPower: function (v) {
              v = clamp(Math.round(v * 10) / 10, 0.4, 8.0);
              self.rig.setAttribute('punch-locomotion', 'powerMultiplier', v);
            },
            getGravity: function () { return self.rig.getAttribute('punch-locomotion').gravity; },
            setGravity: function (v) {
              v = clamp(Math.round(v * 10) / 10, 1, 12);
              self.rig.setAttribute('punch-locomotion', 'gravity', v);
            },
            getMaxSpeed: function () { return self.rig.getAttribute('punch-locomotion').maxSpeed; },
            setMaxSpeed: function (v) {
              v = clamp(Math.round(v), 3, 30);
              self.rig.setAttribute('punch-locomotion', 'maxSpeed', v);
            },
            getLockCone: function () { return self.rig.getAttribute('punch-locomotion').lockOnConeAngle; },
            setLockCone: function (v) {
              v = clamp(Math.round(v), 5, 90);
              self.rig.setAttribute('punch-locomotion', 'lockOnConeAngle', v);
            },
            getLockRange: function () { return self.rig.getAttribute('punch-locomotion').baseLockRange; },
            setLockRange: function (v) {
              v = clamp(Math.round(v * 100) / 100, 0, 5);
              self.rig.setAttribute('punch-locomotion', 'baseLockRange', v);
            },
            getCount: function () { return self.gameEl.getAttribute('punch-game').count; },
            setCount: function (v) {
              v = clamp(v, 2, 14);
              self.gameEl.setAttribute('punch-game', 'count', v);
              self.gameEl.components['punch-game'].reset();
            },
            getCubeHealth: function () { return self.gameEl.getAttribute('punch-game').cubeHealth; },
            setCubeHealth: function (v) {
              v = clamp(v, 15, 300);
              self.gameEl.setAttribute('punch-game', 'cubeHealth', v);
              self.gameEl.components['punch-game'].reset();
            },
            getBehavior: function () { return self.gameEl.getAttribute('punch-game').behaviorMode; },
            cycleBehavior: function () {
              var modes = ['mixed'].concat(CUBE_BEHAVIOR_MODES);
              var current = self.gameEl.getAttribute('punch-game').behaviorMode;
              var next = modes[(modes.indexOf(current) + 1) % modes.length];
              self.gameEl.setAttribute('punch-game', 'behaviorMode', next);
              self.gameEl.components['punch-game'].reset();
            },
            resetArena: function () { self.gameEl.components['punch-game'].reset(); },
            resume: function () { self.close(); },
            exitVR: function () {
              var sceneEl = self.el.sceneEl;
              if (sceneEl) sceneEl.exitVR();
            },
            getShowStats: function () { return showStatsOn; },
            toggleShowStats: function () {
              showStatsOn = !showStatsOn;
              var statsText = document.querySelector('#stats-text');
              if (statsText) statsText.setAttribute('visible', showStatsOn);
            },

            getSplatAmount: function () { return splatAmountMultiplier; },
            setSplatAmount: function (v) { splatAmountMultiplier = clamp(Math.round(v * 100) / 100, 0.25, 6); },
            getSplatScatter: function () { return splatScatterMultiplier; },
            setSplatScatter: function (v) { splatScatterMultiplier = clamp(Math.round(v * 100) / 100, 0.25, 4); },
            getKnockbackForce: function () { return cubeKnockbackFactor; },
            setKnockbackForce: function (v) { cubeKnockbackFactor = clamp(Math.round(v * 100) / 100, 0, 1); },
            getTrailEnabled: function () { return cubeTrailEnabled; },
            toggleTrail: function () { cubeTrailEnabled = !cubeTrailEnabled; },

            // Stop speed and the turn filter live on each hand's own
            // punch-tracker instance, not on punch-locomotion — both
            // hands are kept in sync by writing the same value to both
            // on every change, same as how the two hand entities already
            // mirror every other per-hand setting.
            getStopSpeed: function () { return self.leftHand.getAttribute('punch-tracker').stopSpeed; },
            setStopSpeed: function (v) {
              v = clamp(Math.round(v * 100) / 100, 0.05, 2);
              self.leftHand.setAttribute('punch-tracker', 'stopSpeed', v);
              self.rightHand.setAttribute('punch-tracker', 'stopSpeed', v);
            },
            getTurnFilter: function () { return self.leftHand.getAttribute('punch-tracker').headBlend; },
            setTurnFilter: function (v) {
              v = clamp(Math.round(v * 100) / 100, 0, 1);
              self.leftHand.setAttribute('punch-tracker', 'headBlend', v);
              self.rightHand.setAttribute('punch-tracker', 'headBlend', v);
            },
            getLiveDebug: function () { return liveDebugOn; },
            toggleLiveDebug: function () {
              liveDebugOn = !liveDebugOn;
              var el = document.querySelector('#live-debug-text');
              if (el) el.setAttribute('visible', liveDebugOn);
            },

            // Reach calibration + extension thresholds — reachForward/
            // reachOverhead/EXT_ARM_THRESHOLD are plain globals (like
            // splatAmountMultiplier etc. above), not per-entity schema,
            // since they're read directly by punch-tracker's shared
            // extension-fraction math for both hands at once.
            getReachForward: function () { return reachForward; },
            setReachForward: function (v) { reachForward = clamp(Math.round(v * 100) / 100, REACH_MIN, REACH_MAX); },
            getReachOverhead: function () { return reachOverhead; },
            setReachOverhead: function (v) { reachOverhead = clamp(Math.round(v * 100) / 100, REACH_MIN, REACH_MAX); },
            getArmThreshold: function () { return EXT_ARM_THRESHOLD; },
            setArmThreshold: function (v) { EXT_ARM_THRESHOLD = clamp(Math.round(v * 100) / 100, 0.1, 0.7); },
            // Closes the menu first so the player can actually see the
            // "reach forward" / "reach overhead" prompts and move their
            // arms freely — calibration would be pointless with the
            // panel still covering their view.
            calibrateReach: function () {
              self.close();
              var locomotion = self.rig.components['punch-locomotion'];
              if (locomotion) locomotion.startCalibration();
            },

            getHitAssist: function () { return hitAssistMode; },
            cycleHitAssist: function () {
              hitAssistMode = HIT_ASSIST_MODES[(HIT_ASSIST_MODES.indexOf(hitAssistMode) + 1) % HIT_ASSIST_MODES.length];
            },

            getVignetteEnabled: function () { return vignetteEnabled; },
            toggleVignetteEnabled: function () { vignetteEnabled = !vignetteEnabled; },
            getVignetteStrength: function () { return vignetteStrength; },
            setVignetteStrength: function (v) { vignetteStrength = clamp(Math.round(v * 100) / 100, 0, 2); },
            getVignetteSize: function () { return vignetteSize; },
            setVignetteSize: function (v) { vignetteSize = clamp(Math.round(v * 100) / 100, 0.6, 1.4); },
            getBuzzEnabled: function () { return buzzHapticsEnabled; },
            toggleBuzzEnabled: function () { buzzHapticsEnabled = !buzzHapticsEnabled; },
            getBuzzStrength: function () { return buzzHapticsStrength; },
            setBuzzStrength: function (v) { buzzHapticsStrength = clamp(Math.round(v * 100) / 100, 0, 2); },
          };
        },
      });

      // ==============================================================
      // Room textures
      // ==============================================================
      document.querySelector('a-scene').addEventListener('loaded', function () {
        applyCheckerTexture(document.querySelector('#floor'), '#3a4468', '#2c3454', 10, 10);
        var walls = document.querySelectorAll('.wall');
        for (var i = 0; i < walls.length; i++) {
          applyCheckerTexture(walls[i], '#2a3350', '#242c48', 10, 2);
        }
        attachSplatTexture(document.querySelector('#splat-layer'));
        applyVignetteTexture(document.querySelector('#vignette'));
      });

    </script>
  </body>
</html>
