<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Punch Pop — WebXR Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Same no-build-step A-Frame CDN pattern as Cube Pop. Pinned so this
         page doesn't shift under us on a future A-Frame release. -->
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        z-index: 1;
        font-size: 0.85rem;
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 0.75rem;
      }
      #overlay a {
        color: #9ad;
      }
      #overlay p {
        margin: 0;
        max-width: 42rem;
      }
      #debug-controls {
        display: flex;
        gap: 0.4rem;
        flex-wrap: wrap;
      }
      #debug-controls button {
        font-size: 0.8rem;
        padding: 0.3rem 0.6rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Flat HTML overlay: desktop/browser instructions only. Mouse input
         drives the shared hand entities through the real punch tracker. -->
    <div id="overlay">
      <p>
        Punch Pop — VR: punch naturally. Keyboard: WASD + mouse, hold/release clicks.
        Gamepad: sticks + triggers. Mobile: joystick, drag + punch buttons.
        <strong>Clear ~2x2m of real space before trying this in a headset.</strong>
        <a href="../../index.html">All prototypes</a>
      </p>
      <div id="debug-controls">
        <button id="menu-button-html">Menu</button>
        <button id="reset-button-html">Reset (desktop)</button>
      </div>
    </div>

    <a-scene>
      <!-- ============================================================
           ROOM
           A closed, human-scaled room (30x30m, 6m walls) instead of an
           empty plane + sky, so there's a static visual frame of
           reference around you as you fly across the arena — both for
           "this is a real place" presence and because a strong static
           background is one of the standard ways to counter vection-
           induced motion sickness during fast locomotion. Floor/walls
           get a checkerboard/grid texture painted onto a <canvas> at
           runtime (see applyCheckerTexture below) rather than an
           external image, so the room has zero extra network
           dependency beyond the A-Frame script itself.
      ============================================================ -->
      <a-entity id="room">
        <a-plane id="floor" rotation="-90 0 0" width="30" height="30" position="0 0 0"></a-plane>
        <!-- Blood-splatter layer: a second plane just above the floor
             (0.002m, to avoid z-fighting) carrying its own transparent
             canvas texture that gets painted on as cubes are hit — see
             paintSplat/paintSplatBurst below. Separate from the floor's
             own checkerboard texture entirely, so the checkerboard is
             never touched and shows through around the splats. -->
        <a-plane
          id="splat-layer"
          rotation="-90 0 0"
          width="30"
          height="30"
          position="0 0.002 0"
          material="shader: flat; transparent: true; alphaTest: 0.01; side: double"
        ></a-plane>
        <a-plane class="wall" width="30" height="6" position="0 3 -15" rotation="0 0 0" material="side: double; color: #2a3350"></a-plane>
        <a-plane class="wall" width="30" height="6" position="0 3 15" rotation="0 180 0" material="side: double; color: #2a3350"></a-plane>
        <a-plane class="wall" width="30" height="6" position="15 3 0" rotation="0 -90 0" material="side: double; color: #2a3350"></a-plane>
        <a-plane class="wall" width="30" height="6" position="-15 3 0" rotation="0 90 0" material="side: double; color: #2a3350"></a-plane>
      </a-entity>
      <a-sky color="#0d1526"></a-sky>

      <!-- ============================================================
           PLAYER RIG
           Everything the physical player can move (head + both hands) is
           nested under #rig. WebXR reports head/hand poses as each
           entity's *local* transform relative to its parent, so moving
           #rig in world space carries the whole play space with it while
           your real physical head/hand motion still reads correctly
           relative to that new spot. This is what lets "punch = move":
           punch-locomotion translates #rig itself, never the camera.
      ============================================================ -->
      <a-entity
        id="rig"
        position="0 0 0"
        punch-locomotion
        desktop-movement-input
        desktop-action-input="primaryAction: jab; secondaryAction: uppercut; leftHand: #leftHand; rightHand: #rightHand; dominantHand: right; alternateHands: true; chargeMs: 900; minimumStrength: 0.35"
        desktop-hand-presence="camera: #head; leftHand: #leftHand; rightHand: #rightHand; forward: 0.2; down: 0.13; spread: 0.2"
        semantic-punch-controls="camera: #head; leftHand: #leftHand; rightHand: #rightHand"
        semantic-look-controls="camera: #head"
        gamepad-input="leftHand: #leftHand; rightHand: #rightHand; primaryAction: jab; secondaryAction: uppercut; interactAction: activate; grabAction: none; watchAction: menu; backAction: back; crouchAction: none"
        touch-controls="leftHand: #leftHand; rightHand: #rightHand; primaryAction: jab; primaryLabel: JAB; secondaryAction: uppercut; secondaryLabel: UPPERCUT; interactAction: activate; interactLabel: USE; watchAction: menu; watchLabel: MENU"
        semantic-gaze-action="cursor: #gaze-cursor; action: activate"
      >
        <a-camera id="head" wasd-controls="enabled: false" punch-tracker>
          <a-text
            id="hud-text"
            value="Popped: 0"
            align="center"
            color="#FFFFFF"
            width="2"
            position="0 -0.35 -1"
          ></a-text>
          <a-text
            id="debug-text"
            value=""
            align="center"
            color="#9ad"
            width="1.1"
            position="0 0.55 -1"
          ></a-text>
          <!-- Toggled from the menu's MORE tab (Show Stats). Off by
               default — this is a playtesting aid for understanding what
               the new look-gated/lock-on punch targeting is doing, not
               something meant to stay on for normal play. -->
          <a-text
            id="stats-text"
            value=""
            align="center"
            color="#7CFC9A"
            width="1.1"
            position="0 0.85 -1"
            visible="false"
          ></a-text>
          <a-text
            id="punch-label"
            value=""
            align="center"
            color="#FFD166"
            width="4"
            position="0 0.2 -1"
            visible="false"
          ></a-text>
          <!-- Toggled from the menu's DEBUG tab (Live Debug HUD). Unlike
               stats-text (a snapshot of the *last completed* punch), this
               updates every single frame with the raw, live numbers the
               punch-detection state machine is actually reading right
               now — both hands' raw vs. head-relative speed and swing
               state, the current trigger/reset thresholds, and the turn
               filter — so a confusing moment in-headset can be read (or
               screenshotted) directly instead of guessed at blind. -->
          <a-text
            id="live-debug-text"
            value=""
            align="center"
            color="#FFAA55"
            width="0.9"
            position="0 1.15 -1"
            visible="false"
          ></a-text>

          <!-- Gaze reticle: lets a phone/desktop tester pop a cube by
               looking at it and clicking, same fallback pattern as Cube
               Pop. It doubles as the world menu's desktop/phone pointer
               too — world-menu-system widens its raycast target list to
               include menu buttons while the menu is open, so a mouse
               click still works there without real controllers. In VR
               proper, menu buttons are clicked with a per-hand laser
               pointer instead (see the hand entities below). -->
          <a-entity
            id="gaze-cursor"
            cursor="fuse: false"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
            material="color: #FFFFFF; shader: flat; opacity: 0.8"
            raycaster="objects: .cube-target; far: 10"
          ></a-entity>

          <!-- Comfort vignette: a camera-attached plane carrying a
               radial-gradient canvas texture (transparent center, opaque
               black edges — same "paint a <canvas>, apply as a texture"
               pattern already used for the floor/walls and blood
               splatter, so no external asset). Sits close to the near
               clip plane so it reads as darkening the edge of vision
               rather than a floating panel. Opacity is driven every
               frame by punch-locomotion.tick() from current rig speed —
               see buildVignetteTexture / the vignette* globals for the
               menu-tunable strength/size. depthTest:false so it always
               renders on top regardless of what it's nominally "behind".
          -->
          <a-entity
            id="vignette"
            geometry="primitive: plane; width: 3; height: 3"
            material="shader: flat; transparent: true; opacity: 0; side: double; depthTest: false"
            position="0 0 -0.3"
            visible="false"
          ></a-entity>
        </a-camera>

        <!-- Hands: no laser during normal play, on purpose — this is a
             boxing game, not a pointer game, so hit detection is real
             proximity between fist and cube (see punch-game below), not
             a raycast. oculus-touch-controls is the Quest-native controls
             component and is confirmed to actually bind on real Quest 2
             Touch controllers. model:false swaps the full controller
             model for a small sphere so the "fist" reads clearly in VR.

             Each hand also carries a raycaster+cursor pair, same pattern
             laser-controls itself uses, but pointed at `.menu-target`
             instead of `.cube-target` and left disabled (raycaster
             enabled:false, .menu-laser hidden) during normal punching.
             world-menu-system enables this on *at most one* hand at a
             time — whichever hand didn't press grip to open the menu —
             so there's never a moment where both hands are live pointers
             at once (that was the root cause of a trigger pull on one
             hand accidentally registering a click aimed by the other).

             cursor's downEvents/upEvents matter more than they look: left
             at their default (empty), the cursor component binds its
             click handling to *mouse/touch events on the canvas*, not to
             the controller's own trigger button — real trigger pulls only
             produced clicks via whatever synthetic click a given WebXR
             browser happens to fire on "select" for accessibility
             fallback purposes, which is exactly the kind of thing that
             would register "some of the time." Binding directly to
             triggerdown/triggerup (real events oculus-touch-controls
             already emits, the same ones punch-game's own quick-reset
             listens to) is unambiguous and confirmed via reading A-Frame
             1.6.0's cursor component source, not assumed. -->
        <a-entity
          id="leftHand"
          oculus-touch-controls="hand: left; model: false"
          semantic-hand="hand: left; moveSpeed: 1.8; turnSpeed: 540; desktopScale: 0.32"
          punch-tracker="edgeDetect: true"
          raycaster="objects: .menu-target; far: 5; enabled: false"
          cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        >
          <a-sphere radius="0.06" color="#EF476F" shader="flat" control-mode-visibility="modes: xr"></a-sphere>
          <!-- depth starts at 1 (unit length); laser-beam scales/repositions
               it every frame to stop exactly at whatever it's pointed at,
               instead of a fixed length that visibly pokes out the far
               side of the menu panel it's aimed at. -->
          <a-box
            class="menu-laser"
            width="0.006"
            height="0.006"
            depth="1"
            position="0 0 -0.5"
            material="color: #FFD166; shader: flat; opacity: 0.85"
            laser-beam="maxLength: 3"
            visible="false"
          ></a-box>
        </a-entity>
        <a-entity
          id="rightHand"
          oculus-touch-controls="hand: right; model: false"
          semantic-hand="hand: right; moveSpeed: 1.8; turnSpeed: 540; desktopScale: 0.32"
          punch-tracker="edgeDetect: true"
          raycaster="objects: .menu-target; far: 5; enabled: false"
          cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        >
          <a-sphere radius="0.06" color="#118AB2" shader="flat" control-mode-visibility="modes: xr"></a-sphere>
          <a-box
            class="menu-laser"
            width="0.006"
            height="0.006"
            depth="1"
            position="0 0 -0.5"
            material="color: #FFD166; shader: flat; opacity: 0.85"
            laser-beam="maxLength: 3"
            visible="false"
          ></a-box>
        </a-entity>
      </a-entity>

      <!-- ============================================================
           GAME MANAGER
           Unlike Cube Pop's fixed batch + win screen, this is an endless
           heavy-bag loop: always `count` cubes live, each pop spawns a
           fresh replacement immediately. That fits a fitness/reps framing
           better than a one-shot win state, and it's simpler to iterate
           on for a movement-feel POC.
      ============================================================ -->
      <a-entity id="cube-manager" punch-game="count: 6; behaviorMode: mixed"></a-entity>

      <!-- ============================================================
           WORLD MENU
           A single panel fixed in world space (NOT parented to the
           camera or a hand) — world-menu-system repositions it a couple
           feet in front of wherever the player is standing/looking each
           time it opens, facing back toward them. Replaced an earlier
           per-wrist "watch menu" design that turned out hard to aim at
           and to keep readable across a growing number of tabs.
      ============================================================ -->
      <a-entity id="world-menu" visible="false" scale="0.6 0.6 0.6"></a-entity>

      <a-entity world-menu-system></a-entity>
    </a-scene>

    <script type="module" src="../../common/semantic-punch.js"></script>
    <script>
      // ==============================================================
      // Small shared helpers
      // ==============================================================
      function clamp(v, lo, hi) {
        return Math.min(hi, Math.max(lo, v));
      }

      function degToRad(d) {
        return (d * Math.PI) / 180;
      }

      // Gets the world-space direction an entity is "pointing," using
      // this codebase's consistent local -Z-is-forward convention (same
      // one the menu-laser and punch directions use throughout). This is
      // deliberately NOT `el.object3D.getWorldDirection()` — that method
      // is only overridden to mean -Z for an actual THREE.Camera object;
      // for a plain Object3D (which is what an A-Frame entity's own
      // `.object3D` is, even <a-camera>'s — the real THREE.Camera lives
      // on a child object3D reachable via `.getObject3D('camera')`) it
      // returns +Z instead, silently pointing the opposite way. Fell
      // into that exact trap once already; this avoids it everywhere.
      var _forwardQuat = new THREE.Quaternion();
      function getForwardDirection(el, target) {
        el.object3D.getWorldQuaternion(_forwardQuat);
        return target.set(0, 0, -1).applyQuaternion(_forwardQuat);
      }

      // True while the menu is open. Read by punch-locomotion and
      // punch-game to disable punching (both locomotion and cube-popping)
      // and freeze rig physics while the player is fiddling with
      // settings, and by punch-game's trigger-reset handler so pulling
      // the trigger to click a menu item doesn't *also* reset the arena.
      var menuOpen = false;

      // Toggled from the menu's MORE tab (Show Stats). Read by
      // punch-locomotion to decide whether to bother updating the
      // in-view stats HUD after each punch.
      var showStatsOn = false;

      // Toggled from the menu's DEBUG tab (Live Debug HUD). Read by
      // punch-locomotion's tick to decide whether to bother refreshing
      // the always-live (not post-punch-snapshot) debug text every frame.
      var liveDebugOn = false;

      // Comfort vignette + "zoom" haptic buzz (menu, FEEL tab) — both
      // added for VR comfort/gamefeel and made tunable from the start
      // since neither can really be judged from outside a headset, and
      // comfort tolerance is personal. See punch-locomotion.tick() for
      // where both are actually driven from current rig speed.
      var vignetteEnabled = true;
      var vignetteStrength = 1.0; // 0-2, multiplies the max opacity a full-speed lunge reaches
      var vignetteSize = 1.0; // 0.6-1.4, scales the vignette plane itself — smaller plane = the darkened ring reaches further into the center
      var buzzHapticsEnabled = true;
      var buzzHapticsStrength = 1.0; // 0-2, multiplies pulse intensity

      // Global, menu-tunable knobs for the blood-splatter/knockback
      // system. Kept as plain globals (like menuOpen/showStatsOn above)
      // rather than component schema properties, since they apply
      // uniformly across every cube regardless of when it was spawned —
      // no per-entity attribute sync needed.
      var splatAmountMultiplier = 1.5; // scales splat size/opacity/blob-count
      var splatScatterMultiplier = 1.5; // scales how far blobs spread from the hit point
      var cubeKnockbackFactor = 0.15; // damage -> knockback speed (m/s per damage point)
      var cubeTrailEnabled = true;

      // An "extending" swing that never resolves (full extension or a
      // stop) within this long force-finishes anyway — guards against
      // e.g. slow continuous circular hand motion (arm circles) getting
      // stuck extended forever. Not expected to matter for a normal
      // punch or uppercut, which resolve in well under this.
      var MAX_SWING_MS = 2000;

      // ==============================================================
      // REACH CALIBRATION + EXTENSION-BASED PUNCH DETECTION
      //
      // Full redesign, replacing the old velocity-threshold swing state
      // machine (crossing triggerSpeed / falling back to resetSpeed).
      // Playtesting kept landing "either too hard to register or way too
      // twitchy," and Noah's framing of the actual fix was: stop asking
      // what a proper punch or uppercut *is* and start asking what a
      // player *thinks* they are doing — extending their fist forward
      // (a punch) or extending it overhead (an uppercut), regardless of
      // how fast or how far, cocked back or not.
      //
      // So detection is now based on how far the hand has physically
      // reached from an approximate torso reference point, expressed as
      // a *fraction of the player's own calibrated reach* — not raw
      // velocity. This is naturally robust to the single biggest false-
      // positive source discovered last round (turning your body while
      // holding a hand out): rotating your head/torso by some angle
      // rotates the hand's offset-from-torso vector by that same angle,
      // and rotates the torso's own forward direction by that same
      // angle too, so the *dot product between them* (what the forward-
      // extension fraction is built from) stays constant through a pure
      // body turn with a static arm pose. A real reach, by contrast,
      // changes that dot product directly. No velocity threshold can
      // offer that guarantee, however it's filtered.
      //
      // Reach is calibrated per player (menu, REACH tab -> Calibrate
      // Reach): a few seconds reaching forward, then a few seconds
      // reaching overhead, sampling the max hand-to-torso distance
      // (along the relevant axis) from *either* hand each phase. Until
      // calibrated, sensible adult-human defaults are used.
      // ==============================================================
      var reachForward = 0.55; // meters, calibrated (or default) forward reach from torsoRef
      var reachOverhead = 0.65; // meters, calibrated (or default) overhead reach from torsoRef
      var REACH_MIN = 0.25; // clamp on a calibration result that's clearly too small to be real
      var REACH_MAX = 1.0; // clamp on a calibration result that's clearly too large to be real
      var CALIBRATION_PHASE_MS = 3000; // how long each of the two calibration phases samples for
      var TORSO_HEAD_DROP = 0.25; // meters below head position used as an approximate shoulder/chest reference point

      // Extension fractions (0..1 of reachForward / reachOverhead) that
      // gate the state machine in punch-tracker: below ARM_THRESHOLD is
      // "not reaching," at/above it starts tracking a punch attempt, and
      // at/above the FULL threshold that attempt auto-fires regardless
      // of speed ("if they cross 90% of their reach, treat it like an
      // abrupt stop — the punch is thrown"). The other way to fire
      // mid-range is the hand's speed dropping back down (see
      // punch-tracker's stopSpeed schema field) — a slower, more
      // deliberate reach that never gets close to full extension still
      // counts once it visibly stops.
      var EXT_ARM_THRESHOLD = 0.4;
      var EXT_FORWARD_FULL_THRESHOLD = 0.9;
      var EXT_OVERHEAD_FULL_THRESHOLD = 0.8;

      // "Sticky" hit-assist for the locked-on target of a punch/uppercut
      // — see punch-locomotion.onPunch. 'off' is pure physical proximity
      // (punch-game.checkHand's own hitRadius check, unaffected by any
      // of this); 'cheat' guarantees the locked target actually takes
      // the hit the instant the punch fires, regardless of whether the
      // fist's real physical path would have reached it; 'turn'
      // guarantees the same hit but also snaps the rig's yaw a little
      // toward the target first, so the fist visually reads as landing
      // rather than the hit just happening invisibly. Exposed in the
      // menu (AIM tab) as an experiment, per Noah's ask to A/B whether
      // the turn is too disorienting or the cheat too obvious. Defaults
      // to 'turn': first real playtest found 'cheat' feeling wrong (a
      // hit registering with no visible reason it landed reads as
      // arbitrary), and 'turn' is the one built specifically to fix
      // that by giving the hit something to visibly land on.
      var hitAssistMode = 'turn'; // 'off' | 'cheat' | 'turn'
      var HIT_ASSIST_MODES = ['off', 'cheat', 'turn'];
      var TURN_ASSIST_MAX_DEGREES = 35; // cap on the one-shot yaw snap, so a wildly-off target doesn't spin the player

      // How long a glanced-at enemy stays "the thing I was probably
      // trying to punch" after the player's head turns away from it —
      // people often turn their head mid-swing, especially while
      // winding up, even though their eyes (and intent) stayed on the
      // target. Updated every frame in punch-locomotion.tick(); consumed
      // in onPunch only when the punch's *own* look-direction lock-on
      // search comes up empty.
      var RECENT_LOOK_MEMORY_MS = 1800;
      var RECENT_LOOK_RANGE_SLACK = 1.3; // extra range tolerance for a remembered (vs. fresh) target

      // The four "live" per-cube movement behaviors. Menu's cycle button
      // also offers "mixed", which isn't itself a movement behavior —
      // it means "assign each newly-spawned cube a random one of these."
      // 'idle' (formerly 'bob') used to float the cube up and down in
      // place; now that enemies are grounded humanoids, it just means
      // "stand still" — see cube-behavior.
      var CUBE_BEHAVIOR_MODES = ['idle', 'chase', 'patrol', 'wander'];

      // Cube knockback physics (cube-behavior) and cube-on-cube collision
      // (punch-game) tuning. Kept as plain constants rather than menu
      // knobs — cubeKnockbackFactor above already controls how hard a hit
      // launches a cube, and these just shape what happens after that.
      var CUBE_KNOCKBACK_FRICTION = 2.5; // exponential horizontal-velocity damping rate
      var CUBE_KNOCKBACK_GRAVITY = 9; // m/s^2, pulls a launched cube back toward the floor
      var CUBE_KNOCKBACK_MAX_SPEED = 6; // m/s cap, so a huge hit can't send a cube flying off-arena
      var CUBE_KNOCKBACK_MIN_SPEED = 0.05; // below this, a cube is considered settled again
      var CUBE_TRAIL_MIN_SPEED = 0.6; // m/s — a cube must be sliding at least this fast to leave a trail
      var CUBE_TRAIL_INTERVAL = 0.06; // seconds between trail dots while sliding
      var CUBE_COLLISION_RADIUS = 0.4; // meters between cube centers to count as a collision
      var CUBE_COLLISION_MIN_SPEED = 0.6; // a cube must be sliding at least this fast to hit another
      var CUBE_COLLISION_COOLDOWN_MS = 1000; // per-pair cooldown, so two cubes can't infinitely re-hit each other
      var CUBE_COLLISION_DAMAGE_PER_SPEED = 8; // damage dealt to cube B = cubeA's slide speed * this
      var CUBE_COLLISION_TRANSFER_FACTOR = 0.6; // fraction of cubeA's slide speed passed on as cubeB's new velocity

      // "Move fast and break things": a cube's knockback velocity that
      // gets suddenly zeroed by a hard surface (floor or wall — see
      // cube-behavior's room-bounds clamp and floor-landing logic) deals
      // impact damage proportional to how much speed was just lost.
      // Small stumbles/gentle landings (below the min) don't count —
      // only a genuinely hard stop does.
      var CUBE_ROOM_BOUND = 14; // meters, matches punch-locomotion's own player bounds/wall margin
      var CUBE_IMPACT_MIN_LOST_SPEED = 1.5; // m/s
      var CUBE_IMPACT_DAMAGE_PER_SPEED = 10; // damage per m/s lost above the minimum

      // A punch's knockback on a cube is primarily "straight away from
      // the player" (a clean push, not a wobbly reflection of whatever
      // direction the fist happened to be moving), angled only a little
      // by the actual swing direction, with the swing's vertical
      // component given partial (not full) credit as a launch — "if
      // there's upwards force, send them a little airborne," a downward
      // swing likewise adds a little downward velocity (which, on an
      // already-grounded target, immediately feeds into the impact-
      // damage system above: a downward punch that connects with a
      // standing enemy contributes to slamming them into the floor).
      var KNOCKBACK_ANGLE_BLEND = 0.3; // 0 = straight away from player, 1 = pure swing direction
      var KNOCKBACK_VERTICAL_FACTOR = 0.5; // fraction of the swing's vertical component kept as launch/slam

      // Lock-on lunges are capped so finishing off a cube you're already
      // standing next to gives a felt "thump" rather than launching you
      // past or through it — the direct fix for "the game moves me
      // around unexpectedly" during close-range combos. Distance-based
      // cap: lunge magnitude can't exceed (distance to target *
      // LOCK_DISTANCE_FACTOR + LOCK_MIN_MAGNITUDE), so magnitude scales
      // up smoothly as the target gets farther away instead of a hard
      // on/off cutoff.
      var LOCK_DISTANCE_FACTOR = 3.5;
      var LOCK_MIN_MAGNITUDE = 0.6;

      // When a punch has nothing to lock onto, the lunge direction is
      // mostly look direction, lightly nudged by the swing's own net
      // displacement — 0 would be pure look direction (ignore the swing
      // entirely), 1 would be the old 50/50-ish blend. Kept small
      // deliberately: "look at the thing you want to punch" is meant to
      // be the dominant intent signal now, not the swing's exact
      // trajectory (a fast, wobbly real swing's displacement direction
      // is a much noisier signal than where the player's eyes are).
      var PUNCH_DIR_BLEND = 0.25;

      // Comfort vignette tuning: opacity ramps toward VIGNETTE_MAX_OPACITY
      // (before the vignetteStrength menu multiplier) as rig speed
      // approaches VIGNETTE_REFERENCE_SPEED, smoothed with an exponential
      // decay (same damping shape as the movement/knockback physics
      // elsewhere in this file) so it doesn't flicker in and out on every
      // small speed fluctuation between punches.
      var VIGNETTE_REFERENCE_SPEED = 6; // m/s — rig speed at which the vignette reaches full strength
      var VIGNETTE_MAX_OPACITY = 0.85;
      var VIGNETTE_SMOOTH_TAU = 0.2; // seconds

      // "Zoom" haptic buzz tuning: while buzzHapticsEnabled and rig speed
      // is above BUZZ_MIN_SPEED, both hands get a short pulse every
      // BUZZ_INTERVAL_MS (intensity scaled by current speed, capped at 1)
      // — a real "sustained rumble" isn't offered by the WebXR haptics
      // API (just discrete pulses), so a buzz is approximated by firing
      // short pulses in quick succession.
      var BUZZ_MIN_SPEED = 1.0; // m/s
      var BUZZ_REFERENCE_SPEED = 8; // m/s — speed at which buzz intensity caps out
      var BUZZ_INTERVAL_MS = 90;
      var BUZZ_PULSE_MS = 55;

      // Set the instant a hand's hapticActuator is first found (or first
      // confirmed absent), read by the live debug HUD as "haptics: L
      // yes/no R yes/no" — a real, concrete answer to "is the vibration
      // just not there, or is something actually broken" instead of
      // guessing from outside the headset a second time.
      var hapticActuatorSeen = { left: null, right: null };

      // Haptics are a nice-to-have confirmation buzz on hit/punch, not
      // load-bearing — swallow anything unsupported rather than let a
      // missing hapticActuators API break the game. actuator.pulse()
      // returns a Promise (per the Gamepad Haptic Actuator spec) that
      // can reject — e.g. if a browser rejects overlapping pulse calls
      // on the same actuator — and a bare try/catch around a synchronous
      // call does NOT catch a rejected promise. With the "zoom" buzz
      // firing pulses on both hands roughly every 90ms during any
      // sustained fast movement, an unhandled rejection every cycle adds
      // up over a real play session; explicitly caught here so it can't
      // accumulate into instability.
      function pulseHaptics(handEl, intensity, durationMs) {
        var handKey = handEl && handEl.id === 'leftHand' ? 'left' : handEl && handEl.id === 'rightHand' ? 'right' : null;
        try {
          var tracked = handEl && handEl.components['tracked-controls'];
          var controller = tracked && tracked.controller;
          var actuator = controller && controller.hapticActuators && controller.hapticActuators[0];
          if (handKey && hapticActuatorSeen[handKey] === null) hapticActuatorSeen[handKey] = !!actuator;
          if (actuator) {
            var result = actuator.pulse(intensity, durationMs);
            if (result && typeof result.catch === 'function') result.catch(function () {});
          }
        } catch (e) {
          // ignore
        }
      }

      // Paints a simple 2-color checker pattern onto a <canvas> and
      // applies it as a tiled texture on an already-created (or
      // about-to-be-created) A-Frame primitive's mesh. Avoids any
      // external image asset/network dependency for the room's look.
      function applyCheckerTexture(el, colorA, colorB, repeatX, repeatY) {
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = 64;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = colorA;
        ctx.fillRect(0, 0, 64, 64);
        ctx.fillStyle = colorB;
        ctx.fillRect(0, 0, 32, 32);
        ctx.fillRect(32, 32, 32, 32);

        var texture = new THREE.CanvasTexture(canvas);
        texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(repeatX, repeatY);

        function apply() {
          var mesh = el.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
        if (el.getObject3D('mesh')) apply();
        else el.addEventListener('loaded', apply, { once: true });
      }

      // Paints a radial gradient onto a <canvas> — transparent center,
      // fading to opaque black at the edge — and applies it to the
      // #vignette plane's mesh. Same "generate the texture at runtime,
      // no external asset" approach as applyCheckerTexture/the splat
      // canvas above. Canvas pixels beyond the outer gradient stop stay
      // fully opaque black (CanvasGradient extends the last stop past
      // its radius), which is exactly what's wanted here — a plane's
      // corners, beyond the inscribed circle, read as fully masked.
      function buildVignetteTexture() {
        var size = 512;
        var canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        var ctx = canvas.getContext('2d');
        var center = size / 2;
        var gradient = ctx.createRadialGradient(center, center, size * 0.26, center, center, size * 0.5);
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,1)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, size, size);
        return new THREE.CanvasTexture(canvas);
      }

      function applyVignetteTexture(el) {
        var texture = buildVignetteTexture();
        function apply() {
          var mesh = el.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          mesh.material.map = texture;
          mesh.material.needsUpdate = true;
        }
        if (el.getObject3D('mesh')) apply();
        else el.addEventListener('loaded', apply, { once: true });
      }

      // ==============================================================
      // BLOOD SPLATTER
      // A single high-res canvas painted onto over time and applied as
      // the #splat-layer plane's texture (see the room markup above).
      // Each cube's *original*, undamaged color is what gets splattered
      // — the same color draining out of it via desaturation as it
      // takes damage ends up on the floor, so the room tells the story
      // of the fight as you go.
      //
      // World-to-canvas-pixel mapping is done by actually raycasting
      // straight down onto the #splat-layer mesh and reading back the
      // intersection's UV, rather than hand-deriving a formula from the
      // plane's rotation — this file has already gotten bitten twice by
      // wrong assumptions about which way a rotated/oriented object's
      // axes point (see getForwardDirection's comment), so for this one
      // the ground truth comes directly from three.js's own raycaster
      // instead of more manual reasoning about conventions.
      // ==============================================================
      var SPLAT_CANVAS_SIZE = 1024;
      var SPLAT_BASE_RADIUS = 0.22; // meters, before per-hit scaling and splatAmountMultiplier
      var SPLAT_BASE_OPACITY = 0.65;
      var SPLAT_TRAIL_RADIUS = 0.09; // small dots painted while a cube slides from knockback
      var SPLAT_TRAIL_OPACITY = 0.4;

      var splatCanvas = document.createElement('canvas');
      splatCanvas.width = splatCanvas.height = SPLAT_CANVAS_SIZE;
      var splatCtx = splatCanvas.getContext('2d');
      var splatTexture = new THREE.CanvasTexture(splatCanvas);

      var splatRaycaster = new THREE.Raycaster();
      var _splatRayOrigin = new THREE.Vector3();
      var _splatRayDir = new THREE.Vector3(0, -1, 0);

      function attachSplatTexture(el) {
        function apply() {
          var mesh = el.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          mesh.material.map = splatTexture;
          mesh.material.transparent = true;
          mesh.material.needsUpdate = true;
        }
        if (el.getObject3D('mesh')) apply();
        else el.addEventListener('loaded', apply, { once: true });
      }

      function clearSplatCanvas() {
        splatCtx.clearRect(0, 0, SPLAT_CANVAS_SIZE, SPLAT_CANVAS_SIZE);
        splatTexture.needsUpdate = true;
      }

      // Casts straight down from (worldX, 5, worldZ) onto the splat
      // layer and returns the canvas pixel that world point corresponds
      // to, or null if it somehow misses (shouldn't happen for any
      // point within the room). (1 - uv.y) accounts for CanvasTexture's
      // default flipY — verified empirically (paint a point, read the
      // pixel back) rather than assumed.
      function worldToSplatPixel(worldX, worldZ) {
        var splatEl = document.querySelector('#splat-layer');
        var mesh = splatEl && splatEl.getObject3D('mesh');
        if (!mesh) return null;

        _splatRayOrigin.set(worldX, 5, worldZ);
        splatRaycaster.set(_splatRayOrigin, _splatRayDir);
        var hits = splatRaycaster.intersectObject(mesh, true);
        if (!hits.length || !hits[0].uv) return null;

        return { x: hits[0].uv.x * SPLAT_CANVAS_SIZE, y: (1 - hits[0].uv.y) * SPLAT_CANVAS_SIZE };
      }

      // One organic-ish blob: a handful of randomly offset, randomly
      // sized overlapping circles rather than one perfect circle, so it
      // reads as a splat rather than a sticker. `splatAmountMultiplier`
      // and `splatScatterMultiplier` (menu, SPLAT tab) scale size/
      // opacity/blob-count and spread respectively, on top of whatever
      // radius/opacity the caller asked for — playtesting feedback was
      // that punch splats read as tight, sticker-like groupings under
      // the cube, so both the baseline constants above and the default
      // multipliers here start considerably more generous than a first
      // guess would.
      function paintSplat(worldX, worldZ, colorHex, radiusMeters, opacity) {
        var pixel = worldToSplatPixel(worldX, worldZ);
        if (!pixel) return;

        var effectiveRadius = radiusMeters * splatAmountMultiplier;
        var effectiveOpacity = clamp(opacity * splatAmountMultiplier, 0.08, 1);
        var pixelsPerMeter = SPLAT_CANVAS_SIZE / 30; // room is 30m across
        var pxRadius = effectiveRadius * pixelsPerMeter;

        splatCtx.fillStyle = colorHex;
        splatCtx.globalAlpha = effectiveOpacity;
        var blobCount = Math.round((4 + Math.random() * 3) * clamp(splatAmountMultiplier, 1, 2.5));
        for (var i = 0; i < blobCount; i++) {
          var angle = Math.random() * Math.PI * 2;
          var dist = Math.random() * pxRadius * 1.3 * splatScatterMultiplier;
          var bx = pixel.x + Math.cos(angle) * dist;
          var by = pixel.y + Math.sin(angle) * dist;
          var br = pxRadius * (0.4 + Math.random() * 0.6);
          splatCtx.beginPath();
          splatCtx.arc(bx, by, br, 0, Math.PI * 2);
          splatCtx.fill();
        }
        splatCtx.globalAlpha = 1;
        splatTexture.needsUpdate = true;
      }

      // A death burst: several splats scattered around the impact point
      // rather than one blob, for a bigger "explosion" moment. Also
      // scaled by splatAmountMultiplier (count) and splatScatterMultiplier
      // (spread radius), on top of the per-splat scaling paintSplat
      // already does.
      function paintSplatBurst(worldX, worldZ, colorHex) {
        var count = Math.round((6 + Math.random() * 4) * clamp(splatAmountMultiplier, 1, 2));
        for (var i = 0; i < count; i++) {
          var angle = Math.random() * Math.PI * 2;
          var dist = Math.random() * 0.7 * splatScatterMultiplier;
          paintSplat(
            worldX + Math.cos(angle) * dist,
            worldZ + Math.sin(angle) * dist,
            colorHex,
            SPLAT_BASE_RADIUS * (0.6 + Math.random() * 0.8),
            SPLAT_BASE_OPACITY * (0.7 + Math.random() * 0.3)
          );
        }
      }

      // ==============================================================
      // COMPONENT: punch-tracker
      // Attached to each hand and to the head. Tracks *local* position
      // deltas (i.e. relative to the #rig parent) frame to frame to get
      // real physical velocity of that body part — deliberately NOT
      // world-space velocity. If we used world position, a hand's
      // apparent velocity would include however fast #rig itself is
      // currently drifting from a previous punch, which would let one
      // hard swing bootstrap runaway "phantom" punches forever. Local
      // position sidesteps that: your rig can be flying across the arena
      // and a stationary hand still reads as zero velocity.
      //
      // When edgeDetect is on (hands only, not the head), it runs TWO
      // independent extension-fraction state machines — one for a
      // forward punch, one for an uppercut — instead of the old single
      // velocity-threshold swing detector. See the big REACH CALIBRATION
      // comment block above for the full rationale; in short: each axis
      // tracks how far the hand has reached from an approximate torso
      // point, as a fraction of the player's own calibrated reach along
      // that axis, and moves through three states:
      //   armed        - fraction below EXT_ARM_THRESHOLD (0.4). Ready.
      //   extending    - fraction crossed 0.4; accumulating max speed,
      //                  hand path length, head path length, same swing
      //                  stats as before. Fires ("punch" event) the
      //                  instant either (a) fraction crosses the FULL
      //                  threshold (0.9 forward / 0.8 overhead — treated
      //                  like an abrupt stop, the punch is thrown) or
      //                  (b) the hand's (head-relative) speed drops back
      //                  down near zero — a slower, more deliberate
      //                  reach that stops without ever fully extending.
      //   holdForReset - already fired; ignored until the hand comes
      //                  back behind the arm threshold, at which point
      //                  it re-arms. This is the whole "extend enough to
      //                  punch, retract enough to punch again" model —
      //                  deliberately easy to explain to a player.
      //
      // Both hands run both axes independently and simultaneously; a
      // diagonal swing that crosses both thresholds can fire both a
      // punch and an uppercut event from one physical motion, which
      // reads as (and is treated as) one bigger compound hit rather than
      // something to specifically prevent.
      //
      // Also tracks whether the underlying WebXR controller is actually
      // connected, surfaced in punch-locomotion's debug HUD line — a
      // direct way to see, in-headset, whether both hands are being
      // recognized at all (as opposed to a movement-feel/tuning issue).
      // ==============================================================
      AFRAME.registerComponent('punch-tracker', {
        schema: {
          edgeDetect: { type: 'boolean', default: false },
          // Hand (head-relative) speed at/below this counts as "the
          // reach has stopped" while extending — the secondary trigger
          // for a punch/uppercut that never reaches full extension. Not
          // a trigger threshold any more (extension fraction owns that
          // job entirely) — purely "has the motion visibly stopped."
          stopSpeed: { type: 'number', default: 0.35 },
          // How much of the head's own current velocity to subtract from
          // this hand's velocity before comparing against stopSpeed — 0
          // is raw hand velocity, 1 fully filters it out. Extension-
          // fraction detection is already largely immune to body-turn
          // false positives by construction (rotating hand and head
          // offsets by the same angle preserves their dot product), but
          // this still guards the *stop* check: turning your body while
          // holding an already-extended pose shouldn't read as "stopped
          // early" from turn-induced velocity noise. Exposed in the
          // menu's DEBUG tab as "Turn Filter".
          headBlend: { type: 'number', default: 1.0 },
        },

        init: function () {
          this.prevLocal = this.el.object3D.position.clone();
          this.velocity = new THREE.Vector3();
          this.worldPos = new THREE.Vector3();
          this.speed = 0; // head-relative speed, used for the "stopped" check
          this.rawSpeed = 0; // unblended hand speed — used for magnitude/damage, and the debug HUD
          this.hasPrev = false;
          this.connected = false;
          this._relVelocity = new THREE.Vector3();

          if (this.data.edgeDetect) {
            this.head = document.querySelector('#head');
            this.torsoRef = new THREE.Vector3();
            this.headForwardLocal = new THREE.Vector3();
            this.fwd = this._makeAxisState();
            this.up = this._makeAxisState();
          }

          var self = this;
          this.el.addEventListener('controllerconnected', function () {
            self.connected = true;
            // The entity sits at its declared (0,0,0)-ish rest position
            // until a real controller connects and starts driving its
            // pose. Without this reseed, that stale pre-connection
            // position leaks into the first tick after connecting as a
            // huge one-frame "velocity" spike, which could look like (or
            // start) an extension that never really happened.
            self.hasPrev = false;
            if (self.data.edgeDetect) {
              self.fwd.state = 'armed';
              self.up.state = 'armed';
            }
          });
          this.el.addEventListener('controllerdisconnected', function () { self.connected = false; });
        },

        _makeAxisState: function () {
          return {
            state: 'armed', // 'armed' | 'extending' | 'holdForReset'
            maxSpeed: 0,
            handDist: 0,
            headDist: 0,
            startTime: 0,
            startLocalPos: new THREE.Vector3(),
            prevHeadPos: new THREE.Vector3(),
          };
        },

        tick: function (time, deltaMs) {
          if (!deltaMs) return;
          var dt = deltaMs / 1000;
          var localPos = this.el.object3D.position;

          if (this.hasPrev) {
            this.velocity.subVectors(localPos, this.prevLocal).divideScalar(dt);
            this.rawSpeed = this.velocity.length();

            if (this.data.edgeDetect && this.head) {
              // Subtract (a fraction of) the head's own current velocity
              // — see headBlend's schema comment for why. The head's
              // punch-tracker instance ticks independently; reading its
              // velocity here is at most one frame stale, which is
              // imperceptible at VR frame rates.
              var headTracker = this.head.components['punch-tracker'];
              var headVel = headTracker ? headTracker.velocity : null;
              if (headVel) {
                this._relVelocity
                  .copy(this.velocity)
                  .addScaledVector(headVel, -this.data.headBlend);
                this.speed = this._relVelocity.length();
              } else {
                this.speed = this.rawSpeed;
              }
            } else {
              this.speed = this.rawSpeed;
            }
          }
          this.prevLocal.copy(localPos);
          this.hasPrev = true;

          // Hit-testing against cubes (which live in world space, outside
          // the rig) needs the real world position, separately from the
          // rig-relative velocity above.
          this.el.object3D.getWorldPosition(this.worldPos);

          if (!this.data.edgeDetect || !this.head) return;

          // Approximate torso/shoulder reference point and this frame's
          // flattened (horizontal-only) forward direction, both in
          // rig-local space to stay consistent with localPos above —
          // local space is used throughout rather than world space
          // specifically so this still works correctly if the rig ever
          // gets yaw-rotated (see punch-locomotion's turn-assist hit-
          // assist mode): a child entity's own *local* position/rotation
          // never changes just because its parent rotates.
          var headLocal = this.head.object3D.position;
          this.torsoRef.set(headLocal.x, headLocal.y - TORSO_HEAD_DROP, headLocal.z);
          this.headForwardLocal.set(0, 0, -1).applyQuaternion(this.head.object3D.quaternion);
          this.headForwardLocal.y = 0;
          if (this.headForwardLocal.lengthSq() > 0.0001) this.headForwardLocal.normalize();
          else this.headForwardLocal.set(0, 0, -1);

          var offsetX = localPos.x - this.torsoRef.x;
          var offsetY = localPos.y - this.torsoRef.y;
          var offsetZ = localPos.z - this.torsoRef.z;

          var forwardExt = offsetX * this.headForwardLocal.x + offsetZ * this.headForwardLocal.z;
          var forwardFrac = clamp(forwardExt / reachForward, 0, 1.3);
          var overheadFrac = clamp(offsetY / reachOverhead, 0, 1.3);

          this._updateAxis(this.fwd, 'forward', forwardFrac, EXT_FORWARD_FULL_THRESHOLD, localPos, time, dt);
          this._updateAxis(this.up, 'overhead', overheadFrac, EXT_OVERHEAD_FULL_THRESHOLD, localPos, time, dt);
        },

        _updateAxis: function (st, axisName, extFrac, fullThreshold, localPos, time, dt) {
          if (st.state === 'armed') {
            if (extFrac >= EXT_ARM_THRESHOLD) {
              st.state = 'extending';
              st.maxSpeed = this.rawSpeed;
              st.handDist = 0;
              st.headDist = 0;
              st.startTime = time;
              st.startLocalPos.copy(localPos);
              if (this.head) st.prevHeadPos.copy(this.head.object3D.position);
            }
            return;
          }

          if (st.state === 'extending') {
            // maxSpeed (and its accumulation here) deliberately tracks
            // rawSpeed, not the head-relative speed used for the stop
            // check below — a punch thrown while stepping/leaning in
            // should still get full credit for that commitment in the
            // magnitude formula.
            st.maxSpeed = Math.max(st.maxSpeed, this.rawSpeed);
            st.handDist += this.velocity.length() * dt;
            if (this.head) {
              var headPos = this.head.object3D.position;
              st.headDist += headPos.distanceTo(st.prevHeadPos);
              st.prevHeadPos.copy(headPos);
            }

            var fullyExtended = extFrac >= fullThreshold;
            var stopped = this.speed <= this.data.stopSpeed;
            var timedOut = time - st.startTime > MAX_SWING_MS;

            if (!fullyExtended && !stopped && !timedOut) return;

            st.state = 'holdForReset';

            var displacement = new THREE.Vector3().subVectors(localPos, st.startLocalPos);
            var dist = displacement.length();
            var dir = dist > 0.001 ? displacement.divideScalar(dist) : null;
            if (dir && !isFinite(dir.x)) dir = null;

            this.el.emit(
              'punch',
              {
                direction: dir, // may be null; punch-locomotion falls back to look direction
                extensionAxis: axisName,
                maxSpeed: st.maxSpeed,
                handTravelDist: st.handDist,
                headTravelDist: st.headDist,
                fullyExtended: fullyExtended,
              },
              true
            );
            return;
          }

          // st.state === 'holdForReset'
          if (extFrac < EXT_ARM_THRESHOLD) st.state = 'armed';
        },
      });

      // ==============================================================
      // findLockOnTarget: among live (unpopped) cubes, finds the one
      // closest to dead-center of the player's aim — within `maxRange`
      // of `originPos` and within `maxAngleRad` of `lookDir` — and
      // returns its element, or null if nothing qualifies. Ties (well,
      // "closest to center" ties) go to whichever is checked first;
      // not worth being fussier about for this few cubes.
      // ==============================================================
      function findLockOnTarget(originPos, lookDir, maxRange, maxAngleRad) {
        var cubes = document.querySelectorAll('.cube-target');
        var best = null;
        var bestAngle = Infinity;
        var toCube = new THREE.Vector3();
        var cubePos = new THREE.Vector3();

        for (var i = 0; i < cubes.length; i++) {
          var cube = cubes[i];
          var target = cube.components['punch-target'];
          if (!target || target.popped) continue;

          cube.object3D.getWorldPosition(cubePos);
          toCube.subVectors(cubePos, originPos);
          var dist = toCube.length();
          if (dist > maxRange || dist < 0.001) continue;

          toCube.divideScalar(dist);
          var angle = toCube.angleTo(lookDir);
          if (angle <= maxAngleRad && angle < bestAngle) {
            bestAngle = angle;
            best = cube;
          }
        }

        return best;
      }

      // ==============================================================
      // COMPONENT: punch-locomotion
      // Lives on #rig. Listens for "punch" events bubbling up from the
      // hands (see punch-tracker's swing state machine for how a punch's
      // direction/stats are computed) and turns each one into a velocity
      // impulse, then integrates that velocity into rig position every
      // frame (gravity, ground collision, drag). This is the whole
      // "punch to move" mechanic.
      //
      // There's no look-cone gate any more (see onPunch's own comment for
      // why the old one — rejecting a punch whose net displacement
      // direction was too far from where the player was looking — is
      // structurally unnecessary now: punch-tracker's extension-fraction
      // trigger physically can't fire from a pure cock-back to begin
      // with). Movement direction leans on the player's *look* direction
      // as the primary intent signal instead, per Noah's framing that a
      // player's real intent is "I'm looking at the thing I want to hit,"
      // not the exact physical trajectory of their swing:
      //
      // If a live cube is within `lockOnConeAngle` of your aim and close
      // enough (`baseLockRange`, extended a bit by how committed the
      // swing was — or the "recently looked at" memory if your head has
      // since turned away, see updateRecentLookTarget), the punch locks
      // onto it and moves you straight toward it, with the target's
      // distance capping how big that lunge can be. Sticky hit-assist
      // (menu, AIM tab) then decides what happens to the locked target
      // itself — 'off' leaves it to plain physical proximity
      // (punch-game.checkHand), 'cheat' guarantees the hit lands the
      // instant the punch fires regardless of physical accuracy, 'turn'
      // does the same plus a small one-shot view snap toward the target.
      // Otherwise (no lock) the movement direction is mostly look
      // direction, lightly nudged by the swing's own net displacement
      // (PUNCH_DIR_BLEND) — so punching with nothing to aim at still
      // generally sends you where you're looking.
      //
      // Impulse magnitude comes from three swing stats together — how
      // fast the hand was moving at its peak, how far the hand
      // travelled, and how far the head travelled over the same window
      // (rewarding leaning/stepping into a punch, not just flicking the
      // wrist) — combined via speedFactor/handDistFactor/headDistFactor
      // and then scaled by `powerMultiplier`, the one knob exposed to
      // the player as "Move Speed" in the menu.
      // ==============================================================
      AFRAME.registerComponent('punch-locomotion', {
        schema: {
          speedFactor: { type: 'number', default: 1.1 },
          handDistFactor: { type: 'number', default: 4.5 },
          headDistFactor: { type: 'number', default: 6.0 },
          // Widened from 25/1.5 — the whole point of the reach-based
          // redesign is "if I'm even sorta close to the right direction
          // my attack should hit," so lock-on should trigger liberally.
          lockOnConeAngle: { type: 'number', default: 40 }, // degrees
          baseLockRange: { type: 'number', default: 2.0 }, // meters
          lockRangeFactor: { type: 'number', default: 0.15 },
          maxSpeed: { type: 'number', default: 14 },
          desktopMoveSpeed: { type: 'number', default: 1.5 },
          gravity: { type: 'number', default: 5.5 },
          groundStopTau: { type: 'number', default: 0.12 },
          airDragTau: { type: 'number', default: 1.0 },
          bounds: { type: 'number', default: 14 },
          powerMultiplier: { type: 'number', default: 3.0 },
        },

        init: function () {
          this.velocity = new THREE.Vector3();
          this.grounded = true;
          this.head = document.querySelector('#head');
          this.leftHand = document.querySelector('#leftHand');
          this.rightHand = document.querySelector('#rightHand');
          this.debugText = document.querySelector('#debug-text');
          this.statsText = document.querySelector('#stats-text');
          this.liveDebugText = document.querySelector('#live-debug-text');
          this.labelText = document.querySelector('#punch-label');
          this.labelTimeout = null;

          this.vignetteEl = document.querySelector('#vignette');
          this.vignetteOpacity = 0;
          this.buzzAccumMs = 0;

          this.lookDir = new THREE.Vector3();
          this.headWorldPos = new THREE.Vector3();
          this.finalDir = new THREE.Vector3();
          this.lastStats = null;

          // "Recently looked at" target memory — see the RECENT_LOOK_*
          // constants' comment. Refreshed every tick (not gated on
          // menuOpen the way movement is, so it stays current the
          // instant the menu closes) whenever a live cube is currently
          // within a generous glance cone/range of the player's look
          // direction.
          this.recentLookTarget = null;
          this.recentLookTime = 0;

          // Reach calibration state — see startCalibration/updateCalibration.
          this.calibrating = false;
          this.calibPhase = 0;
          this.calibMaxForward = 0;
          this.calibMaxOverhead = 0;
          this.calibPhaseEndTime = 0;

          this.onPunch = this.onPunch.bind(this);
          this.onSemanticMove = this.onSemanticMove.bind(this);
          this.el.addEventListener('punch', this.onPunch);
          this.el.addEventListener('semantic-move', this.onSemanticMove);
        },

        onSemanticMove: function (evt) {
          if (!evt.detail || menuOpen || this.calibrating) return;
          var direction = new THREE.Vector3(evt.detail.x || 0, 0, evt.detail.z || 0);
          if (direction.lengthSq() < 0.0001) return;
          var cameraQuaternion = new THREE.Quaternion();
          this.head.object3D.getWorldQuaternion(cameraQuaternion);
          direction.applyQuaternion(cameraQuaternion);
          direction.y = 0;
          direction.normalize().multiplyScalar(this.data.desktopMoveSpeed * (evt.detail.deltaMs / 1000));
          this.el.object3D.position.add(direction);
          this.el.object3D.position.x = clamp(this.el.object3D.position.x, -this.data.bounds, this.data.bounds);
          this.el.object3D.position.z = clamp(this.el.object3D.position.z, -this.data.bounds, this.data.bounds);
        },

        // No more hard look-cone gate ("BLOCKED") — the old one existed
        // to reject a cock-back's net displacement direction, but that
        // whole failure mode is now structurally impossible: a pure
        // retraction never crosses the extension threshold to begin
        // with (see punch-tracker), since armed->extending requires
        // *starting* below the threshold and moving up past it. With
        // that gone, movement direction leans heavily on look direction
        // (finalDir below, or the locked target's actual position),
        // only lightly nudged by the swing's own displacement — "look
        // at the thing you want to punch" is now the primary intent
        // signal, not the swing's exact trajectory.
        onPunch: function (evt) {
          if (menuOpen || this.calibrating) return;

          var punchDir = evt.detail.direction; // may be null (see punch-tracker)
          var maxSpeed = evt.detail.maxSpeed;
          var handDist = evt.detail.handTravelDist;
          var headDist = evt.detail.headTravelDist || 0;
          var axis = evt.detail.extensionAxis;
          var fullyExtended = evt.detail.fullyExtended;

          getForwardDirection(this.head, this.lookDir);
          this.head.object3D.getWorldPosition(this.headWorldPos);

          var magnitude = this.computeMagnitude(maxSpeed, handDist, headDist);

          // Targeting, in priority order: (1) whatever's currently
          // dead-ahead within a generous cone/range, (2) the "recently
          // looked at" memory, for when the head has since turned away
          // mid-swing (common, especially winding up) even though the
          // player's intent didn't change, (3) nothing — blended-
          // direction lunge with no lock.
          var lockRange = this.data.baseLockRange + magnitude * this.data.lockRangeFactor;
          var lockConeRad = degToRad(this.data.lockOnConeAngle);
          var target = findLockOnTarget(this.headWorldPos, this.lookDir, lockRange, lockConeRad);
          var usedMemory = false;

          if (!target && this.recentLookTarget) {
            var recentComp = this.recentLookTarget.components['punch-target'];
            var recentFresh = recentComp && !recentComp.popped && Date.now() - this.recentLookTime < RECENT_LOOK_MEMORY_MS;
            if (recentFresh) {
              var memPos = new THREE.Vector3();
              this.recentLookTarget.object3D.getWorldPosition(memPos);
              if (memPos.distanceTo(this.headWorldPos) <= lockRange * RECENT_LOOK_RANGE_SLACK) {
                target = this.recentLookTarget;
                usedMemory = true;
              }
            }
          }

          // Lock-on lunges are capped by how far away the target
          // actually is: (distance * LOCK_DISTANCE_FACTOR +
          // LOCK_MIN_MAGNITUDE). Without this, finishing off a cube
          // you're already standing next to applies the SAME full
          // magnitude as a lunge from across the room, flinging the
          // player past/through it instead of landing a controlled
          // close-range hit.
          var appliedMagnitude = magnitude;
          var distToTarget = 0;
          var hitAssisted = false;

          if (target) {
            var targetPos = new THREE.Vector3();
            target.object3D.getWorldPosition(targetPos);
            this.finalDir.subVectors(targetPos, this.headWorldPos);
            distToTarget = this.finalDir.length();
            this.finalDir.normalize();

            var cappedMagnitude = distToTarget * LOCK_DISTANCE_FACTOR + LOCK_MIN_MAGNITUDE;
            if (cappedMagnitude < appliedMagnitude) appliedMagnitude = cappedMagnitude;

            // Sticky hit-assist: guarantee this locked target actually
            // takes the hit the instant the punch fires, regardless of
            // whether the fist's real physical path would have reached
            // it — the direct answer to "I punch towards an enemy and
            // fly past it, missing entirely." 'turn' additionally snaps
            // the view a little toward the target so the miss doesn't
            // look like one; see hitAssistMode's top-of-file comment.
            if (hitAssistMode !== 'off') {
              var targetComp = target.components['punch-target'];
              if (targetComp && !targetComp.popped) {
                targetComp.hit(this.finalDir.clone(), magnitude, this.headWorldPos.clone());
                hitAssisted = true;
                if (hitAssistMode === 'turn') this.nudgeYawToward(target);
              }
            }
          } else {
            // No lock: mostly look direction, only lightly nudged by
            // the swing's own net displacement (or straight look
            // direction if punch-tracker couldn't compute one).
            var swingDir = punchDir || this.lookDir;
            this.finalDir
              .copy(this.lookDir)
              .multiplyScalar(1 - PUNCH_DIR_BLEND)
              .addScaledVector(swingDir, PUNCH_DIR_BLEND)
              .normalize();
          }

          this.velocity.x += this.finalDir.x * appliedMagnitude;
          this.velocity.y += this.finalDir.y * appliedMagnitude;
          this.velocity.z += this.finalDir.z * appliedMagnitude;

          var totalSpeed = this.velocity.length();
          if (totalSpeed > this.data.maxSpeed) {
            this.velocity.multiplyScalar(this.data.maxSpeed / totalSpeed);
          }

          var outcome = axis === 'overhead' ? 'UPPERCUT!' : 'PUNCH!';
          if (target) outcome = (axis === 'overhead' ? 'UPPERCUT ' : '') + 'LOCK-ON!' + (usedMemory ? ' (recall)' : '');

          this.lastStats = {
            axis: axis,
            fullyExtended: fullyExtended,
            maxSpeed: maxSpeed,
            handDist: handDist,
            headDist: headDist,
            magnitude: magnitude,
            appliedMagnitude: appliedMagnitude,
            capped: appliedMagnitude < magnitude,
            distToTarget: distToTarget,
            locked: !!target,
            usedMemory: usedMemory,
            hitAssisted: hitAssisted,
            outcome: outcome,
          };
          this.updateStatsHud();
          this.showLabel(outcome + (this.lastStats.capped ? ' (close)' : ''));
          pulseHaptics(evt.target, target ? 0.9 : 0.5, target ? 80 : 60);
        },

        // Same formula used for both "how far does this punch lunge the
        // player" and "how much damage does this punch do to a cube" —
        // punch-game's checkHand calls this directly rather than having
        // its own separate notion of punch force, per Noah's ask that
        // cube damage use the same calculation as player movement.
        computeMagnitude: function (maxSpeed, handDist, headDist) {
          return (
            (maxSpeed * this.data.speedFactor +
              handDist * this.data.handDistFactor +
              headDist * this.data.headDistFactor) *
            this.data.powerMultiplier
          );
        },

        tick: function (time, deltaMs) {
          if (!deltaMs) return;

          if (this.calibrating) {
            this.updateCalibration();
            return; // frozen during calibration, same as while the menu is open
          }
          if (menuOpen) return; // freeze in place while the menu is open

          this.updateRecentLookTarget();

          var dt = Math.min(deltaMs / 1000, 0.05); // guard against huge steps (tab switch, etc.)
          var pos = this.el.object3D.position;

          if (!this.grounded || this.velocity.y > 0) {
            this.velocity.y -= this.data.gravity * dt;
          }

          pos.x += this.velocity.x * dt;
          pos.y += this.velocity.y * dt;
          pos.z += this.velocity.z * dt;

          if (pos.y <= 0) {
            pos.y = 0;
            this.velocity.y = 0;
            this.grounded = true;
          } else {
            this.grounded = false;
          }

          pos.x = clamp(pos.x, -this.data.bounds, this.data.bounds);
          pos.z = clamp(pos.z, -this.data.bounds, this.data.bounds);

          // Exponential decay: fast stop on the ground so a lunge resolves
          // into a stance instead of an endless ice-skating slide (a big
          // part of what would make this nauseating), slow decay in the
          // air so a jump/lunge keeps its momentum through the arc —
          // this is also what makes juggling/hovering between airborne
          // punches feel controllable rather than just falling straight
          // back down between hits.
          var tau = this.grounded ? this.data.groundStopTau : this.data.airDragTau;
          var damping = Math.exp(-dt / tau);
          this.velocity.x *= damping;
          this.velocity.z *= damping;

          var speed = this.velocity.length();

          if (this.debugText) {
            var leftTracker = this.leftHand && this.leftHand.components['punch-tracker'];
            var rightTracker = this.rightHand && this.rightHand.components['punch-tracker'];
            var handsStatus =
              'L:' + (leftTracker && leftTracker.connected ? 'ok' : '--') +
              ' R:' + (rightTracker && rightTracker.connected ? 'ok' : '--');
            this.debugText.setAttribute(
              'value',
              'rig speed: ' + speed.toFixed(1) + ' m/s' + (this.grounded ? '' : ' (air)') + '\n' + handsStatus
            );
          }

          this.updateVignette(speed, dt);
          this.updateBuzzHaptics(speed, deltaMs);

          if (liveDebugOn) this.updateLiveDebugHud();
        },

        // Comfort vignette: fades the camera-attached radial-gradient
        // plane's opacity toward VIGNETTE_MAX_OPACITY * vignetteStrength
        // as rig speed approaches VIGNETTE_REFERENCE_SPEED, exponentially
        // smoothed so it doesn't flicker between frames. vignetteSize
        // scales the plane itself rather than repainting the texture —
        // cheaper, and avoids regenerating a canvas on every menu tweak.
        //
        // Deliberately mutates the THREE.js mesh/material/object3D
        // directly rather than going through el.setAttribute() — this
        // runs every single frame (unlike everything else in this file
        // that calls setAttribute, which only fires on discrete events
        // like a punch or a menu click), and setAttribute's schema-diff-
        // and-fire-update-handlers machinery is real, avoidable overhead
        // to pay 70-90 times a second for what's just two number writes.
        updateVignette: function (speed, dt) {
          if (!this.vignetteEl) return;
          var mesh = this.vignetteEl.getObject3D('mesh');
          if (!mesh || !mesh.material) return; // texture/mesh not attached yet

          if (!vignetteEnabled) {
            if (this.vignetteOpacity !== 0) {
              this.vignetteOpacity = 0;
              mesh.material.opacity = 0;
              this.vignetteEl.object3D.visible = false;
            }
            return;
          }

          var speedFrac = clamp(speed / VIGNETTE_REFERENCE_SPEED, 0, 1);
          // vignetteStrength goes up to 2 (200%) so the strongest
          // setting is still clearly "more" than the default even at
          // low speed, but material opacity itself is only meaningful
          // in [0,1] — THREE.js won't error on a higher value (a
          // renderer just treats it as fully opaque), but there's no
          // reason to hand it a number outside the range it means.
          var targetOpacity = clamp(speedFrac * VIGNETTE_MAX_OPACITY * vignetteStrength, 0, 1);
          var smoothing = Math.exp(-dt / VIGNETTE_SMOOTH_TAU);
          this.vignetteOpacity = clamp(targetOpacity + (this.vignetteOpacity - targetOpacity) * smoothing, 0, 1);

          this.vignetteEl.object3D.scale.setScalar(vignetteSize);
          mesh.material.opacity = this.vignetteOpacity;
          this.vignetteEl.object3D.visible = this.vignetteOpacity > 0.01;
        },

        // "Zoom" haptic buzz: short pulses to both hands, roughly every
        // BUZZ_INTERVAL_MS, while moving faster than BUZZ_MIN_SPEED —
        // see BUZZ_* constants' comment for why this is pulses rather
        // than a true sustained rumble.
        updateBuzzHaptics: function (speed, deltaMs) {
          if (!buzzHapticsEnabled || speed < BUZZ_MIN_SPEED) {
            this.buzzAccumMs = 0;
            return;
          }
          this.buzzAccumMs += deltaMs;
          if (this.buzzAccumMs < BUZZ_INTERVAL_MS) return;
          this.buzzAccumMs = 0;

          var intensity = clamp((speed / BUZZ_REFERENCE_SPEED) * buzzHapticsStrength, 0, 1);
          pulseHaptics(this.leftHand, intensity, BUZZ_PULSE_MS);
          pulseHaptics(this.rightHand, intensity, BUZZ_PULSE_MS);
        },

        // Refreshes the "recently looked at" memory whenever a live
        // cube is currently within a generous glance cone/range of the
        // player's look direction — deliberately the same cone/range
        // lock-on itself uses, since "close enough to lock onto" and
        // "close enough to remember glancing at" are the same bar.
        updateRecentLookTarget: function () {
          getForwardDirection(this.head, this.lookDir);
          this.head.object3D.getWorldPosition(this.headWorldPos);
          var glanceRange = this.data.baseLockRange + 3;
          var glanceConeRad = degToRad(this.data.lockOnConeAngle);
          var glanced = findLockOnTarget(this.headWorldPos, this.lookDir, glanceRange, glanceConeRad);
          if (glanced) {
            this.recentLookTarget = glanced;
            this.recentLookTime = Date.now();
          }
        },

        // Rotates the rig by angleRad around the world Y axis, pivoting
        // on the given world point (the head's current position) rather
        // than the rig's own translation origin — so it reads as "you
        // turned in place" instead of swinging your whole body through
        // an arc around wherever the rig's origin happens to sit (which,
        // for a room-scale player who's walked around, may not be
        // anywhere near them).
        applyYawAroundPoint: function (angleRad, pivotWorldPos) {
          var rigPos = this.el.object3D.position;
          var dx = rigPos.x - pivotWorldPos.x;
          var dz = rigPos.z - pivotWorldPos.z;
          var cos = Math.cos(angleRad);
          var sin = Math.sin(angleRad);
          rigPos.x = pivotWorldPos.x + (dx * cos - dz * sin);
          rigPos.z = pivotWorldPos.z + (dx * sin + dz * cos);
          this.el.object3D.rotation.y += angleRad;
        },

        // 'turn' hit-assist: snaps the view a little toward the locked
        // target so a guaranteed hit also *looks* landed. Applied as an
        // instant one-shot rotation, not an animated turn — smooth/
        // animated camera rotation is well known to be a worse motion-
        // sickness offender in VR than an instant snap (the same reason
        // "snap turn" is usually the comfort-preferred way to turn via
        // locomotion), and the whole point of offering this as an
        // alternative to 'cheat' is to be the more comfortable option.
        nudgeYawToward: function (targetEl) {
          var targetPos = new THREE.Vector3();
          targetEl.object3D.getWorldPosition(targetPos);
          var headPos = new THREE.Vector3();
          this.head.object3D.getWorldPosition(headPos);

          var toTarget = new THREE.Vector3(targetPos.x - headPos.x, 0, targetPos.z - headPos.z);
          if (toTarget.lengthSq() < 0.0001) return;
          toTarget.normalize();

          var lookFlat = new THREE.Vector3();
          getForwardDirection(this.head, lookFlat);
          lookFlat.y = 0;
          if (lookFlat.lengthSq() < 0.0001) return;
          lookFlat.normalize();

          var angle = Math.atan2(
            lookFlat.x * toTarget.z - lookFlat.z * toTarget.x,
            lookFlat.x * toTarget.x + lookFlat.z * toTarget.z
          );
          var maxAngle = degToRad(TURN_ASSIST_MAX_DEGREES);
          angle = clamp(angle, -maxAngle, maxAngle);
          this.applyYawAroundPoint(angle, headPos);
        },

        // Kicks off the two-phase reach calibration (menu, REACH tab).
        // Punching and rig physics are frozen for its duration (tick()
        // early-returns into updateCalibration instead), and the menu
        // is expected to already be closed by the caller so the player
        // can freely see the prompt and move their arms.
        startCalibration: function () {
          this.calibrating = true;
          this.calibPhase = 0;
          this.calibMaxForward = 0;
          this.calibMaxOverhead = 0;
          this.calibPhaseEndTime = Date.now() + CALIBRATION_PHASE_MS;
          this.showLabel('Reach FORWARD with both arms!', CALIBRATION_PHASE_MS);
        },

        // Samples both hands' offset from an approximate torso reference
        // point every frame during calibration, taking the max forward
        // (phase 0) or vertical (phase 1) component seen from *either*
        // hand — same torsoRef/forward-direction math as punch-tracker's
        // live extension-fraction calculation, just computing the raw
        // calibration numbers rather than a fraction of them.
        updateCalibration: function () {
          if (!this._calibTorsoRef) {
            this._calibTorsoRef = new THREE.Vector3();
            this._calibForward = new THREE.Vector3();
          }
          var headLocal = this.head.object3D.position;
          this._calibTorsoRef.set(headLocal.x, headLocal.y - TORSO_HEAD_DROP, headLocal.z);
          this._calibForward.set(0, 0, -1).applyQuaternion(this.head.object3D.quaternion);
          this._calibForward.y = 0;
          if (this._calibForward.lengthSq() > 0.0001) this._calibForward.normalize();
          else this._calibForward.set(0, 0, -1);

          var hands = [this.leftHand, this.rightHand];
          for (var i = 0; i < hands.length; i++) {
            var handEl = hands[i];
            if (!handEl) continue;
            var handLocal = handEl.object3D.position;
            var offsetX = handLocal.x - this._calibTorsoRef.x;
            var offsetY = handLocal.y - this._calibTorsoRef.y;
            var offsetZ = handLocal.z - this._calibTorsoRef.z;
            if (this.calibPhase === 0) {
              var fwd = offsetX * this._calibForward.x + offsetZ * this._calibForward.z;
              if (fwd > this.calibMaxForward) this.calibMaxForward = fwd;
            } else if (offsetY > this.calibMaxOverhead) {
              this.calibMaxOverhead = offsetY;
            }
          }

          if (Date.now() < this.calibPhaseEndTime) return;

          if (this.calibPhase === 0) {
