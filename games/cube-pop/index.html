<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cube Pop — WebXR Prototype</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      A-Frame, vendored into /vendor instead of loaded from the CDN. Still
      no npm install, no build step — just a checked-in file. It defines
      the <a-scene>, <a-box>, etc. HTML elements used below, and gives us
      the default "Enter VR" button for free whenever it detects a
      WebXR-capable browser (like Quest Browser).

      AFRAME_CDN_ROOT must be set before the script loads: a few built-in
      components (hand-controls' hand models, <a-text>'s default font)
      fetch their assets from this base path at runtime rather than
      bundling them, so it needs to point at our vendored copies of those
      too — see /vendor/README.md.

      Pinned to a specific version so this page doesn't break if a future
      A-Frame release changes behavior.
    -->
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>

    <style>
      /* This CSS only affects the flat HTML page around the 3D canvas
         (instructions banner, desktop reset button). None of it is visible
         inside the headset — VR text/UI has to be built as scene entities,
         which is what the <a-text> elements further down are for. */
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
      }
      #overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 0.75rem 1rem;
        background: rgba(0, 0, 0, 0.55);
        color: white;
        z-index: 1;
        font-size: 0.9rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
      }
      #overlay a {
        color: #9ad;
      }
      #reset-button-html {
        font-size: 0.9rem;
        padding: 0.35rem 0.75rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- Flat HTML overlay: just for desktop/browser testing convenience.
         Inside the headset you'll use the in-scene "RESET" cube instead. -->
    <div id="overlay">
      <span>Cube Pop — VR: point and trigger. Desktop: WASD, mouse look, click to pop. <a href="../../index.html">All prototypes</a></span>
      <button id="reset-button-html">Reset (desktop)</button>
    </div>

    <a-scene>
      <!-- ============================================================
           ASSETS / LOOK OF THE SCENE
           A plain ground plane and a sky color so there's a sense of
           space. A-Frame automatically adds a default ambient +
           directional light when a scene has no <a-light> of its own,
           so we don't need to declare lighting here.
      ============================================================ -->
      <a-plane
        rotation="-90 0 0"
        width="20"
        height="20"
        color="#445"
        position="0 0 0"
      ></a-plane>
      <a-sky color="#0d1526"></a-sky>

      <!-- ============================================================
           PLAYER RIG
           A-Frame's default camera already sits at human eye height
           (1.6m) and, on a Quest 2, is automatically driven by the
           headset's real position/rotation once you enter VR — no extra
           code needed for head tracking.

           The HUD text is a child of the camera, so it moves with your
           view and stays readable both on the flat screen and in VR.

           The small ring is a "gaze reticle": a cursor that raycasts
           straight out from the center of the camera view, so you can
           test on a phone or desktop with no VR headset/controllers at
           all. Aim by looking around (phone tilt via gyroscope, or mouse
           drag on desktop) so the reticle sits on a cube, then tap the
           screen (or click) to pop it — cursor's default behavior fires
           the same "click" event a controller trigger would. This is
           purely additive: on an actual Quest 2 you'll aim with the
           controller lasers instead, and the reticle just sits inertly
           in the middle of your view.
      ============================================================ -->
      <a-entity
        id="cube-rig"
        locomotion-demo="speed: 1.5"
        desktop-movement-input
        desktop-hand-presence="camera: #cube-camera; leftHand: #left-hand; rightHand: #right-hand"
      >
      <a-camera id="cube-camera" wasd-controls="enabled: false">
        <a-text
          id="hud-text"
          value="Popped: 0 / 5"
          align="center"
          color="#FFFFFF"
          width="2"
          position="0 -0.35 -1"
        ></a-text>
        <a-entity
          cursor="fuse: false"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.005; radiusOuter: 0.008"
          material="color: #FFFFFF; shader: flat; opacity: 0.8"
          raycaster="objects: .cube-target, .reset-target; far: 10"
        ></a-entity>
      </a-camera>

      <!-- ============================================================
           CONTROLLERS
           hand-controls renders A-Frame's built-in animated hand model
           (instead of a plastic controller replica) and auto-detects the
           connected controller (Quest Touch included) to drive its pose.

           Unlike laser-controls, hand-controls doesn't add a pointer by
           itself, so we wire up cursor + raycaster manually:
           - raycaster.objects restricts what the ray can hit to just our
             interactive entities (cubes + the reset button) — otherwise
             it would also try to intersect the ground/sky.
           - cursor.downEvents/upEvents map the trigger button to the
             same "click" event our components listen for (these are the
             same event names laser-controls used under the hood).
      ============================================================ -->
      <a-entity
        id="left-hand"
        hand-controls="hand: left"
        semantic-hand="hand: left; desktopScale: 0.55"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        raycaster="objects: .cube-target, .reset-target; far: 10; showLine: true"
      ></a-entity>
      <a-entity
        id="right-hand"
        hand-controls="hand: right"
        semantic-hand="hand: right; desktopScale: 0.55"
        cursor="fuse: false; downEvents: triggerdown; upEvents: triggerup"
        raycaster="objects: .cube-target, .reset-target; far: 10; showLine: true"
      ></a-entity>
      </a-entity>

      <!-- ============================================================
           GAME MANAGER
           An empty entity that owns the game logic (see the "cube-game"
           component registered below). Cubes get spawned as children of
           this entity, and it listens for the "cube-popped" event that
           bubbles up from each cube when it's clicked.
      ============================================================ -->
      <a-entity id="cube-manager" cube-game="count: 5">
        <a-text
          id="win-text"
          value="You win!"
          align="center"
          color="#FFD166"
          width="4"
          position="0 2.4 -3"
          visible="false"
        ></a-text>

        <!-- The in-VR reset control. It's just a box + label with the
             same "clickable" class as the cubes, so the exact same
             laser/trigger interaction resets the game. -->
        <a-entity
          id="reset-target-vr"
          class="reset-target"
          geometry="primitive: box; width: 0.8; height: 0.35; depth: 0.1"
          material="color: #06D6A0"
          position="0 1.7 -3"
          visible="false"
        >
          <a-text
            value="RESET"
            align="center"
            color="#062"
            width="3"
            position="0 0 0.06"
          ></a-text>
        </a-entity>
      </a-entity>
    </a-scene>

    <script type="module" src="../../common/locomotion.js"></script>
    <script type="module" src="../../common/desktop-input.js"></script>
    <script>
      // ==============================================================
      // COMPONENT: poppable
      // Attached to each cube. Handles what happens when *this* cube is
      // clicked (i.e. hit with a controller trigger pull): a quick white
      // flash, a shrink-down animation, then removal from the scene.
      // ==============================================================
      AFRAME.registerComponent('poppable', {
        init: function () {
          this.popped = false;
          this.onClick = this.onClick.bind(this);
          this.el.addEventListener('click', this.onClick);
        },

        onClick: function () {
          // Guard against the trigger firing twice on the same cube
          // during the pop animation.
          if (this.popped) return;
          this.popped = true;

          // Flash white so the pop reads as clear, instant feedback.
          this.el.setAttribute('material', 'color', '#FFFFFF');

          // Animate scale down to (near) zero. A-Frame's animation
          // component runs this over `dur` milliseconds.
          this.el.setAttribute('animation__pop', {
            property: 'scale',
            to: '0.001 0.001 0.001',
            dur: 150,
            easing: 'easeInBack',
          });

          var el = this.el;
          setTimeout(function () {
            // "cube-popped" bubbles up the DOM to the #cube-manager
            // entity, which is listening for it (see the cube-game
            // component below).
            el.emit('cube-popped');
            el.parentNode.removeChild(el);
          }, 150);
        },

        remove: function () {
          this.el.removeEventListener('click', this.onClick);
        },
      });

      // ==============================================================
      // COMPONENT: cube-game
      // The game manager. Spawns a fresh batch of cubes, tracks how many
      // have been popped, updates the HUD, and shows/handles the
      // win + reset state.
      // ==============================================================
      AFRAME.registerComponent('cube-game', {
        schema: {
          count: { type: 'number', default: 5 },
        },

        init: function () {
          this.hud = document.querySelector('#hud-text');
          this.winText = document.querySelector('#win-text');
          this.resetTarget = document.querySelector('#reset-target-vr');

          this.onCubePopped = this.onCubePopped.bind(this);
          this.reset = this.reset.bind(this);

          // Listens for events bubbling up from child cube entities.
          this.el.addEventListener('cube-popped', this.onCubePopped);

          // Same reset handler for both the in-VR button and the
          // desktop HTML button in the overlay.
          this.resetTarget.addEventListener('click', this.reset);
          document
            .querySelector('#reset-button-html')
            .addEventListener('click', this.reset);

          this.reset();
        },

        // Clears any existing cubes and spawns a brand new set.
        reset: function () {
          // Remove previously spawned cubes (anything still tagged
          // "cube-target" under the manager).
          var oldCubes = this.el.querySelectorAll('.cube-target');
          for (var i = 0; i < oldCubes.length; i++) {
            oldCubes[i].parentNode.removeChild(oldCubes[i]);
          }

          this.popped = 0;
          this.total = this.data.count;
          this.updateHud();
          this.winText.setAttribute('visible', false);
          this.resetTarget.setAttribute('visible', false);

          var colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2', '#7B2CBF'];
          var radius = 2.2;

          for (var c = 0; c < this.total; c++) {
            // Spread the cubes in an arc in front of the player rather
            // than a straight line, so they don't overlap from the
            // player's point of view.
            var angle = (c - (this.total - 1) / 2) * 0.35; // radians
            var x = radius * Math.sin(angle);
            var z = -radius * Math.cos(angle);
            var y = 1.4 + Math.random() * 0.6;

            var cube = document.createElement('a-entity');
            cube.setAttribute('geometry', {
              primitive: 'box',
              width: 0.35,
              height: 0.35,
              depth: 0.35,
            });
            cube.setAttribute('material', { color: colors[c % colors.length] });
            cube.setAttribute('position', { x: x, y: y, z: z });
            // "cube-target" is what raycaster.objects on the controllers
            // is filtering for; "poppable" is the interaction behavior.
            cube.classList.add('cube-target');
            cube.setAttribute('poppable', '');

            // A gentle up/down bob so the cubes read as floating rather
            // than sitting on invisible shelves.
            cube.setAttribute('animation__bob', {
              property: 'position',
              dir: 'alternate',
              loop: true,
              dur: 1500 + Math.random() * 1000,
              easing: 'easeInOutSine',
              to: x + ' ' + (y + 0.15) + ' ' + z,
            });

            this.el.appendChild(cube);
          }
        },

        onCubePopped: function () {
          this.popped++;
          this.updateHud();
          if (this.popped >= this.total) {
            this.winText.setAttribute('visible', true);
            this.resetTarget.setAttribute('visible', true);
          }
        },

        updateHud: function () {
          this.hud.setAttribute(
            'text',
            'value',
            'Popped: ' + this.popped + ' / ' + this.total
          );
        },
      });
    </script>
  </body>
</html>
