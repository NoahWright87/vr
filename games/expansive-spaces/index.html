<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Expansive Spaces | Noah's VR projects</title>
    <link rel="icon" href="../../assets/noah-vr.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>window.AFRAME_CDN_ROOT = '../../vendor/aframe-1.6.0/';</script>
    <script src="../../vendor/aframe-1.6.0/aframe-v1.6.0.min.js"></script>
    <script type="module" src="./room.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #overlay { position: absolute; top: 0; left: 0; right: 0; z-index: 1;
        display: flex; justify-content: space-between; gap: 1rem; padding: .75rem 1rem;
        background: rgba(4, 10, 22, .8); color: #f4f8ff; font-size: .9rem; }
      #overlay a { color: #9ad; white-space: nowrap; }
      #overlay small { display: block; margin-top: .3rem; color: #bac9df; }
    </style>
  </head>
  <body>
    <div id="overlay">
      <span><strong>Expansive Spaces</strong> · Explore rooms and test movement effects.
        <small>Explore connected rooms. Green floor = current room. Watch: movement settings and map.
          Desktop: WASD / Shift sprint / C crouch / Tab watch / ` visor / B binoculars / right-click aim / left-click shot.</small></span>
      <a href="../../index.html">All prototypes</a>
    </div>

    <template id="watch-crossbar-template">
      <a-entity class="watch-crossbar-panel" visible="false">
        <a-entity class="watch-crossbar" position="0 .17 0"
          crossbar-menu="page: expansive-watch; font: sourcecodepro; width: 1.2; rowHeight: .2; maxChars: 22; open: false; closeBehavior: hide; memory: temporary; hint: false; stickRange: .35; crumbs: title; breadcrumbDepth: 1; plateOpacity: .94; exitKey: Tab; exitButton: WATCH; sidecarWidth: 1; sidecarChars: 28; sidecarContentHeight: .76"
          crossbar-menu-registration></a-entity>
      </a-entity>
    </template>

    <!-- comfort-scrim ignoreMotion: the rig is moved under you on purpose
         (redirected walking), and a scrim would give it away. -->
    <a-scene keyboard-shortcuts="enterVR: false" visor-menu="page: expansive-visor; font: sourcecodepro" comfort-scrim="ignoreMotion: true" background="color: #b1d5ef" webxr="referenceSpaceType: local-floor; optionalFeatures: bounded-floor">
      <a-light type="ambient" color="#e4edff" intensity=".85"></a-light>
      <a-light type="directional" color="#fff4df" intensity=".5" position="1 3 1"></a-light>
      <a-entity id="space-room" expansive-space>
        <a-entity id="space-landscape" scope-landscape></a-entity>
        <!-- Shared checker source; rendered room floors reuse this canvas in metric UVs. -->
        <a-plane id="space-floor" visible="false" rotation="-90 0 0" width="1" height="1" checker-floor></a-plane>
        <a-entity id="space-wall-panel" position="0 1.6 -1.48">
          <a-plane width="1.48" height="1.55" color="#101827"></a-plane>
          <a-text font="sourcecodepro" value="EXPANSIVE SPACES" align="center" color="#f8fafc" width="2.7" position="0 .6 .01"></a-text>
          <a-text font="sourcecodepro" class="space-status" value="Preview boundary - 4.0 x 3.0 m\n1. Foyer - World 1.50x" align="center" color="#7dd3fc" width="1.9" wrap-count="40" position="0 .4 .01"></a-text>
          <a-entity boundary-map="width: 1.28; height: .96" position="0 -.13 .01"></a-entity>
          <a-text font="sourcecodepro" value="Orange: real   Purple: game\nCyan: boundary   Green: current room" align="center" color="#bfcee2" width="1.85" position="0 -.68 .01"></a-text>
        </a-entity>
      </a-entity>

      <!-- One pose transform combines translation gain and optional yaw effects.
           The map and ground outline still represent the physical boundary. -->
      <a-entity id="space-rig" speed-dependent-gain locomotion-demo="speed: 1.2; moveMode: none; turnMode: none; comfortVignette: false"
        semantic-look-controls="camera: #space-camera"
        gamepad-input="leftHand: #left-hand; rightHand: #right-hand; aimAction: aim; sprintAction: sprint; secondaryAction: crouch"
        touch-controls="leftHand: #left-hand; rightHand: #right-hand; primaryAction: activate; primaryLabel: SHOT; interactAction: none; watchAction: watch; watchLabel: WATCH; grabAction: grab; grabLabel: GRAB; aimAction: aim; aimLabel: AIM; crouchAction: crouch; crouchLabel: CROUCH"
        desktop-controls="camera: #space-camera; leftHand: #left-hand; rightHand: #right-hand">
        <a-camera id="space-camera" wasd-controls="enabled: false" look-controls="pointerLockEnabled: true"></a-camera>
        <a-entity id="left-hand" class="hand" hand-with-watch="hand: left" semantic-hand="hand: left; maxReach: 1"></a-entity>
        <a-entity control-mode-visibility="modes: xr" hand-controls="hand: left; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>
        <a-entity id="right-hand" class="hand" hand-with-watch="hand: right" semantic-hand="hand: right; maxReach: 1"></a-entity>
        <a-entity control-mode-visibility="modes: xr" hand-controls="hand: right; handModelStyle: lowPoly; color: #3a3a3a"></a-entity>
        <a-entity id="space-neck-anchor">
          <a-entity id="space-binoculars" simple-grabbable="heldPosition: 0 0 -.08; gravity: 0"
            hint-zone="action: grab; radius: .32; maxReach: 1; gazeThreshold: .85; priority: 15; desktopKey: F; desktopLabel: Grab binoculars; xrKey: GRIP; xrLabel: Grab binoculars; hintOffset: 0 .13 0"
            space-binoculars></a-entity>
        </a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
